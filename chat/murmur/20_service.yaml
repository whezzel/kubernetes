---
apiVersion: v1
kind: Service
metadata:
  name: murmur-lb
  namespace: chat
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mumble.whezzel.com
spec:
  selector:
    app: murmur
  ports:
    - protocol: UDP
      name: murmur-udp
      port: 64738
      targetPort: murmur-udp
    - protocol: TCP
      name: murmur-tcp
      port: 64738
      targetPort: murmur-tcp
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
