---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: murmur
  namespace: chat
spec:
  capacity:
    storage: 128Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: murmur
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: chat
    name: murmur
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: murmur
  namespace: chat
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 128Mi
  volumeName: murmur
  storageClassName: longhorn
