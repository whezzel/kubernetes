---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: murmur
  namespace: chat
  labels:
    app: murmur
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: murmur
  template:
    metadata:
      name: murmur
      labels:
        app: murmur
    spec:
      containers:
        - name: murmur
          image: ghcr.io/goofball222/murmur:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 64738
              protocol: TCP
              name: murmur-tcp
            - containerPort: 64738
              protocol: UDP
              name: murmur-udp
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: murmur
              mountPath: /opt/murmur/config
              subPath: config
            - name: murmur
              mountPath: /opt/murmur/cert
              subPath: cert
            - name: murmur
              mountPath: /opt/murmur/data
              subPath: data
            - name: murmur
              mountPath: /opt/murmur/log
              subPath: log
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: murmur
          persistentVolumeClaim:
            claimName: murmur
