---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: murmur-deployment
  namespace: chat
  labels:
    app: murmur
  annotations: 
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: murmur
  template:
    metadata:
      labels:
        app: murmur
      name: murmur
    spec:
      containers:
        - name: murmur
          image: goofball222/murmur:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 64738
              protocol: TCP
              hostPort: 64738
            - containerPort: 64738
              protocol: UDP
              hostPort: 64738
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: murmur
              mountPath: /opt/murmur/config
              subPath: config
            - name: murmur
              mountPath: /opt/murmur/cert
              subPath: cert
            - name: murmur
              mountPath: /opt/murmur/data
              subPath: data
            - name: murmur
              mountPath: /opt/murmur/log
              subPath: log
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: murmur
          persistentVolumeClaim:
            claimName: murmur-pvc