---
apiVersion: v1
kind: Service
metadata:
  name: murmur-udp
  namespace: chat
spec:
  selector:
    app: murmur
  ports:
    - protocol: UDP
      name: murmur-udp
      port: 64738
      targetPort: murmur-udp
  type: LoadBalancer
  sessionAffinity: ClientIP

---
apiVersion: v1
kind: Service
metadata:
  name: murmur-tcp
  namespace: chat
spec:
  selector:
    app: murmur
  ports:
    - protocol: TCP
      name: murmur-tcp
      port: 64738
      targetPort: murmur-tcp
  type: LoadBalancer
  sessionAffinity: ClientIP
