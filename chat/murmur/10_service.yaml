---
apiVersion: v1
kind: Service
metadata:
  name: murmur-lb
  namespace: chat
spec:
#  ipFamilyPolicy: PreferDualStack
  selector:
    app: murmur
  ports:
    - protocol: UDP
      name: murmur-udp
      port: 64738
      targetPort: murmur-udp
    - protocol: TCP
      name: murmur-tcp
      port: 64738
      targetPort: murmur-tcp
  type: LoadBalancer
  sessionAffinity: ClientIP
