---
apiVersion: v1
kind: Namespace
metadata:
  name: seedbox
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr-service
  namespace: seedbox
spec:
  selector:
    app: sonarr
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8989
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr-ingress
  namespace: seedbox
spec:
  rules:
    - host: sonarr.nomacsec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr-service
                port:
                  number: 80
    - host: sonarr-k3s.nomacsec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr-service
                port:
                  number: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config-pvc
  namespace: seedbox
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-sas
  resources:
    requests:
      storage: 250Mi