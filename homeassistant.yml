---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant-service
  namespace: homeassistant
spec:
  type: ExternalName
  externalName: homeassistant.nomacsec.com
  ports:
  - port: 8123
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: homeassistant-https
  namespace: homeassistant
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: homeassistant-headers
  namespace: homeassistant
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeassistant-ingress-http
  namespace: homeassistant
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web   
    traefik.ingress.kubernetes.io/router.middlewares: homeassistant-homeassistant-https@kubernetescrd
spec:
  rules:
    - host: home-k3s.nomacsec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeassistant-service
                port:
                  number: 8123
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeassistant-ingress-https
  namespace: homeassistant
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"       
    traefik.ingress.kubernetes.io/router.middlewares: homeassistant-homeassistant-headers@kubernetescrd
spec:
  tls:
  - secretName: nomacsec.com-tls
  rules:
    - host: home-k3s.nomacsec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeassistant-service
                port:
                  number: 8123
