---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shinobi
  namespace: cctv
  labels:
    app: shinobi
  annotations: 
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shinobi
  template:
    metadata:
      labels:
        app: shinobi
      name: shinobi
    spec:
      containers:
        - name: shinobi
          image: shinobisystems/shinobi:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: webui
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: shinobi-streams 
              mountPath: /dev/shm/streams
            - name: shinobi
              mountPath: /config
              subPath: config
            - name: shinobi
              mountPath: /home/Shinobi/libs/customAutoLoad
              subPath: customAutoLoad
            - name: nas-shinobi
              mountPath: /home/Shinobi/videos
            - name: shinobi 
              mountPath: /home/Shinobi/plugins
              subPath: plugins
            - name: shinobi
              mountPath: /var/lib/mysql
              subPath: database
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: shinobi-streams
          hostPath:
            path: /dev/shm/shinobi-streams
        - name: shinobi
          persistentVolumeClaim:
            claimName: shinobi
        - name: nas-shinobi
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/shinobi