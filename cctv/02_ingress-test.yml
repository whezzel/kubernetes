---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: cctv-https-test
  namespace: cctv
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: cctv-headers-test
  namespace: cctv
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cctv-ingress-test
  namespace: cctv
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: cctv-cctv-https-test@kubernetescrd
spec:
  rules:
    - host: shinobi-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shinobi-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cctv-ingress-https-test
  namespace: cctv
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"       
    traefik.ingress.kubernetes.io/router.middlewares: cctv-cctv-headers-test@kubernetescrd
spec:
  rules:
    - host: shinobi-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shinobi-service
                port:
                  number: 80