---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: cctv
  labels:
    app: frigate
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      name: frigate
      labels:
        app: frigate
    spec:
      nodeSelector:
        kubernetes.io/hostname: archserv01
      containers:
        - name: frigate
          securityContext:
            privileged: true
          #image: blakeblackshear/frigate:stable-amd64
          image: blakeblackshear/frigate:stable-amd64nvidia
          imagePullPolicy: Always
          env:
            - name: TZ
              value: America/Chicago
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility,video
          envFrom:
            - secretRef:
                name: frigate
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
              hostPort: 5000
            - name: rtmp
              containerPort: 1935
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: nas-frigate
              mountPath: /media/frigate/
            - name: db
              mountPath: /mnt/db
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          configMap:
            name: frigate
        - name: db
          persistentVolumeClaim:
            claimName: frigate
        - name: nas-frigate
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/frigate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
