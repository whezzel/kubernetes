---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: cctv
  labels:
    app: frigate
  annotations: 
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
      name: frigate
    spec:
      containers:
        - name: frigate
          image: blakeblackshear/frigate:stable-amd64
          imagePullPolicy: Always
          env:
            - name: TZ
              value: America/Chicago
          ports:
            - name: webui
              containerPort: 5000
              protocol: TCP
            - name: rtmp
              containerPort: 1935
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10             
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          configMap:
            name: frigate
        - name: data
          persistentVolumeClaim:
            claimName: frigate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
