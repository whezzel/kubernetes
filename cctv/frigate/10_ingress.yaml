---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: frigate-https
  namespace: cctv
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: frigate-headers
  namespace: cctv
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frigate-http
  namespace: cctv
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web   
    traefik.ingress.kubernetes.io/router.middlewares: cctv-frigate-https@kubernetescrd
spec:
  rules:
    - host: frigate.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frigate
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frigate-https
  namespace: cctv
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"       
    traefik.ingress.kubernetes.io/router.middlewares: cctv-frigate-headers@kubernetescrd
spec:
  tls:
  - secretName: whezzel.com-tls
  rules:
    - host: frigate.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frigate
                port:
                  number: 80