---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate
  namespace: cctv
data:
  config.yml: |
    mqtt:
      # Required: mqtt-server host name
      #host: mqtt.whezzel.com
      host: mosquitto-tcp.homeassistant
      port: 1883
      topic_prefix: frigate
      user: frigate
      password: '{FRIGATE_MQTT_PASSWORD}'
    detectors:
       coral:
         type: edgetpu
         device: usb
    database:
      path: /mnt/db/frigate.db
    objects:
      track:
        - person
        - cat
        - dog
    birdseye:
      enabled: True
      mode: continuous
    record:
      enabled: True
    snapshots:
      enabled: True
      bounding_box: True
    cameras:
      cam1:
        ffmpeg:
          hwaccel_args: preset-nvidia-h264
          input_args:
            - -rtsp_transport
            - tcp
          inputs:
            - path: 'rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@cam1.whezzel.com:554/cam/realmonitor?channel=1&subtype=0'
              input_args: preset-rtsp-restream
              roles:
                - record
                - detect
        record:
          enabled: True
        snapshots:
          enabled: True
          bounding_box: True
        detect:
          fps: 10
        objects:
          filters:
            person:
              mask:
                - 77,106,112,97,102,62,67,67
                - 120,283,187,279,232,320,274,319,232,248,167,194,117,198
                - 456,311,515,302,495,255,441,257
      cam2:
        ffmpeg:
          hwaccel_args: preset-nvidia-h264
          input_args:
            - -rtsp_transport
            - tcp
          inputs:
            - path: 'rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@cam2.whezzel.com:554/cam/realmonitor?channel=1&subtype=0'
              input_args: preset-rtsp-restream
              roles:
                - record
                - detect
        record:
          enabled: True
        snapshots:
          enabled: True
          bounding_box: True
        detect:
          fps: 10
      cam3:
        ffmpeg:
          hwaccel_args: preset-nvidia-h264
          input_args:
            - -rtsp_transport
            - tcp
          inputs:
            - path: 'rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@cam3.whezzel.com:554/cam/realmonitor?channel=1&subtype=0'
              input_args: preset-rtsp-restream
              roles:
                - record
                - rtsp
                - detect
        record:
          enabled: True
        snapshots:
          enabled: True
          bounding_box: True
        detect:
          fps: 10
        objects:
          filters:
            person:
              mask:
                - 638,543,719,540,715,431,650,427
                - 549,220,600,221,601,133,551,135
