---
apiVersion: v1
kind: Service
metadata:
  name: frigate
  namespace: cctv
spec:
  selector:
    app: frigate
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  ports:
    - name: http-auth
      protocol: TCP
      port: 80
      targetPort: http-auth
    - name: http
      protocol: TCP
      port: 81
      targetPort: http-unauth
    - name: rtsp
      protocol: TCP
      port: 8554
      targetPort: rtsp
