apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-configmap
  namespace: cctv
data:
  config.yml: |
    mqtt:
      # Required: mqtt-server host name
      host: homeassistant.nomacsec.com
    detectors:
      # coral:
      #   type: edgetpu
      #   device: usb
      cpu1:
        type: cpu
    cameras:
      frontporch:
        ffmpeg:
          inputs:
            - path: rtsp://<CAM_USERNAME>:<CAM_PASSWORD>@frontporch-cam.nomacsec.com:554/s0
              roles:
                - detect
                - rtmp
        width: 1920
        height: 1080
        fps: 25
      driveway:
        ffmpeg:
          inputs:
            - path: rtsp://<CAM_USERNAME>:<CAM_PASSWORD>@driveway-cam.nomacsec.com:554/
              roles:
                - detect
                - rtmp
        width: 2592
        height: 1944
        fps: 20

    
