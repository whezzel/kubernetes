---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: cctv
  labels:
    app: frigate
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      name: frigate
      labels:
        app: frigate
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        coral-present: "true"
        nvidia-present: "true"
      containers:
        - name: frigate
          securityContext:
            privileged: true
          image: ghcr.io/blakeblackshear/frigate:stable
          imagePullPolicy: Always
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
            - name: TZ
              value: America/Chicago
          envFrom:
            - secretRef:
                name: frigate
          ports:
            - name: http-unauth
              containerPort: 5000
              protocol: TCP
            - name: http-auth
              containerPort: 8971
              protocol: TCP
            - name: rtsp
              containerPort: 8554
              protocol: TCP
          volumeMounts:
            - name: frigate
              mountPath: /config
              subPath: config
            - name: nas-frigate
              mountPath: /media/frigate/
            - name: frigate
              mountPath: /mnt/db
              subPath: db
            - name: cache
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: selfsigned-ca
              mountPath: /etc/ssl/certs/selfsigned-ca.crt
              readOnly: true
              subPath: tls.crt
          resources:
            requests:
              memory: 3Gi
              cpu: 4000m
      volumes:
        - name: frigate
          persistentVolumeClaim:
            claimName: frigate
        - name: nas-frigate
          nfs:
            server: nas01-20.whezzel.com
            path: /frigate
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: selfsigned-ca
          secret:
            secretName: selfsigned-ca
