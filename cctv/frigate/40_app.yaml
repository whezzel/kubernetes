---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: cctv
  labels:
    app: frigate
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      name: frigate
      labels:
        app: frigate
    spec:
      runtimeClassName: nvidia
      nodeName: archserv01
      containers:
        - name: frigate
          securityContext:
            privileged: true
          image: ghcr.io/blakeblackshear/frigate:stable
          imagePullPolicy: Always
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
            - name: TZ
              value: America/Chicago
          envFrom:
            - secretRef:
                name: frigate
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
            - name: rtsp
              containerPort: 8554
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: dev-usb
              mountPath: /dev/usb
              readOnly: true
            - name: config
              mountPath: /config
            - name: nas-frigate
              mountPath: /media/frigate/
            - name: db
              mountPath: /mnt/db
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              memory: "1Gi"
              cpu: "4"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: dev-usb
          hostPath:
            path: /dev/usb
        - name: config
          configMap:
            name: frigate
        - name: db
          persistentVolumeClaim:
            claimName: frigate
        - name: nas-frigate
          nfs:
            server: archserv02.whezzel.com
            path: /mnt/netstorage/frigate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
