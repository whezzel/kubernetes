---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: frigate-pv
  namespace: cctv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-sas
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: frigate
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: cctv
    name: frigate-pvc