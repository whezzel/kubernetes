---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cctv-ingress
  namespace: cctv
spec:
  rules:
    - host: shinobi.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shinobi-service
                port:
                  number: 80