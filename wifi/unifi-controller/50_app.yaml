---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
  namespace: wifi
  labels:
    app: unifi
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      name: unifi
      labels:
        app: unifi
    spec:
      nodeSelector:
        kubernetes.io/hostname: archserv01
      containers:
        - name: unifi
          image: linuxserver/unifi-controller:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
              name: webadmin
            - containerPort: 8080
              name: dvc-comms-tcp
              protocol: TCP
            - containerPort: 8080
              name: dvc-comms-udp
              protocol: UDP
            #- containerPort: 1900
            #  protocol: UDP
            #  hostPort: 1900
            - containerPort: 3478
              name: stun
              protocol: UDP
            - containerPort: 10001
              name: ap-discovery
              protocol: UDP
            - containerPort: 6789
              name: mobile-tput-tcp
              protocol: TCP
            - containerPort: 6789
              name: mobile-tput-udp
              protocol: UDP
#          livenessProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 5
#            periodSeconds: 3
#            failureThreshold: 5
#          readinessProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 5
#            periodSeconds: 3
#            failureThreshold: 5
#          startupProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 30
#            periodSeconds: 3
#            failureThreshold: 5
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
#            - name: DOCKER_MODS
#              value: "ghcr.io/gilbn/theme.park:unifi"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: unifi
              mountPath: /config
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "2"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: unifi
          persistentVolumeClaim:
            claimName: unifi
