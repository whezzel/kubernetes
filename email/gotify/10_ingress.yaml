---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gotify
  namespace: email
  annotations:
spec:
  tls:
    - secretName: ""
  ingressClassName: "nginx"
  rules:
    - host: gotify.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gotify
                port:
                  name: http
