---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotify
  namespace: email
  labels:
    app: gotify
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: gotify
  template:
    metadata:
      name: gotify
      labels:
        app: gotify
    spec:
      containers:
        - name: gotify
          image: ghcr.io/gotify/server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: TZ
              value: America/Chicago
            - name: GOTIFY_EXTENDEDLOGFORMAT
              value: "true"
          volumeMounts:
            - name: gotify
              mountPath: /app/data
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
      volumes:
        - name: gotify
          persistentVolumeClaim:
            claimName: gotify
