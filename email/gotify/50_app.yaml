---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotify-deployment
  namespace: email
  labels:
    app: gotify
  annotations: 
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotify
  template:
    metadata:
      labels:
        app: gotify
      name: gotify
    spec:
      containers:
        - name: gotify
          image: gotify/server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: TZ
              value: "America/Chicago"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: gotify
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: gotify
          persistentVolumeClaim:
            claimName: gotify-pvc