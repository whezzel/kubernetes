---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay-deployment
  namespace: email
  labels:
    app: smtp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtp-relay
  template:
    metadata:
      labels:
        app: smtp-relay
    spec:
      containers:
        - name: smtp-relay
          image: namshi/smtp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 25
              protocol: TCP
              hostPort: 25
          envFrom:
            - secretRef:
                name: email-secrets