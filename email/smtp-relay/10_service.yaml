---
apiVersion: v1
kind: Service
metadata:
  name: smtp-relay-lb
  namespace: email
  annotations:
    external-dns.alpha.kubernetes.io/hostname: smtp.whezzel.com
spec:
  selector:
    app: smtp-relay
  ports:
    - protocol: TCP
      name: smtp-relay
      port: 25
      targetPort: smtp
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
