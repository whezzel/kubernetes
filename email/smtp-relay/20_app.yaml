---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
  namespace: email
  labels:
    app: smtp-relay
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtp-relay
  template:
    metadata:
      name: smtp-relay
      labels:
        app: smtp-relay
    spec:
      containers:
        - name: smtp-relay
          image: namshi/smtp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 25
              protocol: TCP
              name: smtp
          envFrom:
            - secretRef:
                name: email-secrets
          resources:
            requests:
              memory: "80Mi"
              cpu: "100m"
