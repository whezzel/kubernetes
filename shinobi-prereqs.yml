---
apiVersion: v1
kind: Namespace
metadata:
  name: cctv
---
apiVersion: v1
kind: Service
metadata:
  name: shinobi-service
  namespace: cctv
spec:
  selector:
    app: shinobi
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shinobi-ingress
  namespace: cctv
spec:
  rules:
    - host: shinobi.nomacsec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shinobi-service
                port:
                  number: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shinobi-database-pvc
  namespace: cctv
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi