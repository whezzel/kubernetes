#---
#apiVersion: postgresql.cnpg.io/v1
#kind: Backup
#metadata:
#  name: authelia-postgres-manual
#  namespace: postgres
#spec:
#  cluster:
#    name: authelia-postgres
#  method: volumeSnapshot
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cron-authelia-postgres
  namespace: postgres
spec:
  cluster:
    name: authelia-postgres
  schedule: "0 0 * * * *"
  method: volumeSnapshot
  backupOwnerReference: cluster
