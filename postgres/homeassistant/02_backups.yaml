---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cron-homeassistant-postgres
  namespace: postgres
spec:
  cluster:
    name: homeassistant-postgres
  schedule: 0 0 2 * * *
  method: volumeSnapshot
  backupOwnerReference: cluster
