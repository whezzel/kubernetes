---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: radarr-postgres
  namespace: postgres
spec:
  description: "Radarr Database"
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  instances: 3
  startDelay: 300
  stopDelay: 300
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      shared_buffers: 256MB
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: '10s'
    pg_hba:
      - host all all 10.244.0.0/16 md5
  managed:
    roles:
      - name: radarr
        superuser: false
        login: true
        passwordSecret:
          name: radarr-postgres-app-user
  bootstrap:
    recovery:
      database: radarr
      owner: radarr
      source: radarr-postgres
      secret:
        name: radarr-postgres-app-user
      #backup:
      #  name: manual-radarr-postgres
      #recoveryTarget:
      #  targetTime: 2025-07-26 00:00:00+00:00 # Time in UTC
    #initdb:
    #  database: radarr
    #  owner: radarr
    #  secret:
    #    name: radarr-postgres-app-user
  externalClusters:
    - name: radarr-postgres
      plugin:
        name: barman-cloud.cloudnative-pg.io
        isWALArchiver: true
        parameters:
          barmanObjectName: backblaze-b2
          serverName: radarr-postgres-0
  enableSuperuserAccess: true
  storage:
    storageClass: longhorn-db
    size: 3Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backblaze-b2
        serverName: radarr-postgres-1
  affinity:
    enablePodAntiAffinity: true
    topologyKey: failure-domain.beta.kubernetes.io/zone
  enablePDB: true
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
