---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: radarr-postgres
  namespace: postgres
spec:
  description: Radarr Database
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  instances: 3
  startDelay: 300
  stopDelay: 300
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      shared_buffers: 64MB
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: 10s
    pg_hba:
      - host all all 10.244.0.0/16 md5
  managed:
    roles:
      - name: radarr
        superuser: false
        login: true
        passwordSecret:
          name: radarr-postgres-app-user
  bootstrap:
    recovery:
      volumeSnapshots:
        storage:
          kind: PersistentVolumeClaim
          name: radarr-postgres-dr
          apiGroup: ""
    #initdb:
    #  database: radarr
    #  owner: radarr
    #  secret:
    #    name: radarr-postgres-app-user
  backup:
    volumeSnapshot:
      className: longhorn
      online: true
      snapshotOwnerReference: backup
  enableSuperuserAccess: true
  storage:
    storageClass: longhorn-db
    size: 3Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
  enablePDB: true
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
