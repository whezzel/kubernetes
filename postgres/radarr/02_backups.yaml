#---
#apiVersion: postgresql.cnpg.io/v1
#kind: Backup
#metadata:
#  name: radarr-postgres-manual
#  namespace: postgres
#spec:
#  cluster:
#    name: radarr-postgres
#  method: volumeSnapshot
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cron-radarr-postgres
  namespace: postgres
spec:
  cluster:
    name: radarr-postgres
  schedule: "0 0 2 * * *"
  method: volumeSnapshot
  backupOwnerReference: cluster
