---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: postgres
spec:
  description: Immich Database
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.3.0
  instances: 3
  startDelay: 300
  stopDelay: 300
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      shared_buffers: 64MB
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: 10s
    pg_hba:
      - host all all 10.244.0.0/16 md5
    shared_preload_libraries:
      - vchord.so
  managed:
    roles:
      - name: immich
        superuser: true
        login: true
        passwordSecret:
          name: immich-postgres-app-user
  bootstrap:
    recovery:
      database: immich
      owner: immich
      source: immich-postgres
      secret:
        name: immich-postgres-app-user
      #backup:
      #  name: manual-immich-postgres
      #recoveryTarget:
      #  targetTime: 2025-05-04 23:00:00+00:00 # Time in UTC
    #initdb:
    #  database: immich
    #  owner: immich
    #  secret:
    #    name: immich-postgres-app-user
    #  postInitSQL:
    #    - CREATE EXTENSION IF NOT EXISTS vchord CASCADE
  externalClusters:
    - name: immich-postgres
      plugin:
        name: barman-cloud.cloudnative-pg.io
        isWALArchiver: true
        parameters:
          barmanObjectName: backblaze-b2
          serverName: immich-postgres-0
  enableSuperuserAccess: true
  storage:
    storageClass: longhorn-db
    size: 2Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backblaze-b2
        serverName: immich-postgres-1
  affinity:
    enablePodAntiAffinity: true
    topologyKey: failure-domain.beta.kubernetes.io/zone
  enablePDB: true
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
