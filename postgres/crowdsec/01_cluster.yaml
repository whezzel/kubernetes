---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crowdsec-postgres
  namespace: postgres
spec:
  description: "Crowdsec Database"
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  instances: 3
  startDelay: 300
  stopDelay: 300
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      shared_buffers: 256MB
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: '10s'
    pg_hba:
      - host all all 10.244.0.0/16 md5
  managed:
    roles:
      - name: crowdsec
        superuser: false
        login: true
        passwordSecret:
          name: crowdsec-postgres-app-user
  bootstrap:
    recovery:
      database: crowdsec
      owner: crowdsec
      source: crowdsec-postgres
      secret:
        name: crowdsec-postgres-app-user
      #backup:
      #  name: manual-crowdsec-postgres
      #recoveryTarget:
      #  targetTime: 2025-05-04 23:00:00+00:00 # Time in UTC
    #initdb:
    #  database: crowdsec
    #  owner: crowdsec
    #  secret:
    #    name: crowdsec-postgres-app-user
  externalClusters:
    - name: crowdsec-postgres
      plugin:
        name: barman-cloud.cloudnative-pg.io
        isWALArchiver: true
        parameters:
          barmanObjectName: backblaze-b2
          serverName: crowdsec-postgres-1
  enableSuperuserAccess: true
  storage:
    storageClass: longhorn-db
    size: 2Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backblaze-b2
        serverName: crowdsec-postgres-0
  affinity:
    enablePodAntiAffinity: true
    topologyKey: failure-domain.beta.kubernetes.io/zone
  enablePDB: true
