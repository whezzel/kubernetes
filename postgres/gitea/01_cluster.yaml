---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-postgres
  namespace: postgres
spec:
  description: Gitea Database
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  instances: 3
  startDelay: 300
  stopDelay: 300
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      shared_buffers: 64MB
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: '10s'
    pg_hba:
      - host all all 10.244.0.0/16 md5
  managed:
    roles:
      - name: gitea
        superuser: false
        login: true
        passwordSecret:
          name: gitea-postgres-app-user
  bootstrap:
    #recovery:
    #  database: gitea
    #  owner: gitea
    #  source: gitea-postgres
    #  secret:
    #    name: gitea-postgres-app-user
    #  #backup:
    #  #  name: manual-gitea-postgres
    #  #recoveryTarget:
    #  #  targetTime: 2025-05-04 23:00:00+00:00 # Time in UTC
    initdb:
      database: gitea
      owner: gitea
      secret:
        name: gitea-postgres-app-user
      #backup:
      #  name: manual-gitea-postgres
  #externalClusters:
  #  - name: gitea-postgres
  #    plugin:
  #      name: barman-cloud.cloudnative-pg.io
  #      isWALArchiver: true
  #      parameters:
  #        barmanObjectName: backblaze-b2
  #        serverName: gitea-postgres-1
  enableSuperuserAccess: true
  storage:
    storageClass: longhorn-db
    size: 3Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backblaze-b2
        serverName: gitea-postgres-0
  affinity:
    enablePodAntiAffinity: true
    topologyKey: failure-domain.beta.kubernetes.io/zone
  enablePDB: true
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
