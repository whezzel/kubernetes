---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: init-gitea-postgres
  namespace: postgres
spec:
  cluster:
    name: gitea-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cron-gitea-postgres
  namespace: postgres
spec:
  cluster:
    name: gitea-postgres
  schedule: 0 0 0 * * *
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
