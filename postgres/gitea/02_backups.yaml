---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cron-gitea-postgres
  namespace: postgres
spec:
  cluster:
    name: gitea-postgres
  schedule: 0 0 2 * * *
  method: volumeSnapshot
  backupOwnerReference: cluster
