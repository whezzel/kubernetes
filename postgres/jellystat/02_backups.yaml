---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: jellystat-postgres-manual
  namespace: postgres
spec:
  cluster:
    name: jellystat-postgres
  method: volumeSnapshot
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cron-jellystat-postgres
  namespace: postgres
spec:
  cluster:
    name: jellystat-postgres
  schedule: 0 0 2 * * *
  method: volumeSnapshot
  backupOwnerReference: cluster
