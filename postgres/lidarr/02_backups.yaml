---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cron-lidarr-postgres
  namespace: postgres
spec:
  cluster:
    name: lidarr-postgres
  schedule: "0 0 * * * *"
  method: volumeSnapshot
  backupOwnerReference: cluster
