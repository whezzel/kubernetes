---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: init-sonarr-postgres
  namespace: postgres
spec:
  cluster:
    name: sonarr-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cron-sonarr-postgres
  namespace: postgres
spec:
  cluster:
    name: sonarr-postgres
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
