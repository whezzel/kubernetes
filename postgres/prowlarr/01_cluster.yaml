---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: prowlarr-postgres
  namespace: postgres
spec:
  description: Prowlarr Database
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  instances: 3
  startDelay: 300
  stopDelay: 300
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      shared_buffers: 64MB
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: 10s
    pg_hba:
      - host all all 10.244.0.0/16 md5
  managed:
    roles:
      - name: prowlarr
        superuser: false
        login: true
        passwordSecret:
          name: prowlarr-postgres-app-user
  bootstrap:
    recovery:
      database: prowlarr
      owner: prowlarr
      source: prowlarr-postgres
      secret:
        name: prowlarr-postgres-app-user
      #backup:
      #  name: manual-prowlarr-postgres
      #recoveryTarget:
      #  targetTime: 2025-05-04 23:00:00+00:00 # Time in UTC
    #initdb:
    #  database: prowlarr
    #  owner: prowlarr
    #  secret:
    #    name: prowlarr-postgres-app-user
  externalClusters:
    - name: prowlarr-postgres
      plugin:
        name: barman-cloud.cloudnative-pg.io
        isWALArchiver: true
        parameters:
          barmanObjectName: backblaze-b2
          serverName: prowlarr-postgres-1
  enableSuperuserAccess: true
  storage:
    storageClass: longhorn-db
    size: 2Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backblaze-b2
        serverName: prowlarr-postgres-0
  affinity:
    enablePodAntiAffinity: true
    topologyKey: failure-domain.beta.kubernetes.io/zone
  enablePDB: true
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
