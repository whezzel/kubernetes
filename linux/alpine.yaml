---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpine
  namespace: default
  labels:
    app: alpine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpine
  template:
    metadata:
      name: alpine
      labels:
        app: alpine
    spec:
#      affinity:
#        podAffinity:
#          requiredDuringSchedulingIgnoredDuringExecution:
#          - labelSelector:
#              matchExpressions:
#              - key: app
#                operator: In
#                values:
#                - pihole02
#            topologyKey: kubernetes.io/hostname
#        podAntiAffinity:
#          requiredDuringSchedulingIgnoredDuringExecution:
#          - labelSelector:
#              matchExpressions:
#              - key: app
#                operator: In
#                values:
#                - pihole02
#            topologyKey: kubernetes.io/hostname
      containers:
        - name: alpine
          securityContext:
            privileged: true
          image: ghcr.io/whezzel/alpine-tools:latest
          imagePullPolicy: Always
          tty: true
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: nas
              mountPath: /mnt/temp
#            - name: frigate
#              mountPath: /frigate
#            - name: minecraft-test
#              mountPath: /minecraft-test
      volumes:
        - name: nas
          nfs:
            server: nas01-20.whezzel.com
            path: /temp
#        - name: frigate
#          persistentVolumeClaim:
#            claimName: frigate
#        - name: minecraft-test
#          persistentVolumeClaim:
#            claimName: minecraft-test
