---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: mediaserver-https-test
  namespace: mediaserver
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: mediaserver-headers-test
  namespace: mediaserver
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediaserver-ingress-test
  namespace: mediaserver
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: mediaserver-mediaserver-https-test@kubernetescrd
spec:
  rules:
    - host: jellyfin-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediaserver-ingress-https-test
  namespace: mediaserver
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"       
    traefik.ingress.kubernetes.io/router.middlewares: mediaserver-mediaserver-headers-test@kubernetescrd
spec:
  rules:
    - host: jellyfin-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin-service
                port:
                  number: 80