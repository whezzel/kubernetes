---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediaserver-ingress
  namespace: mediaserver
spec:
  rules:
    - host: jellyfin.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin-service
                port:
                  number: 80