---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: mediaserver
  labels:
    app: jellyfin
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      name: jellyfin
      labels:
        app: jellyfin
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia-present: "true"
      containers:
        - name: jellyfin
          image: harbor.whezzel.com/proxy-lscr.io/linuxserver/jellyfin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8096
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          volumeMounts:
            - name: nas-media
              mountPath: /media
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-transcode
              mountPath: /transcode
          resources:
            requests:
              memory: 1800Mi
              cpu: 500m
      volumes:
        - name: nas-media
          nfs:
            server: nas01-20.whezzel.com
            path: /media
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin
        - name: jellyfin-transcode
          persistentVolumeClaim:
            claimName: jellyfin-transcode
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-transcode
  namespace: mediaserver
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-db
  resources:
    requests:
      storage: 10Gi
