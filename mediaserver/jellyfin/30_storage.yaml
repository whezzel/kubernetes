---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin
  namespace: mediaserver
spec:
  capacity:
    storage: 12Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: jellyfin
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: mediaserver
    name: jellyfin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin
  namespace: mediaserver
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 12Gi
  volumeName: jellyfin
  storageClassName: longhorn
