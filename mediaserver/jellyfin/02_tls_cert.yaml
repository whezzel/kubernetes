---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-selfsigned-pkcs12-tls
  namespace: mediaserver
spec:
  secretName: jellyfin-selfsigned-pkcs12-tls
  issuerRef:
    name: selfsigned-ca
    kind: ClusterIssuer
    group: cert-manager.io
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        key: password
        name: jellyfin-selfsigned-pkcs12-secret
  dnsNames:
  - jellyfin.mediaserver.svc.cluster.local
  - jellyfin.mediaserver
  - jellyfin
