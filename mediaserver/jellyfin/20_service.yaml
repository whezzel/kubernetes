---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: mediaserver
spec:
#  ipFamilyPolicy: PreferDualStack
  selector:
    app: jellyfin
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
