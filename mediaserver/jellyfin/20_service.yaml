---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: mediaserver
  annotations:
    metallb.universe.tf/address-pool: default
spec:
  selector:
    app: jellyfin
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8096
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8920