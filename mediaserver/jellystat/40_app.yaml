---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellystat
  namespace: mediaserver
  labels:
    app: jellystat
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
#  strategy:
#    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: jellystat
  template:
    metadata:
      name: jellystat
      labels:
        app: jellystat
    spec:
      containers:
        - name: jellystat
          image: docker.io/cyfershepard/jellystat:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jellystat-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jellystat-secrets
                  key: password
            - name: POSTGRES_IP
              value: jellystat-postgres-rw.postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jellystat-secrets
                  key: jwt_secret
            - name: POSTGRES_DB
              value: jellystat
          resources:
            requests:
              memory: 200Mi
              cpu: 50m
