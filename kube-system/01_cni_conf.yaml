---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-conf
  namespace: kube-system
spec:
  config: '{
      "cniVersion": "0.3.0",
      "name": "macvlan-conf",
      "type": "macvlan",
      "master": "eth0",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "subnet": "10.69.20.0/24",
        "rangeStart": "10.69.20.200",
        "rangeEnd": "10.69.20.254",
        "routes": [
          { "dst": "224.0.0.0/24" },
          {	"dst": "255.255.255.255/32" }
        ],
        "gateway": "10.69.20.1"
      }
    }'
