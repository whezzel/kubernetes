apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-conf
spec:
  config: '{
      "cniVersion": "0.3.0",
      "type": "macvlan",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "subnet": "10.69.20.0/23",
        "rangeStart": "10.69.21.1",
        "rangeEnd": "10.69.21.254",
        "routes": [
          {
            "dst": "224.0.0.0/24",
            "dst": "255.255.255.255/32"
          }
        ],
        "gateway": "10.69.20.1"
      }
    }'
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-dhcp
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "type": "dhcp"
      }
    }'
