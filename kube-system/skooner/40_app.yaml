---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skooner
  namespace: kube-system
  labels:
    app: skooner
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skooner
  template:
    metadata:
      name: skooner
      labels:
        app: skooner
    spec:
      containers:
        - name: skooner
          image: ghcr.io/skooner-k8s/skooner:stable
          imagePullPolicy: Always
          ports:
            - containerPort: 4654
              name: http
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 4654
            initialDelaySeconds: 30
            timeoutSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
