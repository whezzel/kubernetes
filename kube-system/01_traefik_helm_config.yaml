apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 5
    service:
      spec:
        externalTrafficPolicy: Local
    logs:
      access:
        enabled: true
    additionalArguments:
      - "--serverstransport.insecureskipverify=true"
      - "--entryPoints.web.forwardedHeaders.trustedIPs=10.69.20.2,10.69.20.3"
      - "--entryPoints.websecure.forwardedHeaders.trustedIPs=10.69.20.2,10.69.20.3"
      - "--entryPoints.web.proxyProtocol.trustedIPs=10.69.20.2,10.69.20.3"
      - "--entryPoints.websecure.proxyProtocol.trustedIPs=10.69.20.2,10.69.20.3"
