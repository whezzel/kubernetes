---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: kube-system
  labels:
    app: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      name: whoami
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: ghcr.io/traefik/whoami:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
