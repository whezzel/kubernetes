---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: kube-system
spec:
  selector:
    app: whoami
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
