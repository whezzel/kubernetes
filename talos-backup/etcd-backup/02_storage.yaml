# Static NFS PV/PVC for etcd snapshots on nas01.
# Export: /exports/etcd-backup, a bind mount of /mnt/vg1000-lv/backups/etcd
# (all_squash to uid/gid 1000, fsid=101, control plane IPs only).
# The NFSv4 path /etcd-backup is relative to the export root /exports.
# Capacity is advisory for NFS.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: talos-backup-etcd-nfs
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
  nfs:
    server: nas01-20.whezzel.com
    path: /etcd-backup
  claimRef:
    namespace: talos-backup
    name: etcd-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-backups
  namespace: talos-backup
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: talos-backup-etcd-nfs
  resources:
    requests:
      storage: 30Gi
