# Kubernetes ServiceAccount for the CronJob (no RBAC, token not mounted).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-backup
  namespace: talos-backup
automountServiceAccountToken: false
# Talos ServiceAccount: Talos creates Secret "talos-backup-secrets" with a talosconfig
# (role os:etcd:backup), mounted in the pod at /var/run/secrets/talos.dev.
# Requires talos-machine-patch.yaml on the control planes.
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup-secrets
  namespace: talos-backup
spec:
  roles:
    - os:etcd:backup
