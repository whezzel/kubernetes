---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: otrecorder-pv
  namespace: tracking
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: otrecorder
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: tracking
    name: otrecorder-pvc