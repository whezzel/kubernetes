---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual
  namespace: finance
spec:
  tls:
    - {}
  ingressClassName: nginx
  rules:
    - host: actual.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual
                port:
                  name: http
