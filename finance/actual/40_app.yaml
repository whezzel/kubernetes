---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  namespace: finance
  labels:
    app: actual
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: actual
  template:
    metadata:
      labels:
        app: actual
      name: actual
    spec:
      enableServiceLinks: false
      containers:
        - name: actual
          image: ghcr.io/actualbudget/actual-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5006
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: ACTUAL_OPENID_DISCOVERY_URL
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: ACTUAL_OPENID_DISCOVERY_URL
            - name: ACTUAL_OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: ACTUAL_OPENID_CLIENT_ID
            - name: ACTUAL_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: ACTUAL_OPENID_CLIENT_SECRET
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: ACTUAL_OPENID_SERVER_HOSTNAME
            - name: ACTUAL_OPENID_AUTH_METHOD
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: ACTUAL_OPENID_AUTH_METHOD
          volumeMounts:
            - name: actual
              mountPath: /data
      volumes:
        - name: actual
          persistentVolumeClaim:
            claimName: actual
