---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
  namespace: logging
  labels:
    app: changedetection
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: changedetection
  template:
    metadata:
      name: changedetection
      labels:
        app: changedetection
    spec:
      containers:
        - name: changedetection
          image: harbor.whezzel.com/proxy-ghcr.io/dgtlmoon/changedetection.io:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
#          livenessProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 5
#            periodSeconds: 3
#            failureThreshold: 5
#          readinessProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 5
#            periodSeconds: 3
#            failureThreshold: 5
#          startupProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 30
#            periodSeconds: 3
#            failureThreshold: 5
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: changedetection
              mountPath: /datastore
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
      volumes:
        - name: changedetection
          persistentVolumeClaim:
            claimName: changedetection
