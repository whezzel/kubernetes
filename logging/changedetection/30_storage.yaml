---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: changedetection
spec:
  capacity:
    storage: 256Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: changedetection
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: logging
    name: changedetection
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: changedetection
  namespace: logging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
  volumeName: changedetection
  storageClassName: longhorn
