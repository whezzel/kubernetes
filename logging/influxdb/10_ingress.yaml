---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: influxdb
  namespace: logging
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.69.0.0/16, 10.244.0.0/16, fd69:0:0:2::/64, fd69:0:0:40::/64, fd69:0:0:100::/64"
spec:
  tls:
    - {}
  ingressClassName: nginx
  rules:
    - host: influxdb.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: influxdb
                port:
                  name: http
