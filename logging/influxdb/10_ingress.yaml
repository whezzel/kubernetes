---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: influxdb
  namespace: logging
spec:
  tls:
    - secretName: ""
  ingressClassName: "nginx"
  rules:
    - host: influxdb.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: influxdb
                port:
                  name: http
