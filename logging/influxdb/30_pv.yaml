---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: influxdb
  namespace: logging
spec:
  capacity:
    storage: 60Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: influxdb
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: logging
    name: influxdb
