---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: logging
  labels:
    app: influxdb
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      name: influxdb
      labels:
        app: influxdb
    spec:
      nodeSelector:
        kubernetes.io/hostname: archserv01
      containers:
        - name: influxdb
          image: library/influxdb:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
              name: http
#          livenessProbe:
#            httpGet:
#              path: /
#              port: http
#            initialDelaySeconds: 60
#            periodSeconds: 5
#            failureThreshold: 5
#            timeoutSeconds: 10
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: influxdb
              mountPath: /var/lib/influxdb2
              subPath: data
            - name: influxdb
              mountPath: /etc/influxdb2
              subPath: config
          resources:
            requests:
              memory: "512Mi"
              cpu: "1"
            limits:
              memory: "1Gi"
              cpu: "2"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: influxdb
          persistentVolumeClaim:
            claimName: influxdb
