---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb-deployment
  namespace: logging
  labels:
    app: influxdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: library/influxdb:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: influxdb
              mountPath: /var/lib/influxdb2
              subPath: data
            - name: influxdb
              mountPath: /etc/influxdb2
              subPath: config
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: influxdb
          persistentVolumeClaim:
            claimName: influxdb-pvc