---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  namespace: logging
  labels:
    app: telegraf
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf
  template:
    metadata:
      labels:
        app: telegraf
      name: telegraf
    spec:
      nodeSelector:
        host: archserv01
      containers:
        - name: telegraf
          image: library/telegraf:latest
          imagePullPolicy: Always
          env:
            - name: HOST_ETC
              value: "/hostfs/etc"
            - name: HOST_PROC
              value: "/hostfs/proc"
            - name: HOST_SYS
              value: "/hostfs/sys"
            - name: HOST_VAR
              value: "/hostfs/var"
            - name: HOST_RUN
              value: "/hostfs/run"
            - name: HOST_MOUNT_PREFIX
              value: "/hostfs"

          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: telegraf
              mountPath: /etc/telegraf/
              subPath: config
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: telegraf
          persistentVolumeClaim:
            claimName: telegraf
        - name: hostfs
          hostPath:
            path: /
