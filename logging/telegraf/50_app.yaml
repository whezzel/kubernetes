---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf-archserv01
  namespace: logging
  labels:
    app: telegraf-archserv01
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf-archserv01
  template:
    metadata:
      name: telegraf-archserv01
      labels:
        app: telegraf-archserv01
    spec:
      nodeSelector:
        kubernetes.io/hostname: archserv01
      securityContext:
        runAsUser: 999
        runAsGroup: 969
        fsGroup: 999
      containers:
        - name: telegraf-archserv01
          image: library/telegraf:latest
          imagePullPolicy: Always
          env:
            - name: HOST_ETC
              value: "/hostfs/etc"
            - name: HOST_PROC
              value: "/hostfs/proc"
            - name: HOST_SYS
              value: "/hostfs/sys"
            - name: HOST_VAR
              value: "/hostfs/var"
            - name: HOST_RUN
              value: "/hostfs/run"
            - name: HOST_MOUNT_PREFIX
              value: "/hostfs"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: telegraf
              mountPath: "/etc/telegraf/telegraf.conf"
              readOnly: true
              subPath: telegraf.conf
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: hostfs
          hostPath:
            path: /
        - name: telegraf
          configMap:
            name: telegraf-archserv01
