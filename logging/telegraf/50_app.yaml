---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf-talos01
  namespace: logging
  labels:
    app: telegraf-talos01
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf-talos01
  template:
    metadata:
      name: telegraf-talos01
      labels:
        app: telegraf-talos01
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos01
      securityContext:
        runAsUser: 999
        runAsGroup: 969
        fsGroup: 999
      containers:
        - name: telegraf-talos01
          image: library/telegraf:latest
          imagePullPolicy: IfNotPresent
#          securityContext:
#            privileged: true
          env:
            - name: TALOS01_INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegraf-secrets
                  key: TALOS01_INFLUXDB_TOKEN
            - name: HOST_ETC
              value: "/host/etc"
            - name: HOST_PROC
              value: "/host/proc"
            - name: HOST_SYS
              value: "/host/sys"
            - name: HOST_VAR
              value: "/host/var"
            - name: HOST_RUN
              value: "/host/run"
            - name: HOST_MOUNT_PREFIX
              value: "/host"
          volumeMounts:
#            - name: udev
#              mountPath: /run/udev
#              readOnly: true
            - name: telegraf
              mountPath: "/etc/telegraf/telegraf.conf"
              readOnly: true
              subPath: telegraf.conf
            - name: host
              mountPath: /host
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
      volumes:
#        - name: udev
#          hostPath:
#            path: /run/udev
        - name: host
          hostPath:
            path: /
        - name: telegraf
          configMap:
            name: telegraf-talos01
