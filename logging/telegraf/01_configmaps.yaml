---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-archserv01
  namespace: logging
data:
  telegraf.conf: |
    [global_tags]
    [agent]
      interval = "10s"
      round_interval = true
      metric_batch_size = 1000
      metric_buffer_limit = 10000
      collection_jitter = "0s"
      flush_interval = "10s"
      flush_jitter = "0s"
      precision = ""
      debug = false
      quiet = false
      # logtarget = "file"
      # logfile = ""
      # logfile_rotation_interval = "0d"
      # logfile_rotation_max_size = "0MB"
      # logfile_rotation_max_archives = 5
      hostname = "archserv01.whezzel.com"
      omit_hostname = false
     [[outputs.influxdb_v2]]
        urls = ["http://influxdb.logging:80"]
        token = "${ARCHSERV01_INFLUXDB_TOKEN}"
        organization = "whezzel.com"
        bucket = "telegraf"
        insecure_skip_verify = true
      #[[inputs.bond]]
      #  host_proc = "/hostfs/proc"
      #  bond_interfaces = ["bond0"]
      [[inputs.cpu]]
        percpu = true
        totalcpu = true
        collect_cpu_time = false
        report_active = false
      [[inputs.disk]]
        mount_points = ["/", "/efi"]
        ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs", "nsfs"]
      [[inputs.diskio]]
        devices = ["sd*","vb*","vg1000"]
        # skip_serial_number = false
        # device_tags = ["ID_FS_TYPE", "ID_FS_USAGE"]
        # name_templates = ["$ID_FS_LABEL","$DM_VG_NAME/$DM_LV_NAME"]
      [[inputs.kernel]]
      [[inputs.mem]]
      [[inputs.net]]
        #ignore_protocol_stats = true
        interfaces = ["eno1","eno2","eno3","eno4","bond0","br0-bond0"]
      [[inputs.processes]]
      [[inputs.sensors]]
      [[inputs.swap]]
      [[inputs.system]]
      [[inputs.apcupsd]]
        servers = ["tcp://archserv01.whezzel.com:3551"]
        # timeout = "5s"
     #[[inputs.bind]]
     #  urls = ["http://bind-master-stats.dns:8053/json/v1"]
     #  # gather_memory_contexts = false
     #  # gather_views = false
     #  # timeout = "4s"
      [[inputs.hddtemp]]
        address = "archserv01.whezzel.com:7634"
        devices = ["*"]
---
