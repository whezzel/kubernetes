---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-talos01
  namespace: logging
data:
  telegraf.conf: |
    [global_tags]
    [agent]
      interval = "1s"
      round_interval = true
      metric_batch_size = 1000
      metric_buffer_limit = 10000
      collection_jitter = "0s"
      flush_interval = "10s"
      flush_jitter = "0s"
      precision = ""
      debug = false
      quiet = false
      hostname = "talos01.whezzel.com"
      omit_hostname = false
     [[outputs.influxdb_v2]]
        urls = ["https://influxdb.whezzel.com:443"]
        token = "${TALOS01_INFLUXDB_TOKEN}"
        organization = "whezzel.com"
        bucket = "telegraf"
        insecure_skip_verify = true
      [[inputs.cpu]]
        percpu = true
        totalcpu = true
        collect_cpu_time = false
        report_active = false
      [[inputs.disk]]
        mount_points = ["/host"]
        ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "aufs", "squashfs", "nsfs"]
      [[inputs.diskio]]
        devices = ["nvme0n1"]
        # skip_serial_number = false
        # device_tags = ["ID_FS_TYPE", "ID_FS_USAGE"]
        # name_templates = ["$ID_FS_LABEL","$DM_VG_NAME/$DM_LV_NAME"]
      [[inputs.kernel]]
      [[inputs.mem]]
      [[inputs.net]]
        interfaces = ["eth0"]
      [[inputs.nstat]]
      [[inputs.processes]]
      [[inputs.sensors]]
      [[inputs.swap]]
      [[inputs.system]]
