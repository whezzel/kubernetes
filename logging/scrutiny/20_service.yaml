---
apiVersion: v1
kind: Service
metadata:
  name: scrutiny
  namespace: logging
  labels:
    app: scrutiny-master-web
spec:
  selector:
    app: scrutiny-master-web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: metrics
      port: 9900
      targetPort: metrics
