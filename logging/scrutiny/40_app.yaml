---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutiny-master-web
  namespace: logging
  labels:
    app: scrutiny-master-web
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: scrutiny-master-web
  template:
    metadata:
      name: scrutiny-master-web
      labels:
        app: scrutiny-master-web
    spec:
      containers:
        - name: scrutiny-master-web
          image: ghcr.io/analogj/scrutiny:master-web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SCRUTINY_WEB_INFLUXDB_HOST
              value: "influxdb.logging"
            - name: SCRUTINY_WEB_INFLUXDB_PORT
              value: "80"
            - name: SCRUTINY_WEB_INFLUXDB_ORG
              value: "whezzel.com"
            - name: SCRUTINY_WEB_INFLUXDB_BUCKET
              value: "scrutiny"
#            - name: SCRUTINY_WEB_INFLUXDB_TLS_INSECURE_SKIP_VERIFY
#              value: "true"
          envFrom:
            - secretRef:
                name: scrutiny-secrets
          volumeMounts:
            - name: scrutiny
              mountPath: /opt/scrutiny/config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: scrutiny
          persistentVolumeClaim:
            claimName: scrutiny
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutiny-collector-talos01
  namespace: logging
  labels:
    app: scrutiny-collector-talos01
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrutiny-collector-talos01
  template:
    metadata:
      name: scrutiny-collector-talos01
      labels:
        app: scrutiny-collector-talos01
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos01
      containers:
        - name: scrutiny-collector-talos01
          image: ghcr.io/analogj/scrutiny:master-collector
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          volumeMounts:
            - name: udev
              mountPath: /run/udev
              readOnly: true
            - name: scrutiny-collector
              mountPath: "/opt/scrutiny/config/collector.yaml"
              readOnly: true
              subPath: collector.yaml
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: udev
          hostPath:
            path: /run/udev
        - name: scrutiny-collector
          configMap:
            name: scrutiny-collector-talos01
