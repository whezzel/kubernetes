---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrutiny-collector-talos01
  namespace: logging
data:
  collector.yaml: |
    version: 1
    host:
      id: "talos01"
    devices:
      - device: /dev/nvme0
    api:
      endpoint: 'http://scrutiny.logging:80'
