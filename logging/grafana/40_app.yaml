---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: logging
  labels:
    app: grafana
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      name: grafana
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'true'
            - name: GF_AUTH_ANONYMOUS_ORG_NAME
              value: 'whezzel.com'
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: 'Viewer'
            - name: GF_AUTH_LDAP_ENABLED
              value: 'false'
            - name: GF_AUTH_PROXY_ENABLED
              value: 'false'
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: 'true'
            - name: GF_INSTALL_PLUGINS
              value: ""
          volumeMounts:
            - name: grafana
              mountPath: /var/lib/grafana
              subPath: data
            - name: grafana
              mountPath: /var/log/grafana
              subPath: logs
            - name: grafana
              mountPath: /etc/grafana
              subPath: grafana
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
      volumes:
        - name: grafana
          persistentVolumeClaim:
            claimName: grafana
