apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: logging
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: grafana
              mountPath: /var/lib/grafana
              subPath: data
            - name: grafana
              mountPath: /var/log/grafana
              subPath: logs
            - name: grafana
              mountPath: /etc/grafana
              subPath: grafana
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: grafana
          persistentVolumeClaim:
            claimName: grafana-pvc