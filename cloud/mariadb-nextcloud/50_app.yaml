---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-nextcloud
  namespace: cloud
  labels:
    app: mariadb-nextcloud
#  annotations:
#    keel.sh/policy: force
#    keel.sh/match-tag: "true"
#    keel.sh/trigger: poll
#    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb-nextcloud
  template:
    metadata:
      name: mariadb-nextcloud
      labels:
        app: mariadb-nextcloud
    spec:
      nodeSelector:
        kubernetes.io/hostname: archserv01
      containers:
        - name: mariadb-nextcloud
          image: linuxserver/mariadb:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
              name: mariadb-tcp
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
#          envFrom:
#            - secretRef:
#                name: mariadb-nextcloud
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: mariadb-nextcloud
              mountPath: /config
          resources:
            requests:
              memory: "1G"
              cpu: "2"
            limits:
              memory: "2Gi"
              cpu: "4"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: mariadb-nextcloud
          persistentVolumeClaim:
            claimName: mariadb-nextcloud
