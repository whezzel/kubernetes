---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich
  namespace: cloud
  labels:
    app: immich
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      name: immich
      labels:
        app: immich
    spec:
      enableServiceLinks: false
      containers:
        - name: immich-machine-learning
          image: harbor.whezzel.com/proxy-ghcr.io/immich-app/immich-machine-learning:release
          imagePullPolicy: Always
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: IMMICH_MEDIA_LOCATION
              value: /photos
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_HOSTNAME
              value: immich-postgres-rw.postgres
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: password
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: redis-url
          volumeMounts:
            - name: ml-cache
              mountPath: /cache
          resources:
            requests:
              memory: 2Gi
              cpu: 2000m
        - name: immich
          image: harbor.whezzel.com/proxy-ghcr.io/immich-app/immich-server:release
          imagePullPolicy: Always
          ports:
            - containerPort: 2283
              name: http
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: IMMICH_MEDIA_LOCATION
              value: /photos
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_HOSTNAME
              value: immich-postgres-rw.postgres
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: password
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: redis-url
          volumeMounts:
            - name: photos
              mountPath: /photos
#          resources:
#            requests:
#              memory: 2Gi
#              cpu: 2000m
      volumes:
        - name: photos
          nfs:
            server: nas01-20.whezzel.com
            path: /photos
  volumeClaimTemplates:
    - metadata:
        name: ml-cache
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
