---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  namespace: cloud
  labels:
    app: immich
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      name: immich
      labels:
        app: immich
    spec:
      enableServiceLinks: false
      containers:
        - name: immich
          image: ghcr.io/imagegenius/immich:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
#            - name: IMMICH_PORT
#              value: "8080"
            - name: SERVER_PORT
              value: "8080"
            - name: "DOCKER_MODS"
              value: "imagegenius/mods:universal-redis"
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_HOSTNAME
              value: immich-postgres-rw.postgres
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: password
            - name: REDIS_HOSTNAME
              value: localhost
            - name: MACHINE_LEARNING_HOST
              value: "0.0.0.0"
            - name: MACHINE_LEARNING_PORT
              value: "3003"
            - name: MACHINE_LEARNING_WORKERS
              value: "1"
            - name: MACHINE_LEARNING_WORKER_TIMEOUT
              value: "120"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: photos
              mountPath: /photos
#          resources:
#            requests:
#              memory: "1G"
#              cpu: "2"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: immich
        - name: photos
          nfs:
            server: nas.whezzel.com
            path: /mnt/netstorage/photos
