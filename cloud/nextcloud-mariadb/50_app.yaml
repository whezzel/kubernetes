---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-mariadb
  namespace: cloud
  labels:
    app: nextcloud-mariadb
#  annotations:
#    keel.sh/policy: force
#    keel.sh/match-tag: "true"
#    keel.sh/trigger: poll
#    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-mariadb
  template:
    metadata:
      name: nextcloud-mariadb
      labels:
        app: nextcloud-mariadb
    spec:
      containers:
        - name: nextcloud-mariadb
          image: lscr.io/linuxserver/mariadb:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
              name: mariadb-tcp
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
#          envFrom:
#            - secretRef:
#                name: nextcloud-mariadb
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: nextcloud-mariadb
              mountPath: /config
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: nextcloud-mariadb
          persistentVolumeClaim:
            claimName: nextcloud-mariadb
