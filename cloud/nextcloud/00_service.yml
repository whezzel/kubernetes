---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-service
  namespace: cloud
spec:
  selector:
    app: nextcloud
  ports:
    - name: https
      protocol: TCP
      port: 80
      targetPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-service-test
  namespace: cloud
spec:
  selector:
    app: nextcloud
  ports:
    - protocol: TCP
      nodePort: 30443
      port: 443
  type: NodePort