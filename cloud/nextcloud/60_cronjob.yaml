apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: cloud
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: nextcloud-cron
            image: nextcloud:latest
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            args:
            - -c
            - su -c "php -f /var/www/html/cron.php" -s /bin/sh www-data
            volumeMounts:
            - name: nextcloud
              mountPath: /var/www/html
              subPath: nextcloud
            - name: nextcloud
              mountPath: /var/www/html/custom_apps
              subPath: apps
            - name: nextcloud
              mountPath: /var/www/html/config
              subPath: config
            - name: nextcloud
              mountPath: /var/www/html/data
              subPath: data
            - name: nextcloud
              mountPath: /var/www/html/themes
              subPath: themes
          restartPolicy: Never
          volumes:
          - name: nextcloud
            persistentVolumeClaim:
              claimName: nextcloud
  schedule: "*/30 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
