apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-deployment
  namespace: cloud
  labels:
    app: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
        - name: nextcloud
          image: nextcloud:latest
          imagePullPolicy: Always
          ports:
              - containerPort: 80
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: nextcloud
              mountPath: /var/www/html
              subPath: nextcloud
            - name: nextcloud
              mountPath: /var/www/html/custom_apps
              subPath: apps
            - name: nextcloud
              mountPath: /var/www/html/config
              subPath: config
            - name: nextcloud
              mountPath: /var/www/html/data
              subPath: data
            - name: nextcloud
              mountPath: /var/www/html/themes
              subPath: themes
            - name: nas
              mountPath: /mnt/netstorage
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: nextcloud
          persistentVolumeClaim:
            claimName: nextcloud-pvc
        - name: nas
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/