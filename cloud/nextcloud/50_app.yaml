---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: cloud
  labels:
    app: nextcloud
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      name: nextcloud
      labels:
        app: nextcloud
    spec:
      nodeSelector:
        kubernetes.io/hostname: archserv01
      containers:
        - name: nextcloud
          image: nextcloud:latest
          imagePullPolicy: Always
          lifecycle:
            postStart:
              exec:
                command: ['sh', '-c', "apt update && apt install -y libmagickcore-6.q16-3-extra"]
          ports:
              - containerPort: 80
                #hostPort: 8081
                name: http
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: nextcloud
              mountPath: /var/www/html
              subPath: nextcloud
            - name: nextcloud
              mountPath: /var/www/html/custom_apps
              subPath: apps
            - name: nextcloud
              mountPath: /var/www/html/config
              subPath: config
            - name: nextcloud
              mountPath: /var/www/html/data
              subPath: data
            - name: nextcloud
              mountPath: /var/www/html/themes
              subPath: themes
            - name: nas
              mountPath: /mnt/netstorage
          env:
#            - name: APACHE_DISABLE_REWRITE_IP
#              value: "1"
            - name: TRUSTED_PROXIES
              value: "10.42.0.0/16 10.43.0.0/16"
          resources:
            requests:
              memory: "1Gi"
              cpu: "2"
            limits:
              memory: "2Gi"
              cpu: "4"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: nextcloud
          persistentVolumeClaim:
            claimName: nextcloud
        - name: nas
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/
