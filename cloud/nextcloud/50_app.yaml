---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: cloud
  labels:
    app: nextcloud
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
      name: nextcloud
    spec:
      nodeSelector:
        capacity: high
      containers:
        - name: nextcloud
          image: linuxserver/nextcloud:latest
          imagePullPolicy: Always
          ports:
              - containerPort: 443
                name: http
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: nextcloud
              mountPath: /config
              subPath: config
            - name: nextcloud
              mountPath: /data
              subPath: data
            - name: nas
              mountPath: /mnt/netstorage
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: nextcloud
          persistentVolumeClaim:
            claimName: nextcloud
        - name: nas
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/
