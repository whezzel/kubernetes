---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: cloud
  labels:
    app: nextcloud
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      name: nextcloud
      labels:
        app: nextcloud
    spec:
      containers:
        - name: nextcloud
          image: nextcloud:latest
          imagePullPolicy: Always
          ports:
              - containerPort: 80
                name: http
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: nextcloud
              mountPath: /var/www/html
              subPath: nextcloud
            - name: nextcloud
              mountPath: /var/www/html/custom_apps
              subPath: apps
            - name: nextcloud
              mountPath: /var/www/html/config
              subPath: config
            - name: nextcloud
              mountPath: /var/www/html/data
              subPath: data
            - name: nextcloud
              mountPath: /var/www/html/themes
              subPath: themes
            - name: nas
              mountPath: /mnt/netstorage
          env:
            - name: TRUSTED_PROXIES
              value: "10.42.0.0/16 10.43.0.0/16"
            - name: OVERWRITEPROTOCOL
              value: "https"
          resources:
            requests:
              memory: "512Mi"
              cpu: "1"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: nextcloud
          persistentVolumeClaim:
            claimName: nextcloud
        - name: nas
          nfs:
            server: archserv02.whezzel.com
            path: /mnt/netstorage/
