---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: cloud
  labels:
    app: syncthing
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/macvlan-conf
      name: syncthing
      labels:
        app: syncthing
    spec:
      containers:
        - name: syncthing
          image: lscr.io/linuxserver/syncthing:latest
          imagePullPolicy: IfNotPresent
          #command: ["syncthing"]
          #args: ["--reset-deltas"]
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - containerPort: 8384
              name: http
            - containerPort: 21027
              name: discovery-udp
              protocol: UDP
            - containerPort: 22000
              name: sync-tcp
              protocol: TCP
            - containerPort: 22000
              name: sync-udp
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /rest/noauth/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            failureThreshold: 5
            timeoutSeconds: 10
          #readinessProbe:
          #  httpGet:
          #    path: /rest/noauth/health
          #    port: http
          #    scheme: HTTP
          #  initialDelaySeconds: 10
          #  failureThreshold: 5
          #  timeoutSeconds: 10
          volumeMounts:
            - name: syncthing
              mountPath: /config
              subPath: config
            - name: nas-syncthing
              mountPath: /backups
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: syncthing
          persistentVolumeClaim:
            claimName: syncthing
        - name: nas-syncthing
          nfs:
            server: nas.whezzel.com
            path: /mnt/netstorage/backups
