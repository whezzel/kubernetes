---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: syncthing
  namespace: cloud
spec:
  capacity:
    storage: 512Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: syncthing
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: cloud
    name: syncthing
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing
  namespace: cloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
  storageClassName: longhorn
  volumeName: syncthing
