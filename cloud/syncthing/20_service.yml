---
apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: cloud
spec:
  selector:
    app: syncthing
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: syncthing-udp
  namespace: cloud
spec:
  selector:
    app: syncthing
  ports:
    - protocol: UDP
      name: discovery-udp
      port: 21027
      targetPort: discovery-udp
    - protocol: UDP
      name: sync-udp
      port: 22000
      targetPort: sync-udp
  type: LoadBalancer
  sessionAffinity: ClientIP
---
apiVersion: v1
kind: Service
metadata:
  name: syncthing-tcp
  namespace: cloud
spec:
  selector:
    app: syncthing
  ports:
    - protocol: TCP
      name: sync-tcp
      port: 22000
      targetPort: sync-tcp
  type: LoadBalancer
  sessionAffinity: ClientIP
