---
apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: cloud
spec:
  selector:
    app: syncthing
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: syncthing-lb
  namespace: cloud
  labels:
    3amigos_tunnel: "true"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: sync.whezzel.com
spec:
  selector:
    app: syncthing
  ports:
    - protocol: UDP
      name: discovery-udp
      port: 21027
      targetPort: discovery-udp
    - protocol: UDP
      name: sync-udp
      port: 22000
      targetPort: sync-udp
    - protocol: TCP
      name: sync-tcp
      port: 22000
      targetPort: sync-tcp
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
