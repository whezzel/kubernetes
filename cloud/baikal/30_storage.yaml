---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: baikal
  namespace: cloud
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: baikal
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: cloud
    name: baikal
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baikal
  namespace: cloud
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
  volumeName: baikal
