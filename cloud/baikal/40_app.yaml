---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baikal
  namespace: cloud
  labels:
    app: baikal
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: baikal
  template:
    metadata:
      name: baikal
      labels:
        app: baikal
    spec:
      containers:
        - name: baikal
          image: docker.io/ckulka/baikal:nginx
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: baikal
              mountPath: /var/www/baikal/Specific
              subPath: Specific
            - name: baikal
              mountPath: /var/www/baikal/config
              subPath: config
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: baikal
          persistentVolumeClaim:
            claimName: baikal
        - name: nginx-config
          configMap:
            name: baikal-nginx-config
