---
apiVersion: v1
kind: Namespace
metadata:
  name: mediaserver
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: mediaserver
spec:
  selector:
    app: jellyfin
  ports:
    - name: http
      protocol: TCP
      port: 8096
      targetPort: 8096
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc
  namespace: mediaserver
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi