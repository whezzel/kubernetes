apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-deployment
  namespace: mediaserver
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: linuxserver/jellyfin:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8096
            - name: https
              containerPort: 8920
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: nas-media
              mountPath: /media
            - name: nas-ssl
              mountPath: /ssl
            - name: jellyfin-config
              mountPath: /config
          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
      volumes:
        - name: nas-media
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/media
        - name: nas-ssl
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/ssl
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc