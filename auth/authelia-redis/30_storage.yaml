---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: authelia-redis
  namespace: auth
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: authelia-redis
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: auth
    name: authelia-redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-redis
  namespace: auth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  volumeName: authelia-redis
  storageClassName: longhorn
