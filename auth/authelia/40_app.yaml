---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: auth
  labels:
    app: authelia
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      name: authelia
      labels:
        app: authelia
    spec:
      enableServiceLinks: false
      containers:
        - name: authelia
          #image: authelia/authelia:4.37.5 #  <----- You should use an explicit version here docker pull
          image: authelia/authelia:4.38.17 #  <----- You should use an explicit version here docker pull
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
              name: http
          volumeMounts:
            - name: config
              mountPath: "/config/configuration.yml"
              readOnly: true
              subPath: configuration.yml
            - name: authelia
              mountPath: /etc/authelia
            - name: authelia-secrets
              mountPath: /data/authelia/secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: authelia
      volumes:
        - name: authelia
          persistentVolumeClaim:
            claimName: authelia
        - name: config
          configMap:
            name: authelia-config
        - name: authelia-secrets
          secret:
            secretName: authelia-secrets
