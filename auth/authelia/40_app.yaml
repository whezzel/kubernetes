---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: auth
  labels:
    app: authelia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      name: authelia
      labels:
        app: authelia
    spec:
      enableServiceLinks: false
      containers:
        - name: authelia
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
            #  hostPort: 9091
              name: http
          volumeMounts:
            - name: config
              mountPath: "/config/configuration.yml"
              readOnly: true
              subPath: configuration.yml
            - name: users
              mountPath: "/etc/authelia/users.yaml"
              readOnly: true
              subPath: users.yaml
            - name: oidc-issuer-key
              mountPath: "/etc/authelia/oidc-issuer.key"
              readOnly: true
              subPath: oidc-issuer.key
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - secretRef:
                name: authelia
      volumes:
        - name: config
          configMap:
            name: authelia-config
        - name: users
          secret:
            secretName: authelia-users
        - name: oidc-issuer-key
          secret:
            secretName: authelia-oidc-issuer-key
