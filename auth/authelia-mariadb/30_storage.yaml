---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: authelia-mariadb
  namespace: auth
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: authelia-mariadb
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: auth
    name: authelia-mariadb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-mariadb
  namespace: auth
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  volumeName: authelia-mariadb
  storageClassName: longhorn
