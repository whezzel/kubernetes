---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-postgres
  namespace: auth
#  annotations:
#    keel.sh/match-tag: "true"
#    keel.sh/policy: force
#    keel.sh/pollSchedule: '@every 24h'
#    keel.sh/trigger: poll
  labels:
    app: authentik-postgres
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: authentik-postgres
  template:
    metadata:
      name: authentik-postgres
      labels:
        app: authentik-postgres
    spec:
      imagePullSecrets:
        - name: imagepull-secret
      containers:
        - name: authentik-postgres
          image: tensorchord/pgvecto-rs:pg14-v0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres-tcp
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-postgres
                  key: DB_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: authentik-postgres
                  key: DB_USERNAME
          volumeMounts:
            - name: authentik-postgres
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: authentik-postgres
          persistentVolumeClaim:
            claimName: authentik-postgres
