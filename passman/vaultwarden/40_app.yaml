---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: passman
  labels:
    app: vaultwarden
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      name: vaultwarden
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: docker.io/vaultwarden/server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
            - containerPort: 3012
              name: websocket
          livenessProbe:
            httpGet:
              path: /alive
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /alive
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: DOMAIN
              value: https://vaultwarden.whezzel.com
            - name: SENDS_ALLOWED
              value: "true"
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: WEB_VAULT_ENABLED
              value: "true"
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: SIGNUPS_VERIFY
              value: "true"
            - name: LOG_LEVEL
              value: info
          envFrom:
            - secretRef:
                name: vaultwarden
          volumeMounts:
            - name: vaultwarden
              mountPath: /data
              subPath: data
      volumes:
        - name: vaultwarden
          persistentVolumeClaim:
            claimName: vaultwarden
