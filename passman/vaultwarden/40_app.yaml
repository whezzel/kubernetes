---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: passman
  labels:
    app: vaultwarden
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      name: vaultwarden
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
            - containerPort: 3012
              name: websocket
#          livenessProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 5
#            periodSeconds: 3
#            failureThreshold: 5
#          readinessProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 5
#            periodSeconds: 3
#            failureThreshold: 5
#          startupProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 30
#            periodSeconds: 3
#            failureThreshold: 5
          env:
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: WEB_VAULT_ENABLED
              value: "true"
            - name: SIGNUPS_ALLOWED
              value: "false"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: vaultwarden
              mountPath: /data
              subPath: data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: vaultwarden
          persistentVolumeClaim:
            claimName: vaultwarden
