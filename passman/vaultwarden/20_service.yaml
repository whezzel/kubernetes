---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: passman
spec:
  selector:
    app: vaultwarden
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
