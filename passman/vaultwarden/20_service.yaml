---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-service
  namespace: passman
spec:
  selector:
    app: vaultwarden
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-websocket-service
  namespace: passman
spec:
  selector:
    app: vaultwarden
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3012