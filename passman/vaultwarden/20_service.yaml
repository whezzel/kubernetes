---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: passman
spec:
  selector:
    app: vaultwarden
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-websocket
  namespace: passman
spec:
  selector:
    app: vaultwarden
  ports:
    - protocol: TCP
      port: 80
      targetPort: websocket
