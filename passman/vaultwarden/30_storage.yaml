---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vaultwarden
  namespace: passman
spec:
  capacity:
    storage: 128Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: vaultwarden
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: passman
    name: vaultwarden
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden
  namespace: passman
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 128Mi
  volumeName: vaultwarden
  storageClassName: longhorn
