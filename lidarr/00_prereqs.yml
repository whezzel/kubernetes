---
apiVersion: v1
kind: Namespace
metadata:
  name: seedbox
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr-service
  namespace: seedbox
spec:
  selector:
    app: lidarr
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8686
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr-ingress
  namespace: seedbox
spec:
  rules:
    - host: lidarr.nomacsec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lidarr-service
                port:
                  number: 80
    - host: lidarr-k3s.nomacsec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lidarr-service
                port:
                  number: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config-pvc
  namespace: seedbox
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-sas
  resources:
    requests:
      storage: 250Mi