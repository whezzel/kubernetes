---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: seedbox
  labels:
    app: sonarr
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      name: sonarr
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:develop
          imagePullPolicy: Always
          ports:
            - containerPort: 8989
              name: http
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: nas-media
              mountPath: /media
            - name: sonarr
              mountPath: /config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: nas-media
          nfs:
            server: nas.whezzel.com
            path: /mnt/netstorage/media
        - name: sonarr
          persistentVolumeClaim:
            claimName: sonarr
