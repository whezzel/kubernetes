---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: seedbox
  labels:
    app: sonarr
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      name: sonarr
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8989
              name: http
            - containerPort: 9898
              name: https
          livenessProbe:
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: SONARR__APP__INSTANCENAME
              value: Sonarr
            - name: SONARR__APP__LAUNCHBROWSER
              value: "False"
            - name: SONARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: sonarr-secrets
                  key: apikey
            - name: SONARR_AUTH_ENABLED
              value: "True"
            - name: SONARR__AUTH__METHOD
              value: External
            - name: SONARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            - name: SONARR__LOG__ANALYTICSENABLED
              value: "False"
            - name: SONARR__LOG__DBENABLED
              value: "False"
            - name: SONARR__LOG__LEVEL
              value: info
            - name: SONARR__UPDATE__AUTOMATICALLY
              value: "True"
            - name: SONARR__UPDATE__MECHANISM
              value: Docker
            - name: SONARR__SERVER__BINDADDRESS
              value: "*"
            - name: SONARR__SERVER__ENABLESSL
              value: "true"
            - name: SONARR__SERVER__PORT
              value: "8989"
            - name: SONARR__SERVER__SSLCERTPATH
              value: /tls/keystore.p12
            - name: SONARR__SERVER__SSLCERTPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarr-selfsigned-pkcs12-secret
                  key: password
            - name: SONARR__SERVER__URLBASE
              value: /
            - name: SONARR__SERVER__SSLPORT
              value: "9898"
            - name: SONARR__POSTGRES__HOST
              value: sonarr-postgres-rw.postgres
            - name: SONARR__POSTGRES__PORT
              value: "5432"
            - name: SONARR__POSTGRES__USER
              value: sonarr
            - name: SONARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarr-secrets
                  key: SONARR__POSTGRES__PASSWORD
            - name: SONARR__POSTGRES__MAINDB
              value: sonarr
            - name: SONARR__POSTGRES__LOGDB
              value: logs
          volumeMounts:
            - name: nas-media
              mountPath: /media
            - name: nas-mediacover
              mountPath: /config/MediaCover
            - name: sonarr-selfsigned-pkcs12-tls
              mountPath: /tls/keystore.p12
              readOnly: true
              subPath: keystore.p12
            - name: selfsigned-ca
              mountPath: /etc/ssl/certs/selfsigned-ca.crt
              readOnly: true
              subPath: tls.crt
          resources:
            requests:
              memory: 256Mi
              cpu: 150m
      volumes:
        - name: nas-media
          nfs:
            server: nas01-20.whezzel.com
            path: /media
        - name: nas-mediacover
          nfs:
            server: nas01-20.whezzel.com
            path: /media/tv_shows/MediaCover
        - name: sonarr-selfsigned-pkcs12-tls
          secret:
            secretName: sonarr-selfsigned-pkcs12-tls
        - name: selfsigned-ca
          secret:
            secretName: selfsigned-ca
