---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: seedbox
  labels:
    app: sonarr
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      name: sonarr
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:develop
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8989
              name: http
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: SONARR__APP__INSTANCENAME
              value: "Sonarr"
            - name: SONARR__APP__LAUNCHBROWSER
              value: "False"
            - name: SONARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: sonarr-secrets
                  key: apikey
            - name: SONARR_AUTH_ENABLED
              value: "True"
            - name: SONARR__AUTH__METHOD
              value: "External"
            - name: SONARR__AUTH__REQUIRED
              value: "DisabledForLocalAddresses"
            - name: SONARR__LOG__ANALYTICSENABLED
              value: "False"
            - name: SONARR__LOG__LEVEL
              value: "info"
            - name: SONARR__UPDATE__AUTOMATICALLY
              value: "True"
            - name: SONARR__UPDATE__MECHANISM
              value: "Docker"
            - name: SONARR__SERVER__BINDADDRESS
              value: "*"
            - name: SONARR__SERVER__ENABLESSL
              value: "false"
            - name: SONARR__SERVER__PORT
              value: "8989"
#            - name: SONARR__SERVER__SSLCERTPATH
#              value: "/tls/keystore.p12"
#            - name: SONARR__SERVER__SSLCERTPASSWORD
#              valueFrom:
#                secretKeyRef:
#                  name: pkcs12-pass-secrets
#                  key: pkcs12-pass
            - name: SONARR__SERVER__URLBASE
              value: "/"
            - name: SONARR__SERVER__SSLPORT
              value: "9898"
          volumeMounts:
            - name: nas-media
              mountPath: /media
            - name: nas-mediacover
              mountPath: /config/MediaCover
            - name: sonarr
              mountPath: /config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
      volumes:
        - name: nas-media
          nfs:
            server: nas.whezzel.com
            path: /mnt/netstorage/media
        - name: nas-mediacover
          nfs:
            server: nas.whezzel.com
            path: /mnt/netstorage/media/tv_shows/MediaCover
        - name: sonarr
          persistentVolumeClaim:
            claimName: sonarr
