---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: sonarr
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: seedbox
    name: sonarr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr
  namespace: seedbox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: sonarr
  storageClassName: longhorn
