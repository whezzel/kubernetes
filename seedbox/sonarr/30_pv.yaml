---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: sonarr
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: seedbox
    name: sonarr
