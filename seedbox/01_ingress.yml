---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seedbox-ingress
  namespace: seedbox
spec:
  rules:
    - host: whezzel.com
      http:
        paths:
          - path: /transmission
            pathType: Prefix
            backend:
              service:
                name: transmission-service
                port:
                  number: 80
    - host: jackett.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jackett-service
                port:
                  number: 80
    - host: lidarr.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lidarr-service
                port:
                  number: 80
    - host: radarr.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr-service
                port:
                  number: 80
    - host: sonarr.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr-service
                port:
                  number: 80
    - host: prowlarr.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr-service
                port:
                  number: 80