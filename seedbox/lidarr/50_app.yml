apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr-deployment
  namespace: seedbox
  labels:
    app: lidarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      containers:
        - name: lidarr
          image: linuxserver/lidarr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8686
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: nas-media
              mountPath: /media
            - name: lidarr
              mountPath: /config
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: nas-media
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/media
        - name: lidarr
          persistentVolumeClaim:
            claimName: lidarr-pvc