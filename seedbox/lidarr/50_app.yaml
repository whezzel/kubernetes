---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: seedbox
  labels:
    app: lidarr
  annotations: 
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
      name: lidarr
    spec:
      containers:
        - name: lidarr
          image: linuxserver/lidarr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8686
              name: webui
          livenessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 60
            periodSeconds: 5
            failureThreshold: 5
            timeoutSeconds: 10
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: DOCKER_MODS
              value: "ghcr.io/gilbn/theme.park:lidarr"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: nas-media
              mountPath: /media
            - name: lidarr
              mountPath: /config
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: nas-media
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/media
        - name: lidarr
          persistentVolumeClaim:
            claimName: lidarr