---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: seedbox
  labels:
    app: lidarr
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      name: lidarr
      labels:
        app: lidarr
    spec:
      containers:
        - name: lidarr
          image: lscr.io/linuxserver/lidarr:develop
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8686
              name: http
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: nas-media
              mountPath: /media
            - name: lidarr
              mountPath: /config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
      volumes:
        - name: nas-media
          nfs:
            server: nas.whezzel.com
            path: /mnt/netstorage/media
        - name: lidarr
          persistentVolumeClaim:
            claimName: lidarr
