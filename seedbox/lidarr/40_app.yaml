---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: seedbox
  labels:
    app: lidarr
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      name: lidarr
      labels:
        app: lidarr
    spec:
      containers:
        - name: lidarr
          image: harbor.whezzel.com/proxy-lscr.io/linuxserver/lidarr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8686
              name: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: LIDARR__APP__INSTANCENAME
              value: Lidarr
            - name: LIDARR__APP__LAUNCHBROWSER
              value: "False"
            - name: LIDARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: lidarr-secrets
                  key: apikey
            - name: LIDARR_AUTH_ENABLED
              value: "True"
            - name: LIDARR__AUTH__METHOD
              value: External
            - name: LIDARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            - name: LIDARR__LOG__ANALYTICSENABLED
              value: "False"
            - name: LIDARR__LOG__DBENABLED
              value: "False"
            - name: LIDARR__LOG__LEVEL
              value: info
            - name: LIDARR__UPDATE__AUTOMATICALLY
              value: "True"
            - name: LIDARR__UPDATE__MECHANISM
              value: Docker
            - name: LIDARR__SERVER__BINDADDRESS
              value: "*"
            - name: LIDARR__SERVER__ENABLESSL
              value: "false"
            - name: LIDARR__SERVER__PORT
              value: "8686"
            - name: LIDARR__SERVER__URLBASE
              value: /
            - name: LIDARR__SERVER__SSLPORT
              value: "6868"
            - name: LIDARR__POSTGRES__HOST
              value: lidarr-postgres-rw.postgres
            - name: LIDARR__POSTGRES__PORT
              value: "5432"
            - name: LIDARR__POSTGRES__USER
              value: lidarr
            - name: LIDARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lidarr-secrets
                  key: LIDARR__POSTGRES__PASSWORD
            - name: LIDARR__POSTGRES__MAINDB
              value: lidarr
            - name: LIDARR__POSTGRES__LOGDB
              value: logs
          volumeMounts:
            - name: nas-media
              mountPath: /media
            - name: nas-mediacover
              mountPath: /config/MediaCover
          resources:
            requests:
              memory: 256Mi
              cpu: 150m
      volumes:
        - name: nas-media
          nfs:
            server: nas01-20.whezzel.com
            path: /media
        - name: nas-mediacover
          nfs:
            server: nas01-20.whezzel.com
            path: /media/music/MediaCover
