---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: seedbox
  labels:
    app: radarr
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      name: radarr
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7878
              name: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: RADARR__APP__INSTANCENAME
              value: Radarr
            - name: RADARR__APP__LAUNCHBROWSER
              value: "False"
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: radarr-secrets
                  key: apikey
            - name: RADARR_AUTH_ENABLED
              value: "True"
            - name: RADARR__AUTH__METHOD
              value: External
            - name: RADARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            - name: RADARR__LOG__ANALYTICSENABLED
              value: "False"
            - name: RADARR__LOG__DBENABLED
              value: "False"
            - name: RADARR__LOG__LEVEL
              value: info
            - name: RADARR__UPDATE__AUTOMATICALLY
              value: "True"
            - name: RADARR__UPDATE__MECHANISM
              value: Docker
            - name: RADARR__SERVER__BINDADDRESS
              value: "*"
            - name: RADARR__SERVER__ENABLESSL
              value: "false"
            - name: RADARR__SERVER__PORT
              value: "7878"
            - name: RADARR__SERVER__URLBASE
              value: /
            - name: RADARR__SERVER__SSLPORT
              value: "8787"
            - name: RADARR__SERVER__TRUSTEDNETWORKS
              value: "10.69.0.0/16,10.244.0.0/16,fd69::/48,fd6a:0:244::56"
            - name: RADARR__POSTGRES__HOST
              value: radarr-postgres-rw.postgres
            - name: RADARR__POSTGRES__PORT
              value: "5432"
            - name: RADARR__POSTGRES__USER
              value: radarr
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radarr-secrets
                  key: RADARR__POSTGRES__PASSWORD
            - name: RADARR__POSTGRES__MAINDB
              value: radarr
            - name: RADARR__POSTGRES__LOGDB
              value: logs
          volumeMounts:
            - name: nas-media
              mountPath: /media
            - name: nas-mediacover
              mountPath: /config/MediaCover
      volumes:
        - name: nas-media
          nfs:
            server: nas01-20.whezzel.com
            path: /media
        - name: nas-mediacover
          nfs:
            server: nas01-20.whezzel.com
            path: /media/movies/MediaCover
