---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: radarr
  namespace: seedbox
  labels:
    app: radarr
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  selector:
    matchLabels:
      app: radarr
  serviceName: "radarr"
  replicas: 1
  minReadySeconds: 10
  template:
    metadata:
      name: radarr
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7878
              name: http
#          livenessProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 5
#            periodSeconds: 3
#            failureThreshold: 5
#          readinessProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 5
#            periodSeconds: 3
#            failureThreshold: 5
#          startupProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 30
#            periodSeconds: 3
#            failureThreshold: 5
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: nas-media
              mountPath: /media
            - name: radarr
              mountPath: /config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: nas-media
          nfs:
            server: archserv02.whezzel.com
            path: /mnt/netstorage/media
  volumeClaimTemplates:
    - metadata:
        name: radarr
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "longhorn"
        resources:
          requests:
            storage: 5Gi
