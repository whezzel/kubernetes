---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: seedbox-https-test
  namespace: seedbox
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: seedbox-headers-test
  namespace: seedbox
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seedbox-ingress-test
  namespace: seedbox
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: seedbox-seedbox-https-test@kubernetescrd
spec:
  rules:
    - host: k3s.whezzel.com
      http:
        paths:
          - path: /transmission
            pathType: Prefix
            backend:
              service:
                name: transmission-service
                port:
                  number: 80
    - host: jackett-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jackett-service
                port:
                  number: 80
    - host: lidarr-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lidarr-service
                port:
                  number: 80
    - host: radarr-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr-service
                port:
                  number: 80
    - host: sonarr-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seedbox-ingress-https-test
  namespace: seedbox
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"       
    traefik.ingress.kubernetes.io/router.middlewares: seedbox-seedbox-headers-test@kubernetescrd
spec:
  rules:
    - host: k3s.whezzel.com
      http:
        paths:
          - path: /transmission
            pathType: Prefix
            backend:
              service:
                name: transmission-service
                port:
                  number: 80
    - host: jackett-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jackett-service
                port:
                  number: 80
    - host: lidarr-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lidarr-service
                port:
                  number: 80
    - host: radarr-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr-service
                port:
                  number: 80
    - host: sonarr-k3s.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr-service
                port:
                  number: 80