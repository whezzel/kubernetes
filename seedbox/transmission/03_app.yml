apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission-deployment
  namespace: seedbox
  labels:
    app: transmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
    spec:
      containers:
        - name: transmission
          image: haugene/transmission-openvpn:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9091
          env:
            - name: DISABLE_PORT_UPDATER
              value: "false"
            - name: GLOBAL_APPLY_PERMISSIONS
              value: "false"
            - name: HEALTH_CHECK_HOST
              value: "cloudflare.com"
            - name: LOCAL_NETWORK
              value: "10.0.2.0/24,10.0.100.0/24,10.0.40.0/24"
            - name: OPENVPN_CONFIG
              value: "us_east,us_houston,us_texas,us_florida"
            - name: OPENVPN_OPTS
              value: "--inactive 3600 --ping 10 --ping-exit 60"
            - name: OPENVPN_PASSWORD
              value: "password"
            - name: OPENVPN_PROVIDER
              value: "PIA"
            - name: OPENVPN_USERNAME
              value: "username"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TRANSMISSION_HOME
              value: "/data/transmission-home"
            - name: TRANSMISSION_WEB_UI
              value: "transmission-web-control"
            - name: TZ
              value: "America/Chicago"
            - name: UFW_ALLOW_GW_NET
              value: "true"
            - name: TRANSMISSION_DOWNLOAD_DIR
              value: "/downloads/complete"
            - name: TRANSMISSION_INCOMPLETE_DIR
              value: "/downloads/incomplete"
            - name: TRANSMISSION_WATCH_DIR
              value: "/downloads/.torrents"
          volumeMounts:
            - name: nas-media
              mountPath: /downloads
            - name: transmission
              mountPath: /config
              subPath: config
            - name: transmission
              mountPath: /data
              subPath: data
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
      volumes:
        - name: nas-media
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/media/downloads
        - name: transmission
          persistentVolumeClaim:
            claimName: transmission-pvc