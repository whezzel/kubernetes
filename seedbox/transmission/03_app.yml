apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission-deployment
  namespace: seedbox
  labels:
    app: transmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
    spec:
      containers:
        - name: transmission
          image: haugene/transmission-openvpn:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9091
          env:
### Container Variables ###
            - name: CREATE_TUN_DEVICE
              value: "true"
            - name: DISABLE_PORT_UPDATER
              value: "false"
            - name: ENABLE_UFW
              value: "false"
            - name: GLOBAL_APPLY_PERMISSIONS
              value: "true"
            - name: HEALTH_CHECK_HOST
              value: "cloudflare.com"
            - name: LOCAL_NETWORK
              value: "10.0.2.0/24,10.0.100.0/24,10.0.40.0/24"
            - name: OPENVPN_CONFIG
              value: "us_east,us_houston,us_texas,us_florida"
            - name: OPENVPN_OPTS
              value: "--inactive 3600 --ping 10 --ping-exit 60"
            - name: OPENVPN_PASSWORD
              value: "password"
            - name: OPENVPN_PROVIDER
              value: "PIA"
            - name: OPENVPN_USERNAME
              value: "username"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TRANSMISSION_HOME
              value: "/data/transmission-home"
#            - name: TRANSMISSION_WATCH_DIR_FORCE_GENERIC
#              value: "false"
#            - name: TRANSMISSION_WEB_HOME
#              value: ""
            - name: TRANSMISSION_WEB_UI
              value: "transmission-web-control"
            - name: TZ
              value: "America/Chicago"
            - name: UFW_ALLOW_GW_NET
              value: "true"
#            - name: UFW_DISABLE_IPTABLES_REJECT
#              value: "false"
#            - name: UFW_EXTRA_PORTS
#              value: ""
#            - name: WEBPROXY_ENABLED
#              value: "false"
#            - name: WEBPROXY_PASSWORD
#              value: "passw"
#            - name: WEBPROXY_PORT
#              value: "8888"
#            - name: WEBPROXY_USERNAME
#              value: "username"
### Transmission Variables ###
## Bandwidth ##
#            - name: TRANSMISSION_ALT_SPEED_ENABLED
#              value: "false"
#            - name: TRANSMISSION_ALT_SPEED_UP
#              value: "50"
#            - name: TRANSMISSION_ALT_SPEED_DOWN
#              value: "50"
#            - name: TRANSMISSION_SPEED_LIMIT_DOWN
#              value: "100"
#            - name: TRANSMISSION_SPEED_LIMIT_DOWN_ENABLED
#              value: "false"
            - name: TRANSMISSION_SPEED_LIMIT_UP
              value: "0"
            - name: TRANSMISSION_SPEED_LIMIT_UP_ENABLED
              value: "true"
            - name: TRANSMISSION_UPLOAD_SLOTS_PER_TORRENT
              value: "0"
## Blocklists ##
#            - name: TRANSMISSION_BLOCKLIST_URL
#              value: "http://www.example.com/blocklist"
#           - name: TRANSMISSION_BLOCKLIST_ENABLED
#              value: "false"
## Files and Locations
            - name: TRANSMISSION_DOWNLOAD_DIR
              value: "/media/downloads/complete/other"
            - name: TRANSMISSION_INCOMPLETE_DIR
              value: "/media/downloads/incomplete"
            - name: TRANSMISSION_INCOMPLETE_DIR_ENABLED
              value: "true"
#            - name: TRANSMISSION_PREALLOCATION
#              value: "1"
#            - name: TRANSMISSION_RENAME_PARTIAL_FILES
#              value: "true"
#            - name: TRANSMISSION_START_ADDED_TORRENTS
#              value: "true"
            - name: TRANSMISSION_TRASH_ORIGINAL_TORRENT_FILES
              value: "true"
#            - name: TRANSMISSION_UMASK
#              value: "2"
            - name: TRANSMISSION_WATCH_DIR
              value: "/media/downloads/.torrents"
            - name: TRANSMISSION_WATCH_DIR_ENABLED
              value: "true"
### Misc ###
            - name: TRANSMISSION_CACHE_SIZE_MB
              value: "8"
#            - name: TRANSMISSION_DHT_ENABLED
#              value: "true"
#            - name: TRANSMISSION_ENCRYPTION
#              value: "1"
#            - name: TRANSMISSION_LAZY_BITFIELD_ENABLED
#              value: "true"
#            - name: TRANSMISSION_LPD_ENABLED
#              value: "false"
#            - name: TRANSMISSION_MESSAGE_LEVEL
#              value: "2"
#            - name: TRANSMISSION_PEX_ENABLED
#              value: "true"
#            - name: TRANSMISSION_PREFETCH_ENABLED
#              value: "true"
            - name: TRANSMISSION_SCRAPE_PAUSED_TORRENTS_ENABLED
              value: "false"
#            - name: TRANSMISSION_SCRIPT_TORRENT_DONE_ENABLED
#              value: "false"
#            - name: TRANSMISSION_SCRIPT_TORRENT_DONE_FILENAME
#              value: ""
#            - name: TRANSMISSION_UTP_ENABLED
#              value: "true"
### Peers ###
#            - name: TRANSMISSION_BIND_ADDRESS_IPV4
#              value: "0.0.0.0"
#            - name: TRANSMISSION_BIND_ADDRESS_IPV6
#              value: "::"
#            - name: TRANSMISSION_PEER_CONGESTION_ALGORITHM
#              value: ""
#            - name: TRANSMISSION_PEER_ID_TTL_HOURS
#              value: "6"
#            - name: TRANSMISSION_PEER_LIMIT_GLOBAL
#              value: "240"
#            - name: TRANSMISSION_PEER_LIMIT_PER_TORRENT
#              value: "60"
#            - name: TRANSMISSION_PEER_SOCKET_TOS
#              value: "default"
### Peer Port ###
#            - name: TRANSMISSION_PEER_PORT
#              value: "51413"
#            - name: TRANSMISSION_PEER_PORT_RANDOM_HIGH
#              value: "65535"
#            - name: TRANSMISSION_PEER_PORT_RANDOM_LOW
#              value: "1024"
#            - name: TRANSMISSION_PEER_PORT_RANDOM_ON_START
#              value: "false"
#            - name: TRANSMISSION_PORT_FORWARDING_ENABLED
#              value: "true"
### Queuing ###
            - name: TRANSMISSION_DOWNLOAD_QUEUE_ENABLED
              value: "false"
#            - name: TRANSMISSION_DOWNLOAD_QUEUE_SIZE
#              value: "5"
#            - name: TRANSMISSION_QUEUE_STALLED_ENABLED
#              value: "true"
#            - name: TRANSMISSION_QUEUE_STALLED_MINUTES
#              value: "30"
            - name: TRANSMISSION_SEED_QUEUE_ENABLED
              value: "true"
            - name: TRANSMISSION_SEED_QUEUE_SIZE
              value: "0"
### RPC ###
#            - name: TRANSMISSION_RPC_AUTHENTICATION_REQUIRED
#              value: "false"
#            - name: TRANSMISSION_RPC_BIND_ADDRESS
#              value: "0.0.0.0"
            - name: TRANSMISSION_RPC_ENABLED
              value: "true"
            - name: TRANSMISSION_RPC_HOST_WHITELIST
              value: "*.whezzel.com"
#            - name: TRANSMISSION_RPC_HOST_WHITELIST_ENABLED
#              value: "true"
#            - name: TRANSMISSION_RPC_PASSWORD
#              value: ""
#            - name: TRANSMISSION_RPC_PORT
#              value: "9091"
#            - name: TRANSMISSION_RPC_URL
#              value: "/transmission/"
#            - name: TRANSMISSION_RPC_USERNAME
#              value: ""
            - name: TRANSMISSION_RPC_WHITELIST
              value: "127.0.0.1,10.0.2.*,10.0.9.*,10.0.40.*"
#            - name: TRANSMISSION_RPC_WHITELIST_ENABLED
#              value: "true"
### Scheduling ###
#            - name: TRANSMISSION_ALT_SPEED_TIME_ENABLED
#              value: "false"
#            - name: TRANSMISSION_ALT_SPEED_TIME_BEGIN
#              value: "540"
#            - name: TRANSMISSION_ALT_SPEED_TIME_END
#              value: "1020"
#            - name: TRANSMISSION_ALT_SPEED_TIME_DAY
#              value: "127"
            - name: TRANSMISSION_IDLE_SEEDING_LIMIT
              value: "0"
            - name: TRANSMISSION_IDLE_SEEDING_LIMIT_ENABLED
              value: "true"
            - name: TRANSMISSION_RATIO_LIMIT
              value: "0"
            - name: TRANSMISSION_RATIO_LIMIT_ENABLED
              value: "true"
          volumeMounts:
            - name: nas-media
              mountPath: /downloads
            - name: transmission
              mountPath: /config
              subPath: config
            - name: transmission
              mountPath: /data
              subPath: data
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
      volumes:
        - name: nas-media
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/media/downloads
        - name: transmission
          persistentVolumeClaim:
            claimName: transmission-pvc