---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: transmission
spec:
  capacity:
    storage: 512Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: transmission
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: seedbox
    name: transmission
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission
  namespace: seedbox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
  volumeName: transmission
  storageClassName: longhorn
