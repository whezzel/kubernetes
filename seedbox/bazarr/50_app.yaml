---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: seedbox
  labels:
    app: bazarr
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      name: bazarr
      labels:
        app: bazarr
    spec:
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6767
              name: http
#          livenessProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 5
#            periodSeconds: 3
#            failureThreshold: 5
#          readinessProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 5
#            periodSeconds: 3
#            failureThreshold: 5
#          startupProbe:
#            httpGet:
#              path: /
#              port: http
#              scheme: HTTP
#            initialDelaySeconds: 50
#            periodSeconds: 3
#            failureThreshold: 5
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: DOCKER_MODS
              value: "ghcr.io/gilbn/theme.park:bazarr"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: nas-media
              mountPath: /media
            - name: bazarr
              mountPath: /config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: nas-media
          nfs:
            server: archserv02.whezzel.com
            path: /mnt/netstorage/media
        - name: bazarr
          persistentVolumeClaim:
            claimName: bazarr
