---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bazarr
  namespace: seedbox
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: bazarr
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: seedbox
    name: bazarr