---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: seedbox
  labels:
    app: flaresolverr
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      name: flaresolverr
      labels:
        app: flaresolverr
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8191
              name: http
          #livenessProbe:
          #  httpGet:
          #    path: /ping
          #    port: http
          #    scheme: HTTP
          #  initialDelaySeconds: 30
          #  periodSeconds: 10
          #  timeoutSeconds: 5
          #  failureThreshold: 5
          #  successThreshold: 1
          #readinessProbe:
          #  httpGet:
          #    path: /ping
          #    port: http
          #    scheme: HTTP
          #  initialDelaySeconds: 10
          #  periodSeconds: 10
          #  timeoutSeconds: 5
          #  failureThreshold: 3
          #  successThreshold: 1
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
