---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: seedbox
  labels:
    app: prowlarr
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      name: prowlarr
      labels:
        app: prowlarr
    spec:
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9696
              name: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PROWLARR__APP__INSTANCENAME
              value: "Prowlarr"
            - name: PROWLARR__APP__LAUNCHBROWSER
              value: "False"
            - name: PROWLARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr-secrets
                  key: apikey
            - name: PROWLARR_AUTH_ENABLED
              value: "True"
            - name: PROWLARR__AUTH__METHOD
              value: "External"
            - name: PROWLARR__AUTH__REQUIRED
              value: "DisabledForLocalAddresses"
            - name: PROWLARR__LOG__ANALYTICSENABLED
              value: "False"
            - name: PROWLARR__LOG__DBENABLED
              value: "False"
            - name: PROWLARR__LOG__LEVEL
              value: "info"
            - name: PROWLARR__UPDATE__AUTOMATICALLY
              value: "True"
            - name: PROWLARR__UPDATE__MECHANISM
              value: "Docker"
            - name: PROWLARR__SERVER__BINDADDRESS
              value: "*"
            - name: PROWLARR__SERVER__ENABLESSL
              value: "false"
            - name: PROWLARR__SERVER__PORT
              value: "9696"
#            - name: PROWLARR__SERVER__SSLCERTPATH
#              value: "/tls/keystore.p12"
#            - name: PROWLARR__SERVER__SSLCERTPASSWORD
#              valueFrom:
#                secretKeyRef:
#                  name: pkcs12-pass-secrets
#                  key: pkcs12-pass
            - name: PROWLARR__SERVER__URLBASE
              value: "/"
            - name: PROWLARR__SERVER__SSLPORT
              value: "6969"
            - name: PROWLARR__POSTGRES__HOST
              value: "prowlarr-postgres-rw.postgres"
            - name: PROWLARR__POSTGRES__PORT
              value: "5432"
            - name: PROWLARR__POSTGRES__USER
              value: "prowlarr"
            - name: PROWLARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prowlarr-secrets
                  key: PROWLARR__POSTGRES__PASSWORD
            - name: PROWLARR__POSTGRES__MAINDB
              value: "prowlarr"
            - name: PROWLARR__POSTGRES__LOGDB
              value: "logs"
          volumeMounts:
            - name: nas-media
              mountPath: /media
            - name: nas-mediacover
              mountPath: /config/MediaCover
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
      volumes:
        - name: nas-media
          nfs:
            server: nas.whezzel.com
            path: /mnt/netstorage/media
        - name: nas-mediacover
          nfs:
            server: nas.whezzel.com
            path: /mnt/netstorage/media/movies/MediaCover
