---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: prowlarr-https
  namespace: seedbox
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: prowlarr-headers
  namespace: seedbox
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr-http
  namespace: seedbox
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web   
    traefik.ingress.kubernetes.io/router.middlewares: seedbox-prowlarr-https@kubernetescrd
spec:
  rules:
    - host: prowlarr.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr-https
  namespace: seedbox
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"       
    traefik.ingress.kubernetes.io/router.middlewares: seedbox-prowlarr-headers@kubernetescrd
spec:
  tls:
  - secretName: whezzel.com-tls
  rules:
    - host: prowlarr.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 80