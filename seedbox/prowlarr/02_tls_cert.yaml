---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prowlarr-selfsigned-pkcs12-tls
  namespace: seedbox
spec:
  secretName: prowlarr-selfsigned-pkcs12-tls
  issuerRef:
    name: selfsigned-ca
    kind: ClusterIssuer
    group: cert-manager.io
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        key: password
        name: prowlarr-selfsigned-pkcs12-secret
  dnsNames:
  - prowlarr.seedbox.svc.cluster.local
  - prowlarr.seedbox
  - prowlarr
