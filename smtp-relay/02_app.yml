apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay-deployment
  namespace: smtp
  labels:
    app: smtp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtp-relay
  template:
    metadata:
      labels:
        app: smtp-relay
    spec:
      containers:
        - name: smtp-relay
          image: namshi/smtp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 25
              protocol: TCP
              hostPort: 25
          env:
            - name: RELAY_NETWORKS
              value: ":10.0.2.0/24"
            - name: MAILNAME
              value: "MAIL_NAME"
            - name: GMAIL_USER
              value: "GMAIL_ADDRESS"
            - name: GMAIL_PASSWORD
              value: "PASSWORD"