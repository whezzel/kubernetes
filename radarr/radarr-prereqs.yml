---
apiVersion: v1
kind: Namespace
metadata:
  name: seedbox
---
apiVersion: v1
kind: Service
metadata:
  name: radarr-service
  namespace: seedbox
spec:
  selector:
    app: radarr
  ports:
    - protocol: TCP
      port: 80
      targetPort: 7878
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-ingress
  namespace: seedbox
spec:
  rules:
    - host: radarr-k3s.nomacsec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr-service
                port:
                  number: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config-pvc
  namespace: seedbox
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-sas
  resources:
    requests:
      storage: 2Gi