---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: games
  labels:
    app: minecraft
#  annotations:
#    keel.sh/policy: force
#    keel.sh/match-tag: "true"
#    keel.sh/trigger: poll
#    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      name: minecraft
      labels:
        app: minecraft
    spec:
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          imagePullPolicy: Always
          stdin: true
          tty: true
          ports:
            - containerPort: 8100
              name: bluemap
            - containerPort: 25565
              name: minecraft
#            - containerPort: 25575
#              name: rcon
          livenessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: minecraft
            failureThreshold: 60
            periodSeconds: 10
          env:
            - name: TZ
              value: America/Chicago
            - name: TYPE
              value: fabric
            - name: VERSION
              value: 1.21.9
            - name: EULA
              value: "TRUE"
            - name: INIT_MEMORY
              value: 1G
            - name: MAX_MEMORY
              value: 8G
            - name: MEMORY
              value: 8G
            - name: SET_CONTAINER
              value: "true"
            - name: CONTAINER_TIMEZONE
              value: America/Chicago
            - name: ENABLE_ROLLING_LOGS
              value: "true"
            #- name: DIFFICULTY
            #  value: hard
            #- name: SNOOPER_ENABLED
            #  value: "false"
            #- name: ALLOW_FLIGHT
            #  value: "true"
            - name: SERVER_NAME
              value: Whezzel's World
            - name: WHITELIST
              value: "true"
            - name: ONLINE_MODE
              value: 'true'

          volumeMounts:
            - name: minecraft
              mountPath: /data
            - name: minecraft-bluemap
              mountPath: /data/bluemap
            - name: nas
              mountPath: /mnt/temp
          resources:
            requests:
              memory: 4Gi
              cpu: 2000m
      volumes:
        - name: minecraft
          persistentVolumeClaim:
            claimName: minecraft
        - name: minecraft-bluemap
          persistentVolumeClaim:
            claimName: minecraft-bluemap
        - name: nas
          nfs:
            server: nas01-20.whezzel.com
            path: /temp
