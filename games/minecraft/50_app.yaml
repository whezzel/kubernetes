---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: games
  labels:
    app: minecraft
#  annotations:
#    keel.sh/policy: force
#    keel.sh/match-tag: "true"
#    keel.sh/trigger: poll
#    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      name: minecraft
      labels:
        app: minecraft
    spec:
      containers:
        - name: minecraft
          image: ghcr.io/itzg/minecraft-server:latest
          imagePullPolicy: Always
          stdin: true
          tty: true
          ports:
            - containerPort: 25565
              name: minecraft
          livenessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: minecraft
            failureThreshold: 60
            periodSeconds: 10
          env:
            - name: TZ
              value: America/Chicago
            - name: TYPE
              value: fabric
            - name: VERSION
              value: "26.3"
            - name: EULA
              value: "TRUE"
            - name: MEMORY
              value: 8G
            - name: SET_CONTAINER
              value: "true"
            - name: CONTAINER_TIMEZONE
              value: America/Chicago
            - name: ENABLE_ROLLING_LOGS
              value: "true"
            #- name: DIFFICULTY
            #  value: hard
            #- name: SNOOPER_ENABLED
            #  value: "false"
            #- name: ALLOW_FLIGHT
            #  value: "true"
            - name: SERVER_NAME
              value: Whezzel's World
            - name: WHITELIST
              value: "true"
            - name: ONLINE_MODE
              value: 'true'
            - name: MODRINTH_PROJECTS
              value: |
                #advanced-shulkerboxes:beta
                appleskin
                #badpackets
                c2me-fabric:alpha
                carpet
                disconnect-packet-fix
                fabric-api
                fabric-language-kotlin
                ferrite-core
                jade
                jei:beta
                krypton
                lithium
                luckperms
                no-chat-reports
                scalablelux:alpha
                servercore
                servux
                spark
                #syncmatica
                vanilla-permissions
                veinminer
                villager-inventory-hwyla-plugin
                xp-stream
#            - name: MODS
#              values: |
#               https://cdn.modrinth.com/data/rd9rKuJT/versions/Gv74xveQ/disconnect-packet-fix-fabric-2.0.0.jar
#               https://github.com/gnembon/fabric-carpet/releases/download/1.4.193/fabric-carpet-1.21.11-1.4.193+v251211.jar
          volumeMounts:
            - name: minecraft
              mountPath: /data
            #- name: nas
            #  mountPath: /mods
          resources:
            requests:
              memory: 4Gi
              cpu: 2000m
      volumes:
        - name: minecraft
          persistentVolumeClaim:
            claimName: minecraft
        #- name: nas
        #  nfs:
        #    server: nas01-20.whezzel.com
        #    path: /temp
