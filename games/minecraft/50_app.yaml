---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: games
  labels:
    app: minecraft
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      name: minecraft
      labels:
        app: minecraft
    spec:
      nodeSelector:
        kubernetes.io/hostname: archserv01
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8123
              name: dynmap
            - containerPort: 25565
              name: minecraft
            - containerPort: 25575
              name: rcon
          env:
            - name: TZ
              value: "America/Chicago"
            - name: TYPE
              value: "paper"
            - name: VERSION
              value: "1.18"
            - name: EULA
              value: "TRUE"
            - name: INIT_MEMORY
              value: "4G"
            - name: MAX_MEMORY
              value: "8G"
            - name: MEMORY
              value: "8G"
            - name: SET_CONTAINER
              value: "true"
            - name: CONTAINER_TIMEZONE
              value: "America/Chicago"

          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: minecraft
              mountPath: /data
          resources:
            requests:
              memory: "4Gi"
              cpu: "250m"
            limits:
              memory: "8Gi"
              cpu: "8"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: minecraft
          persistentVolumeClaim:
            claimName: minecraft
