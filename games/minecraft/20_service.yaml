---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-lb
  namespace: games
  annotations:
    external-dns.alpha.kubernetes.io/hostname: minecraft.whezzel.com
spec:
  selector:
    app: minecraft
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  ports:
    - protocol: TCP
      name: minecraft
      port: 25565
      targetPort: minecraft
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
