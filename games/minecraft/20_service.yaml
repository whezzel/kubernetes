---
apiVersion: v1
kind: Service
metadata:
  name: bluemap
  namespace: games
spec:
  selector:
    app: minecraft
  ports:
    - name: bluemap
      protocol: TCP
      port: 80
      targetPort: bluemap
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-lb
  namespace: games
  labels:
    3amigos_tunnel: "false"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: minecraft.whezzel.com
spec:
  selector:
    app: minecraft
  ports:
    - protocol: TCP
      name: minecraft
      port: 25565
      targetPort: minecraft
    #- protocol: TCP
    #  name: rcon
    #  port: 25575
    #  targetPort: rcon
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
