---
apiVersion: v1
kind: Service
metadata:
  name: dynmap
  namespace: games
spec:
  selector:
    app: minecraft
  ports:
    - protocol: TCP
      port: 80
      targetPort: dynmap
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-tcp
  namespace: games
spec:
  selector:
    app: minecraft
  ports:
    - protocol: TCP
      name: minecraft
      port: 25565
      targetPort: minecraft
    - protocol: TCP
      name: rcon
      port: 25575
      targetPort: rcon
  type: LoadBalancer
  sessionAffinity: ClientIP