---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minecraft
  namespace: games
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: minecraft
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: games
    name: minecraft