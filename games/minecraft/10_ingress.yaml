---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bluemap
  namespace: games
spec:
  tls:
    - secretName: ""
  ingressClassName: "nginx"
  rules:
    - host: bluemap.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bluemap
                port:
                  name: bluemap
