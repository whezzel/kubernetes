---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorio
  namespace: games
  labels:
    app: factorio
#  annotations:
#    keel.sh/policy: force
#    keel.sh/match-tag: "true"
#    keel.sh/trigger: poll
#    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: factorio
  template:
    metadata:
      name: factorio
      labels:
        app: factorio
    spec:
      containers:
        - name: factorio
          image: factoriotools/factorio:stable
          imagePullPolicy: Always
          stdin: true
          tty: true
          ports:
            - containerPort: 34197
              name: factorio-tcp
              protocol: TCP
            - containerPort: 34197
              name: factorio-udp
              protocol: UDP
            - containerPort: 27015
              name: rcon
#          livenessProbe:
#            tcpSocket:
#              port: factorio-tcp
#            initialDelaySeconds: 180
#            periodSeconds: 10
#            timeoutSeconds: 10
#            failureThreshold: 10
#          readinessProbe:
#            tcpSocket:
#              port: factorio-tcp
#            initialDelaySeconds: 60
#            periodSeconds: 10
#            timeoutSeconds: 5
#            failureThreshold: 3
#          startupProbe:
#            tcpSocket:
#              port: factorio-tcp
#            failureThreshold: 60
#            periodSeconds: 10
          env:
            - name: GENERATE_NEW_SAVE
              value: "false"
            - name: LOAD_LATEST_SAVE
              value: "true"
            - name: SAVE_NAME
              value: Whezzel's World
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: factorio-secrets
                  key: TOKEN
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: factorio-secrets
                  key: USERNAME
          volumeMounts:
            - name: factorio
              mountPath: /factorio
            - name: nas
              mountPath: /mnt/temp
          resources:
            requests:
              memory: 2Gi
              cpu: 1000m
      volumes:
        - name: factorio
          persistentVolumeClaim:
            claimName: factorio
        - name: nas
          nfs:
            server: nas01-20.whezzel.com
            path: /temp
