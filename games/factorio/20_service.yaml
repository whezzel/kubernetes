---
apiVersion: v1
kind: Service
metadata:
  name: factorio-lb
  namespace: games
  labels:
    3amigos_tunnel: "true"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: factorio.whezzel.com
spec:
  selector:
    app: factorio
  ports:
    - name: factorio-udp
      protocol: UDP
      port: 34197
      targetPort: factorio-udp
    - name: factorio-tcp
      protocol: TCP
      port: 34197
      targetPort: factorio-tcp
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
