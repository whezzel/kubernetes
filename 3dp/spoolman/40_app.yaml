---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoolman
  namespace: 3dp
  labels:
    app: spoolman
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spoolman
  template:
    metadata:
      name: spoolman
      labels:
        app: spoolman
    spec:
      containers:
        - name: spoolman
          image: ghcr.io/donkie/spoolman:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: SPOOLMAN_PORT
              value: "8000"
            - name: SPOOLMAN_DB_TYPE
              value: postgres
            - name: SPOOLMAN_DB_HOST
              value: spoolman-postgres-rw.database
            - name: SPOOLMAN_DB_PORT
              value: "5432"
            - name: SPOOLMAN_DB_NAME
              value: spoolman
            - name: SPOOLMAN_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spoolman-secrets
                  key: username
            - name: SPOOLMAN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spoolman-secrets
                  key: password
          #volumeMounts:
          #  - name: spoolman
          #    mountPath: /home/app/.local/share/spoolman
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
      #volumes:
      #  - name: spoolman
      #    persistentVolumeClaim:
      #      claimName: spoolman
