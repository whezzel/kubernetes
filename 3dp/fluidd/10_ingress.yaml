---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fluidd
  namespace: 3dp
  annotations:
    nginx.ingress.kubernetes.io/auth-method: GET
    nginx.ingress.kubernetes.io/auth-url: http://authelia.auth.svc.cluster.local/api/authz/auth-request
    nginx.ingress.kubernetes.io/auth-signin: https://authelia.whezzel.com?rm=$request_method
    nginx.ingress.kubernetes.io/auth-response-headers: Remote-User,Remote-Name,Remote-Groups,Remote-Email
spec:
  tls:
    - {}
  ingressClassName: nginx
  rules:
    - host: fluidd.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fluidd
                port:
                  name: http
