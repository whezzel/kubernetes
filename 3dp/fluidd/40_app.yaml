---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluidd
  namespace: 3dp
  labels:
    app: fluidd
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: fluidd
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/macvlan-conf
      name: fluidd
      labels:
        app: fluidd
    spec:
      containers:
        - name: fluidd
          image: ghcr.io/fluidd-core/fluidd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
