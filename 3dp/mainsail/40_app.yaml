---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainsail
  namespace: 3dp
  labels:
    app: mainsail
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mainsail
  template:
    metadata:
      name: mainsail
      labels:
        app: mainsail
    spec:
      containers:
        - name: mainsail
          image: harbor.whezzel.com/proxy-ghcr.io/mainsail-crew/mainsail:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: mainsail-config
              mountPath: /usr/share/nginx/html/config.json
              readOnly: false
              subPath: config.json
          resources:
            requests:
              memory: 16Mi
              cpu: 50m
      volumes:
        - name: mainsail-config
          configMap:
            name: mainsail-config
