---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orca
  namespace: 3dp
  labels:
    app: orca
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: orca
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/macvlan-conf
      name: orca
      labels:
        app: orca
    spec:
      containers:
        - name: orca
          image: lscr.io/linuxserver/orcaslicer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: orca
              mountPath: /config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: orca
          persistentVolumeClaim:
            claimName: orca
