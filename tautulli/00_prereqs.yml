---
apiVersion: v1
kind: Namespace
metadata:
  name: plex
---
apiVersion: v1
kind: Service
metadata:
  name: tautulli-service
  namespace: plex
spec:
  selector:
    app: tautulli
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8181
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tautulli-ingress
  namespace: plex
spec:
  rules:
    - host: tautulli.nomacsec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tautulli-service
                port:
                  number: 80
    - host: tautulli-k3s.nomacsec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tautulli-service
                port:
                  number: 80
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tautulli-pv
spec:
  storageClassName: local
  capacity:
    storage: 500Mi
  accessModes:
    - ReadWriteOnce
  claimRef:
    name: tautulli-pvc
    namespace: plex
  hostPath:
    path: /mnt/raid10/k3s-storage/tautulli
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tautulli-pvc
  namespace: plex
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local
  volumeName: tautulli-pv
  resources:
    requests:
      storage: 500Mi