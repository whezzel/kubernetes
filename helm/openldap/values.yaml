global:
  ldapDomain: whezzel.com
  ldapPort: 389
  sslLdapPort: 636
nameOverride: openldap
fullnameOverride: openldap
commonAnnotations:
  reloader.stakater.com/auto: "true"
replicaCount: 3
#logLevel: info
service:
  annotations:
    external-dns.alpha.kubernetes.io/hostname: openldap.whezzel.com
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
  enableLdapPort: true
  enableSslLdapPort: true
env:
 BITNAMI_DEBUG: "true"
 LDAP_LOGLEVEL: "256"
 LDAP_REQUIRE_TLS: "false"
 LDAPTLS_REQCERT: allow
 LDAP_ENABLE_TLS: "yes"
 LDAP_SKIP_DEFAULT_TREE: "yes"
 LDAP_ALLOW_ANON_BINDING: "no"
persistence:
  enabled: true
  size: 2Gi
serviceAccount:
  create: true
  name: openldap
initTLSSecret:
  tls_enabled: true
  secret: openldap-tls
ltb-passwd:
  enabled : true
  replicaCount: 1
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/whitelist-source-range: "10.69.0.0/16"
    hosts:
    - ssl-ldap2.whezzel.com
    tls:
      - {}
phpldapadmin:
  enabled: true
  replicaCount: 1
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/whitelist-source-range: "10.69.0.0/16"
    hosts:
    - phpldapadmin.whezzel.com
    tls:
      - {}
