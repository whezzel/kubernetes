global:
  imageRegistry: ""
  ldapDomain: "whezzel.com"
  ldapPort: 389
  sslLdapPort: 636
nameOverride: "openldap"
fullnameOverride: "openldap"
replicaCount: 3
#logLevel: info
service:
  annotations:
    external-dns.alpha.kubernetes.io/hostname: openldap.whezzel.com
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
  enableLdapPort: true
  enableSslLdapPort: true
env:
 BITNAMI_DEBUG: "true"
 LDAP_LOGLEVEL: "256"
 LDAP_REQUIRE_TLS: "false"
 LDAPTLS_REQCERT: "allow"
 LDAP_ENABLE_TLS: "yes"
 LDAP_SKIP_DEFAULT_TREE: "yes"
 LDAP_ALLOW_ANON_BINDING: 'no'
persistence:
  enabled: enable
  size: 2Gi
serviceAccount:
  create: true
  name: "openldap"
initTLSSecret:
  tls_enabled: true
  secret: "openldap-tls"
ltb-passwd:
  enabled : true
  replicaCount: 1
  ingress:
    enabled: true
    hosts:
    - "ssl-ldap2.whezzel.com"
    tls:
      - secretName: ""
phpldapadmin:
  enabled: true
  replicaCount: 1
  ingress:
    enabled: true
    hosts:
    - phpldapadmin.whezzel.com
    tls:
      - secretName: ""
