---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openldap-dev-tls
  namespace: auth
spec:
  commonName: openldap-dev.auth.svc.cluster.local
  dnsNames:
    # Update for the number of replicas running
    - openldap-dev.auth.svc.cluster.local
    - openldap-dev-headless.auth.svc.cluster.local
    - openldap-dev-0.openldap-dev-headless.auth.svc.cluster.local
    - openldap-dev-1.openldap-dev-headless.auth.svc.cluster.local
    - openldap-dev-2.openldap-dev-headless.auth.svc.cluster.local
  secretName: openldap-dev-tls
  issuerRef:
    name: selfsigned-ca
    kind: ClusterIssuer
    group: cert-manager.io
