apiVersion: v1
kind: Service
metadata:
  name: talos-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: talos-metrics
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9100
      protocol: TCP
      targetPort: 9100
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: talos-metrics
  namespace: kube-system
  labels:
    kubernetes.io/service-name: talos-metrics
    endpointslice.kubernetes.io/managed-by: manual
    app.kubernetes.io/name: talos-metrics
addressType: IPv4
ports:
  - name: metrics
    protocol: TCP
    port: 9100
endpoints:
  - addresses: ["10.69.20.11"]
  - addresses: ["10.69.20.12"]
  - addresses: ["10.69.20.13"]
  - addresses: ["10.69.20.14"]
  - addresses: ["10.69.20.15"]
  - addresses: ["10.69.20.16"]
  - addresses: ["10.69.20.17"]
  - addresses: ["10.69.20.18"]
