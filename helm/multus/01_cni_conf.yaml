---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-conf
  namespace: multus
spec:
  config: |
    {
      "cniVersion": "0.3.0",
      "type": "macvlan",
      "mode": "bridge",
    	"ipam": {
    		"type": "host-local",
    		"ranges": [
    			[
    				{
    					"subnet": "10.69.20.0/24",
    					"rangeStart": "10.69.20.200",
    					"rangeEnd": "10.69.20.254"
    				}
    			]
    		],
    		"routes": [
          { "dst": "224.0.0.0/24", "gw": "10.69.20.1" },
          { "dst": "255.255.255.255/32", "gw": "10.69.20.1" }
        ]
    	}
    }
