---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily
  namespace: longhorn
spec:
  concurrency: 1
  cron: 0 0 * * *
  groups:
  - backups
  name: daily
  retain: 7
  task: backup
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: monthly
  namespace: longhorn
spec:
  concurrency: 1
  cron: 0 0 1 * ?
  groups:
  - backups
  name: monthly
  retain: 6
  task: backup
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly
  namespace: longhorn
spec:
  concurrency: 1
  cron: 0 0 ? * SUN
  groups:
  - backups
  name: weekly
  retain: 4
  task: backup
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: yearly
  namespace: longhorn
spec:
  concurrency: 1
  cron: 0 0 1 1 ?
  groups:
  - backups
  name: yearly
  retain: 1
  task: backup
