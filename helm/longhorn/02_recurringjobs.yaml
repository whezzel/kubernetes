---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily
  namespace: longhorn
spec:
  concurrency: 1
  cron: 0 6 * * *
  groups:
  - backups
  name: daily
  retain: 14
  task: backup
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: trim
  namespace: longhorn
spec:
  concurrency: 1
  cron: 0 7 * * *
  groups:
  - default
  name: trim
  retain: 0
  task: filesystem-trim
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup
  namespace: longhorn
spec:
  concurrency: 1
  cron: 0 8 * * *
  groups:
  - default
  name: snapshot-cleanup
  retain: 0
  task: snapshot-cleanup
