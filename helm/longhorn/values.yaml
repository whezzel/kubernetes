global:
  imageRegistry: harbor.whezzel.com/proxy-docker.io
image:
  longhorn:
    engine:
      registry: harbor.whezzel.com/proxy-docker.io
      repository: longhornio/longhorn-engine
    manager:
      registry: harbor.whezzel.com/proxy-docker.io
      repository: longhornio/longhorn-manager
    ui:
      registry: harbor.whezzel.com/proxy-docker.io
      repository: longhornio/longhorn-ui
    instanceManager:
      registry: harbor.whezzel.com/proxy-docker.io
      repository: longhornio/longhorn-instance-manager
    shareManager:
      registry: harbor.whezzel.com/proxy-docker.io
      repository: longhornio/longhorn-share-manager
    backingImageManager:
      registry: harbor.whezzel.com/proxy-docker.io
      repository: longhornio/backing-image-manager
    supportBundleKit:
      registry: harbor.whezzel.com/proxy-docker.io
      repository: longhornio/support-bundle-kit
persistence:
  defaultDataLocality: best-effort
  reclaimPolicy: Retain
  disableRevisionCounter: "false"
  recurringJobSelector:
    enable: true
    jobList: '[{"name": "backups", "isGroup": true},{"name": "default", "isGroup": true}]'
  removeSnapshotsDuringFilesystemTrim: ignored
csi:
  kubeletRootDir: /var/lib/kubelet
defaultSettings:
  createDefaultDiskLabeledNodes: true
  defaultDataLocality: best-effort
  replicaSoftAntiAffinity: false
  replicaAutoBalance: best-effort
  defaultLonghornStaticStorageClass: longhorn
  replicaZoneSoftAntiAffinity: true
  concurrentReplicaRebuildPerNodeLimit: 10
  concurrentAutomaticEngineUpgradePerNodeLimit: 5
  deletingConfirmationFlag: true
  snapshotDataIntegrity: fast-check
  fastReplicaRebuildEnabled: true
defaultBackupStore:
  backupTarget: nfs://nas01-20.whezzel.com:/longhorn
ingress:
  enabled: true
  ingressClassName: nginx
  host: longhorn.whezzel.com
  tls: true
  tleSecret: ""
