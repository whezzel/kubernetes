csi:
  kubeletRootDir: /var/lib/kubelet

defaultSettings:
  backupTarget: nfs://nas.whezzel.com:/mnt/netstorage/backups/longhorn
  concurrentAutomaticEngineUpgradePerNodeLimit: 5
  concurrentReplicaRebuildPerNodeLimit: 10
  defaultDataLocality: best-effort
  createDefaultDiskLabeledNodes: true
  defaultLonghornStaticStorageClass: longhorn
  defaultReplicaCount: 5
  deletingConfirmationFlag: true
  guaranteedEngineCPU: 0.20
  orphanAutoDeletion: true
  replicaAutoBalance: best-effort
  replicaSoftAntiAffinity: false
  replicaZoneSoftAntiAffinity: true
  fastReplicaRebuildEnabled: true
  snapshotDataIntegrity: fast-check

persistence:
  defaultClassReplicaCount: 5
  reclaimPolicy: Retain
  disableRevisionCounter: "false"

ingress:
  enabled: true
  ingressClassName: nginx
  host: longhorn.whezzel.com
  tls:
    - secretName: ""
