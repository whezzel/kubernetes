ingress:
  enabled: true
  rulesOverride:
    - host: authelia.whezzel.com
      path: /
  className: nginx
  tls:
    enabled: true
    secret: ''
pod:
  kind: Deployment
  replicas: 3
  selectors:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - authelia
            - key: app.kubernetes.io/instance
              operator: In
              values:
              - authelia
          topologyKey: kubernetes.io/hostname
  env:
    - name: TZ
      value: America/Chicago
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
configMap:
  disabled: false
  filters:
    disabled: false
  server:
    headers:
      csp_template: default-src 'self'; frame-src 'none'; object-src 'none'; style-src 'self' 'nonce-${NONCE}'; frame-ancestors 'self' homeassistant.whezzel.com; base-uri 'self'
    endpoints:
      authz:
        auth-request:
          implementation: AuthRequest
          authn_strategies:
          - name: HeaderAuthRequestProxyAuthorization
            schemes:
            - Basic
          - name: CookieSession
        ext-authz:
          implementation: ExtAuthz
          authn_strategies:
          - name: HeaderProxyAuthorization
            schemes:
            - Basic
          - name: CookieSession
        forward-auth:
          implementation: ForwardAuth
          authn_strategies:
          - name: HeaderProxyAuthorization
            schemes:
            - Basic
          - name: CookieSession
  log:
    level: debug # info, debug, trace
  telemetry:
    metrics:
      enabled: false
      serviceMonitor:
        enabled: false
  default_2fa_method: webauthn
  theme: dark
  definitions:
    network:
      k8s:
        - 10.244.0.0/16
      LAN:
        - 10.69.0.0/16
  identity_validation:
    reset_password:
      jwt_lifespan: 5 minutes
      jwt_algorithm: HS256
      secret:
        disabled: false
        secret_name: ~
        value: ''
        path: identity_validation.reset_password.jwt.hmac.key
    elevated_session:
      code_lifespan: 5 minutes
      elevation_lifespan: 10 minutes
      characters: 10
      require_second_factor: true
      skip_second_factor: false
  totp:
    disable: false
    issuer: Authelia
    skew: 1
    secret_size: 32
    algorithm: SHA1
    digits: 6
    period: 30
    allowed_algorithms:
      - SHA1
    allowed_digits:
      - 6
    allowed_periods:
      - 30
  webauthn:
    disable: false
    timeout: 60 seconds
    display_name: Authelia
    attestation_conveyance_preference: indirect
    filtering:
      permitted_aaguids: []
      prohibited_aaguids: []
      prohibit_backup_eligibility: false
    selection_criteria:
      attachment:
      discoverability: preferred
      user_verification: preferred
    metadata:
      enabled: false
      validate_trust_anchor: true
      validate_entry: true
      validate_entry_permit_zero_aaguid: false
      validate_status: true
      validate_status_permitted: []
      validate_status_prohibited: []
  ntp:
    address: udp://10.69.20.1:123
    version: 3
    max_desync: 3 seconds
    disable_startup_check: false
    disable_failure: false
  authentication_backend:
    password_reset:
      disable: false
      custom_url:
    password_change:
      disable: false
    refresh_interval: 5 minutes
    ldap:
      enabled: true
      implementation: custom
      address: ldaps://openldap.auth.svc.cluster.local:636
      timeout: 5 seconds
      start_tls: false
      tls:
        server_name:
        skip_verify: false
        minimum_version: TLS1.2
        maximum_version: TLS1.3
      pooling:
        enable: false
        count: 5
        retries: 2
        timeout: 10 seconds
      base_dn: dc=whezzel,dc=com
      additional_users_dn: ou=users
      users_filter: (&(|({username_attribute}={input})({mail_attribute}={input}))(objectClass=person))
      additional_groups_dn: ou=groups
      groups_filter: (&(member={dn})(objectclass=groupOfNames))
      permit_referrals: true
      permit_unauthenticated_bind: false
      permit_feature_detection_failure: false
      user: cn=bind_authelia,ou=services,dc=whezzel,dc=com
      password:
        disabled: false
        secret_name: ~
        value: ''
        path: authentication.ldap.password.txt
      attributes:
        distinguished_name: distinguishedName
        username: uid
        display_name: displayName
        family_name:
        given_name:
        middle_name:
        nickname:
        gender:
        birthdate:
        website:
        profile:
        picture:
        zoneinfo:
        locale:
        phone_number:
        phone_extension:
        street_address:
        locality:
        region:
        postal_code:
        country:
        mail: mail
        member_of: memberOf
        group_name: cn
        extra: {}
  password_policy:
    standard:
      enabled: false
      min_length: 8
      max_length: 0
      require_uppercase: false
      require_lowercase: false
      require_number: false
      require_special: false
    zxcvbn:
      enabled: false
      min_score: 0
  access_control:
    secret:
      enabled: false
      key: configuration.acl.yaml
      existingSecret:
    default_policy: deny
    rules:
      - domain:
          - authelia.whezzel.com
        policy: bypass
      - domain:
          - baikal.whezzel.com
        resources:
          - ^/dav.php.*$
        policy: bypass
      - domain:
          - baikal.whezzel.com
        resources:
          - ^*/admin.*$
        subject:
          - group:admins
          - group:baikal_admin
        policy: two_factor
      - domain:
          - changedetection.whezzel.com
        subject:
          - group:admins
          - group:changedetection
        policy: two_factor
      - domain:
          - dufs.whezzel.com
        subject:
          - group:admins
          - group:dufs
        policy: two_factor
      - domain:
          - esphome.whezzel.com
        subject:
          - group:admins
          - group:esphome
        policy: two_factor
      - domain:
          - fluidd.whezzel.com
        subject:
          - group:admins
          - group:fluidd
        policy: two_factor
      - domain:
          - frigate.whezzel.com
        resources:
          - ^/api([/?].*)?$
        policy: bypass
      - domain:
          - frigate.whezzel.com
        subject:
          - group:admins
          - group:frigate
        policy: two_factor
      - domain:
          - jellystat.whezzel.com
        subject:
          - group:admins
          - group:jellystat
        policy: two_factor
      - domain:
          - lidarr.whezzel.com
        resources:
          - ^/api([/?].*)?$
        policy: bypass
      - domain:
          - lidarr.whezzel.com
        subject:
          - group:admins
          - group:lidarr
        policy: two_factor
      - domain:
          - mainsail.whezzel.com
        subject:
          - group:admins
          - group:mainsail
        policy: two_factor
      - domain:
          - nodered.whezzel.com
        resources:
          - ^/hooks.*$
        policy: bypass
      - domain:
          - nodered.whezzel.com
        subject:
          - group:admins
          - group:nodered
        policy: two_factor
      - domain:
          - prowlarr.whezzel.com
        resources:
          - ^/api([/?].*)?$
        policy: bypass
      - domain:
          - prowlarr.whezzel.com
        subject:
          - group:admins
          - group:prowlarr
        policy: two_factor
      - domain:
          - radarr.whezzel.com
        resources:
          - ^/api([/?].*)?$
        policy: bypass
      - domain:
          - radarr.whezzel.com
        subject:
          - group:admins
          - group:radarr
        policy: two_factor
      - domain:
          - scrutiny.whezzel.com
        resources:
          - ^/api([/?].*)?$
        networks:
          - LAN
        policy: bypass
      - domain:
          - scrutiny.whezzel.com
        subject:
          - group:admins
          - group:scrutiny
        policy: two_factor
      - domain:
          - sonarr.whezzel.com
        resources:
          - ^/api([/?].*)?$
        policy: bypass
      - domain:
          - sonarr.whezzel.com
        subject:
          - group:admins
          - group:sonarr
        policy: two_factor
      - domain:
          - syncthing.whezzel.com
        subject:
          - group:admins
          - group:syncthing_user
        policy: two_factor
      - domain:
          - vaultwarden.whezzel.com
        resources:
          - ^*/admin.*$
        policy: two_factor
      - domain:
          - vaultwarden.whezzel.com
        policy: bypass
      - domain:
          - vscode.whezzel.com
        subject:
          - group:admins
          - group:vscode
        policy: two_factor
      - domain:
          - whoami.whezzel.com
        #subject:
        #  - group:admins
        #  - group:whoami
        #policy: two_factor
        policy: bypass
      - domain:
          - zigbee.whezzel.com
        subject:
          - group:admins
          - group:zigbee
        policy: two_factor
      - domain:
          - zwave.whezzel.com
        subject:
          - group:admins
          - group:zwave
        policy: two_factor
      - domain: "*.whezzel.com"
        subject:
          - group:admins
        policy: two_factor
  session:
    name: authelia_session
    same_site: lax
    expiration: 1 hour
    inactivity: 5 minutes
    remember_me: 1 month
    encryption_key:
      disabled: false
      secret_name: ~
      value: ''
      path: session.encryption.key
    cookies:
      - name: authelia_session
        domain: whezzel.com
        authelia_url: https://authelia.whezzel.com
        inactivity: 5 minutes
        expiration: 1 hour
        remember_me: 2 month
    redis:
      enabled: enabled
      deploy: false
      host: authelia-valkey-headless.valkey.svc.cluster.local
      port: 6379
      username: autheliasync
      password:
        disabled: false
        secret_name: ~
        value: ''
        path: session.redis.password.txt
      database_index: 0
      maximum_active_connections: 8
      minimum_idle_connections: 0
      tls:
        enabled: false
        server_name:
        skip_verify: false
        minimum_version: TLS1.2
        maximum_version: TLS1.3
      high_availability:
        enabled: true
        sentinel_name: valkeyha
        username: autheliasentinel
        password:
          disabled: false
          secret_name: ~
          value: ''
          path: session.redis.sentinel.password.txt
        nodes:
          - host: authelia-valkey-0.authelia-valkey-headless.valkey.svc.cluster.local
            port: 26379
          - host: authelia-valkey-1.authelia-valkey-headless.valkey.svc.cluster.local
            port: 26379
          - host: authelia-valkey-2.authelia-valkey-headless.valkey.svc.cluster.local
            port: 26379
        route_by_latency: false
        route_randomly: false
  regulation:
    modes:
      - user
    max_retries: 3
    find_time: 2 minutes
    ban_time: 5 minutes
  storage:
    encryption_key:
      disabled: false
      secret_name: ~
      value: ''
      path: storage.encryption.key
    postgres:
      enabled: true
      deploy: false
      address: tcp://authelia-postgres-rw.postgres:5432
      timeout: 5 seconds
      database: authelia
      schema: public
      username: authelia
      password:
        disabled: false
        secret_name: ~
        value: ''
        path: storage.postgres.password.txt
      tls:
        enabled: false
        server_name:
        skip_verify: false
        minimum_version: TLS1.2
        maximum_version: TLS1.3
  notifier:
    disable_startup_check: false
    smtp:
      enabled: true
      address: submission://docker-mailserver.email:587
      timeout: 5 seconds
      sender: Authelia <hello@whezzel.com>
      identifier: whezzel.com
      subject: '[Authelia] {title}'
      startup_check_address: test@authelia.com
      disable_html_emails: false
      disable_require_tls: false
      disable_starttls: false
      username: hello@whezzel.com
      password:
        disabled: false
        secret_name: ~
        value: ''
        path: notifier.smtp.password.txt
      tls:
        server_name: mail.whezzel.com
        skip_verify: false
        minimum_version: TLS1.2
        maximum_version: TLS1.3
  identity_providers:
    oidc:
      enabled: true
      hmac_secret:
        disabled: false
        secret_name: ~
        value: ''
        path: identity_providers.oidc.hmac.key
      lifespans:
        access_token: 1 hour
        authorize_code: 1 minute
        id_token: 1 hour
        refresh_token: 1 hour and 30 minutes
      claims_policies: {}
      scopes: {}
      enforce_pkce: public_clients_only
      enable_pkce_plain_challenge: false
      minimum_parameter_entropy: 8
      enable_client_debug_messages: false
      pushed_authorizations:
        enforce: false
        context_lifespan: 5 minutes
      authorization_policies: {}
      jwks:
        - key_id: default
          algorithm: RS256
          use: sig
          key:
            path: /secrets/authelia-oidc/oidc.jwks.default.RS256.pem
      cors:
        endpoints: []
        allowed_origins: []
        allowed_origins_from_client_redirect_uris: false
      clients:
        # k run --image authelia/authelia:latest authelia -it --rm --command -- authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
        # docker run -it --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
        - client_id: actual
          client_name: Actual
          client_secret:
            value: ''
            path: /secrets/authelia-oidc/oidc.client.actual.value
          public: false
          authorization_policy: two_factor
          consent_mode: implicit
          require_pkce: false
          pkce_challenge_method: ''
          redirect_uris:
            - https://actual.whezzel.com/openid/callback
          scopes:
            - openid
            - profile
            - groups
            - email
          response_types:
            - 'code'
          grant_types:
            - 'authorization_code'
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic
        - client_id: gitea
          client_name: Gitea
          client_secret:
            value: ''
            path: /secrets/authelia-oidc/oidc.client.gitea.value
          public: false
          authorization_policy: two_factor
          consent_mode: implicit
#          require_pkce: true
#          pkce_challenge_method: S256
          redirect_uris:
            - https://gitea.whezzel.com/user/oauth2/Authelia/callback
          scopes:
            - openid
            - email
            - profile
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic
        - client_id: grafana
          client_name: grafana
          client_secret:
            value: ''
            path: /secrets/authelia-oidc/oidc.client.grafana.value
          public: false
          authorization_policy: two_factor
          consent_mode: implicit
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://grafana.whezzel.com/login/generic_oauth
          scopes:
            - openid
            - profile
            - groups
            - email
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic
        - client_id: immich
          client_name: immich
          client_secret:
            value: ''
            path: /secrets/authelia-oidc/oidc.client.immich.value
          public: false
          authorization_policy: two_factor
          consent_mode: implicit
          redirect_uris:
            - https://immich.whezzel.com/auth/login
            - https://immich.whezzel.com/user-settings
            - app.immich:///oauth-callback
          scopes:
            - openid
            - profile
            - email
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_post
        - client_id: jellyfin
          client_name: Jellyfin
          client_secret:
            value: ''
            path: /secrets/authelia-oidc/oidc.client.jellyfin.value
          public: false
          authorization_policy: two_factor
          consent_mode: implicit
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://jellyfin.whezzel.com/sso/OID/redirect/authelia
            - app.jellyfin:///oauth-callback
          scopes:
            - openid
            - profile
            - groups
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_post
        - client_id: ollama
          client_name: Ollama
          client_secret:
            value: ''
            path: /secrets/authelia-oidc/oidc.client.ollama.value
          public: false
          authorization_policy: two_factor
          consent_mode: implicit
          redirect_uris:
            - https://ollama.whezzel.com/oauth/oidc/callback
          scopes:
            - openid
            - profile
            - groups
            - email
          userinfo_signed_response_alg: none
secret:
  disabled: false
  existingSecret: authelia
  mountPath: /secrets
  additionalSecrets:
    authelia-oidc: {}
certificates:
  existingSecret: selfsigned-ca
