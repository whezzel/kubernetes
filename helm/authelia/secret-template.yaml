---
apiVersion: v1
kind: Secret
metadata:
  name: authelia
  namespace: auth
type: Opaque
data:
  authentication.ldap.password.txt: |
    <ldap_bind_password>
  identity_providers.oidc.hmac.key: |
    <openssl rand -hex 64>
  identity_validation.reset_password.jwt.hmac.key: |
    <openssl rand -hex 64>
  notifier.smtp.password.txt: |
    <smtp_password>
  session.encryption.key: |
    <openssl rand -hex 64>
  session.redis.password.txt: |
    <redis_password>
  session.redis.sentinel.password.txt: |
    <redis_sentinel_password>
  storage.encryption.key: |
    <openssl rand -hex 64>
  storage.postgres.password.txt: |
    <postgress_password>
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-oidc
  namespace: auth
type: Opaque
data:
  ## Generate RSA key and cert
  # docker run --rm -u "$(id -u):$(id -g)" -v "$(pwd)":/keys harbor.whezzel.com/proxy-docker.io/authelia/authelia:latest authelia crypto certificate rsa generate --common-name auth.example.com --bits 2048 --directory /keys
  ## Generate OIDC Passwords
  # k run --image authelia/authelia:latest authelia -it --rm --command -- authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
  oidc.issuer_private_keys.default.RS256.crt: |
    -----BEGIN CERTIFICATE-----
    MIID..........
    -----END CERTIFICATE-----
  oidc.jwks.default.RS256.pem: |
    -----BEGIN PRIVATE KEY-----
    MIIE..........
    -----END PRIVATE KEY-----
  oidc.client.<APPNAME>.value: |
    $pbkdf2-......
