deploymentAnnotations:
  reloader.stakater.com/auto: "true"
env:
  - name: RFC2136_HOST
    valueFrom:
      secretKeyRef:
        name: external-dns-3amigos-secrets
        key: RFC2136_HOST
  - name: RFC2136_ZONE
    valueFrom:
      secretKeyRef:
        name: external-dns-3amigos-secrets
        key: RFC2136_ZONE
  - name: DOMAIN_FILTER
    valueFrom:
      secretKeyRef:
        name: external-dns-3amigos-secrets
        key: DOMAIN_FILTER
  - name: RFC2136_TSIG_SECRET
    valueFrom:
      secretKeyRef:
        name: external-dns-3amigos-secrets
        key: RFC2136_TSIG_SECRET
interval: 15s
sources:
  - service
  - ingress
policy: sync
registry: txt
txtOwnerId: external-dns-3amigos
txtPrefix: external-dns-3amigos-
txtSuffix:
domainFilters:
  - $(DOMAIN_FILTER)
provider:
  name: rfc2136
extraArgs:
  - --label-filter=3amigos_tunnel==true
  - --rfc2136-host=$(RFC2136_HOST)
  #- --rfc2136-min-ttl=60s
  - --rfc2136-port=53
  - --rfc2136-zone=$(RFC2136_ZONE)
  - --rfc2136-tsig-secret=$(RFC2136_TSIG_SECRET)
  - --rfc2136-tsig-secret-alg=hmac-sha512
  - --rfc2136-tsig-keyname=external-dns-3amigos
  - --rfc2136-tsig-axfr
