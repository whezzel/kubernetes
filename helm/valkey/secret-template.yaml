---
apiVersion: v1
kind: Secret
metadata:
  name: <APPNAME>-valkey-secrets
  namespace: valkey
type: Opaque
stringData:
  valkey-conf: |
    user <APPNAME> on +@all ~* &* ><PASSWORD_1> # openssl rand -hex 64
    
    requirepass <PASSWORD_2> # openssl rand -hex 64
    masterauth <PASSWORD_1> # openssl rand -hex 64
    masteruser <APPNAME>
    
---
apiVersion: v1
kind: Secret
metadata:
  name: <APPNAME>-sentinel-secrets
  namespace: valkey
type: Opaque
stringData:
  sentinel-conf: |
    user <APPNAME>sentinel on +@all ><PASSWORD_3> # openssl rand -hex 64

    sentinel auth-pass valkeyha <PASSWORD_1> # openssl rand -hex 64
    sentinel auth-user valkeyha <APPNAME>
    
    requirepass <PASSWORD_3> # openssl rand -hex 64
    sentinel sentinel-pass <PASSWORD_3> # openssl rand -hex 64
    sentinel sentinel-user <APPNAME>sentinel
