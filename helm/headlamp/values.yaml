replicaCount: 2
config:
  oidc:
    secret:
      create: true
      name: headlamp-oidc
ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.69.0.0/16"
  ingressClassName: nginx
  hosts:
    - host: headlamp.whezzel.com
      paths:
      - path: /
        type: ImplementationSpecific
  tls:
    - {}
