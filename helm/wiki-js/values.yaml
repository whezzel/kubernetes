image:
          imagePullPolicy: IfNotPresent

ingress:
  enabled: true
  tls:
    - secretName: ""
  hosts:
    - host: wiki.whezzel.com
      paths:
        - path: "/"
          pathType: Prefix

postgresql:
  existingSecret: wiki-js
  persistence:
    enabled: true
    existingClaim: wiki-js-postgresql
    size: 10Gi
    accessMode: ReadWriteOnce
