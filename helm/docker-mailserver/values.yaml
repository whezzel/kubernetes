nameOverride: ""
fullnameOverride: ""
image:
  name: "ghcr.io/docker-mailserver/docker-mailserver"
  tag: "latest"
  pullPolicy: "Always"
serviceAccount:
  create: true
certificate: whezzel-com-tls
rblRejectDomains: []
deployment:
  replicas: 1
  affinity: {}
  annotations:
    reloader.stakater.com/auto: "true"
  labels: {}
  runtimeClassName:
  priorityClassName:
  nodeSelector: {}
  strategy:
    type: "Recreate"
  env:
    OVERRIDE_HOSTNAME: mail.whezzel.com
    LOG_LEVEL: info
    SUPERVISOR_LOGLEVEL:
    DMS_VMAIL_UID:
    DMS_VMAIL_GID:
    ACCOUNT_PROVISIONER: LDAP
    POSTMASTER_ADDRESS: postmaster@whezzel.com
    ENABLE_UPDATE_CHECK: 1
    UPDATE_CHECK_INTERVAL: 7d
    PERMIT_DOCKER: none
    TZ: America/Chicago
    NETWORK_INTERFACE:
    TLS_LEVEL: modern
    SPOOF_PROTECTION: 1
    ENABLE_SRS: 1
    ENABLE_OPENDKIM: 0
    ENABLE_OPENDMARC: 0
    ENABLE_POLICYD_SPF: 0
    ENABLE_POP3: 1
    ENABLE_IMAP: 1
    ENABLE_CLAMAV: 0
    ENABLE_RSPAMD: 1
    ENABLE_RSPAMD_REDIS: 1
    RSPAMD_LEARN: 1
    RSPAMD_CHECK_AUTHENTICATED: 1
    RSPAMD_GREYLISTING: 0
    RSPAMD_HFILTER: 1
    RSPAMD_HFILTER_HOSTNAME_UNKNOWN_SCORE: 6
    RSPAMD_NEURAL: 0
    ENABLE_AMAVIS: 0
    AMAVIS_LOGLEVEL: 0
    ENABLE_DNSBL: 0
    ENABLE_FAIL2BAN: 0
    FAIL2BAN_BLOCKTYPE: drop
    ENABLE_MANAGESIEVE:
    POSTSCREEN_ACTION: enforce
    SMTP_ONLY:
    SSL_ALT_CERT_PATH:
    SSL_ALT_KEY_PATH:
    VIRUSMAILS_DELETE_DELAY:
    POSTFIX_DAGENT:
    POSTFIX_MAILBOX_SIZE_LIMIT:
    ENABLE_QUOTAS: 1
    POSTFIX_MESSAGE_SIZE_LIMIT:
    CLAMAV_MESSAGE_SIZE_LIMIT:
    PFLOGSUMM_TRIGGER:
    PFLOGSUMM_RECIPIENT:
    PFLOGSUMM_SENDER:
    LOGWATCH_INTERVAL:
    LOGWATCH_RECIPIENT:
    LOGWATCH_SENDER:
    REPORT_RECIPIENT:
    REPORT_SENDER:
    LOGROTATE_COUNT: 4
    LOGROTATE_INTERVAL: weekly
    POSTFIX_REJECT_UNKNOWN_CLIENT_HOSTNAME: 0
    POSTFIX_INET_PROTOCOLS: all
    DOVECOT_INET_PROTOCOLS: all
    ENABLE_SPAMASSASSIN: 0
    ENABLE_SPAMASSASSIN_KAM: 0
    SPAMASSASSIN_SPAM_TO_INBOX: 0
    MOVE_SPAM_TO_JUNK: 1
    MARK_SPAM_AS_READ: 0
    SA_TAG: 2.0
    SA_TAG2: 6.31
    SA_KILL: 10.0
    SPAM_SUBJECT: '***SPAM*** '
    ENABLE_FETCHMAIL: 0
    FETCHMAIL_POLL: 300
    FETCHMAIL_PARALLEL: 0
    ENABLE_GETMAIL: 1
    GETMAIL_POLL: 5
    LDAP_START_TLS:
    LDAP_SERVER_HOST: ldaps://openldap.auth.svc.cluster.local:636
    LDAP_SEARCH_BASE: dc=whezzel,dc=com
    LDAP_QUERY_FILTER_USER:
    LDAP_QUERY_FILTER_GROUP:
    LDAP_QUERY_FILTER_ALIAS:
    LDAP_QUERY_FILTER_DOMAIN:
    DOVECOT_TLS:
    DOVECOT_USER_FILTER:
    DOVECOT_PASS_FILTER:
    DOVECOT_MAILBOX_FORMAT: maildir
    DOVECOT_AUTH_BIND:
    ENABLE_POSTGREY: 0
    POSTGREY_DELAY: 300
    POSTGREY_MAX_AGE: 35
    POSTGREY_TEXT: "Delayed by Postgrey"
    POSTGREY_AUTO_WHITELIST_CLIENTS: 5
    ENABLE_SASLAUTHD: 0
    SASLAUTHD_MECHANISMS: ldap
    SASLAUTHD_MECH_OPTIONS:
    SASLAUTHD_LDAP_SERVER: ldaps://openldap.auth.svc.cluster.local:636
    SASLAUTHD_LDAP_SEARCH_BASE:
    SASLAUTHD_LDAP_FILTER:
    SASLAUTHD_LDAP_START_TLS:
    SASLAUTHD_LDAP_TLS_CHECK_PEER:
    SASLAUTHD_LDAP_TLS_CACERT_FILE:
    SASLAUTHD_LDAP_TLS_CACERT_DIR:
    SASLAUTHD_LDAP_PASSWORD_ATTR:
    SASLAUTHD_LDAP_AUTH_METHOD:
    SASLAUTHD_LDAP_MECH:
    SRS_SENDER_CLASSES: envelope_sender
    SRS_EXCLUDE_DOMAINS:
    SRS_SECRET:
    DEFAULT_RELAY_HOST:
    RELAY_HOST:
    RELAY_PORT: 25
    RELAY_USER:
  securityContext:
    runAsUser: 5000
    runAsGroup: 5000
  containerSecurityContext:
    readOnlyRootFilesystem: false
    privileged: false
  resizePolicy: []
  tolerations: []
  initContainers: []
  extraVolumeMounts:
    - name: selfsigned-ca
      mountPath: /usr/local/share/ca-certificates/selfsigned-ca.crt
      readOnly: true
      subPath: tls.crt
  extraVolumes:
    - name: selfsigned-ca
      secret:
        secretName: selfsigned-ca
service:
  type: "LoadBalancer"
  externalTrafficPolicy: "Local"
  trafficDistribution: ""
  annotations:
    external-dns.kubernetes.io/hostname: mail.whezzel.com,smtp.whezzel.com,imap.whezzel.com,pop3.whezzel.com
  labels: {}
persistent_volume_claims:
  mail-config:
    enabled: true
    existingClaim: dms-config
    size: 10Mi
    annotations: {}
    accessModes:
      - ReadWriteOnce
    storageClass:
    selector: {}
  mail-data:
    enabled: true
    existingClaim: dms-data
    size: 10Gi
    annotations: {}
    accessModes:
      - ReadWriteOnce
    storageClass:
    selector: {}
  mail-state:
    enabled: true
    existingClaim: dms-state
    size: 20Gi
    annotations: {}
    accessModes:
      - ReadWriteOnce
    storageClass:
    selector: {}
  mail-log:
    enabled: true
    existingClaim: ""
    size: 1Gi
    annotations: {}
    accessModes:
      - ReadWriteOnce
    storageClass: longhorn-db
    selector: {}
persistence:
  mail-config:
    volumeName: mail-config
    mountPath: /tmp/docker-mailserver
    subPath:
  mail-data:
    volumeName: mail-data
    mountPath: /var/mail
    subPath:
  mail-state:
    volumeName: mail-state
    mountPath: /var/mail-state
    subPath:
monitoring:
  service:
    scrape: "true"
    probe: "false"
    path: "/metrics"
    port: "9102"
  pod:
    scrape: "true"
    probe: "false"
    path: "/metrics"
    port: "9102"
rspamd:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations: {}
    host: rspamd.whezzel.com
    path: /
    tls:
      enabled: true
      secret:
dovecot:
  fullTextSearch:
    enabled: false
    verbose: 0
    cron:
      enabled: true
      schedule: 0 4 * * *
proxyProtocol:
  enabled: false
  trustedNetworks: "10.69.0.0/16 10.244.0.0/16"
metrics:
  enabled: false
  image:
    name: blackflysolutions/postfix-exporter@sha256
    tag: 7ed7c0534112aff5b44757ae84a206bf659171631edfc325c3c1638d78e74f73
    pullPolicy: "IfNotPresent"
  resizePolicy: []
  serviceMonitor:
    enabled: false
    scrapeInterval: 15s
    labels: {}
configMaps:
  dovecot.cf:
    create: true
    path: dovecot.cf
    data: |
      {{- if .Values.proxyProtocol.enabled }}
        haproxy_trusted_networks = {{ .Values.proxyProtocol.trustedNetworks }}

        {{- if and (.Values.deployment.env.ENABLE_IMAP) (not .Values.deployment.env.SMTP_ONLY) }}
        service imap-login {
            inet_listener imap {
                port = 143
            }

            inet_listener imaps {
                port = 993
                ssl = yes
            }

            inet_listener imap_proxyprotocol {
                haproxy = yes
                port = 10143
                ssl = no
            }

            inet_listener imaps_proxyprotocol {
                haproxy = yes
                port = 10993
                ssl = yes
            }
        }
        {{- end -}}

        {{- if and (.Values.deployment.env.ENABLE_POP3) (not .Values.deployment.env.SMTP_ONLY) }}
        service pop3-login {
            inet_listener pop3 {
                port = 110
            }

            inet_listener pop3s {
                port = 995
                ssl = yes
            }

            inet_listener pop3_proxyprotocol {
                haproxy = yes
                port = 10110
                ssl = no
            }

            inet_listener pop3s_proxyprotocol {
                haproxy = yes
                port = 10995
                ssl = yes
            }
        }
        {{- end -}}

        {{- if and (.Values.deployment.env.ENABLE_MANAGESIEVE) (not .Values.deployment.env.SMTP_ONLY) }}
        service managesieve-login {
            inet_listener sieve {
                port = 4190
            }

            inet_listener sieve_proxyprotocol {
                port = 14190
            }
        }
        {{- end -}}
      {{- end -}}

  fts-xapian-plugin.conf:
    create: true
    path: /etc/dovecot/conf.d/10-plugin.conf
    data: |
      {{- if .Values.dovecot.fullTextSearch.enabled }}
        mail_plugins = $mail_plugins fts fts_xapian

        plugin {
            fts = xapian
            fts_xapian = partial=3 full=20 verbose={{ .Values.dovecot.fullTextSearch.verbose }}

            fts_autoindex = yes
            fts_enforced = yes

            # Index attachements
            fts_decoder = decode2text
        }

        service indexer-worker {
            # limit size of indexer-worker RAM usage, ex: 512MB, 1GB, 2GB
            vsz_limit = {{ .Values.dovecot.fullTextSearch.resources.memory }}
        }
      {{- end -}}

  user-patches.sh:
    create: true
    path: user-patches.sh
    data: |
      #!/bin/bash

      set -euo pipefail

      # Update CA certificates
      update-ca-certificates

      sed -i 's/message_size_limit = 10240000/message_size_limit = 104857600/' /etc/postfix/main.cf

      # Valid values: never, hard, demand, allow, try
      echo "tls_require_cert = demand" >> /etc/dovecot/dovecot-ldap.conf.ext

      SIEVE_SOURCE_DIR="/tmp/docker-mailserver"
      VMAIL_BASE="/var/mail"
      VMAIL_UID=5000
      VMAIL_GID=5000

      if [[ ! -d "$SIEVE_SOURCE_DIR" ]]; then
        echo "No /tmp/docker-mailserver found – skipping sieve auto-copy."
        exit 0
      fi

      shopt -s nullglob
      for src_file in "$SIEVE_SOURCE_DIR"/*.dovecot.sieve; do
        [[ -f "$src_file" ]] || continue

        filename=$(basename "$src_file")

        if [[ $filename =~ ^(.+)@(.+)\.dovecot\.sieve$ ]]; then
          localpart="${BASH_REMATCH[1]}"
          domain="${BASH_REMATCH[2]}"
          full_user="${localpart}@${domain}"
        else
          echo "Invalid sieve filename skipped: $filename (expected localpart@domain.dovecot.sieve)"
          continue
        fi

        domain_dir="$VMAIL_BASE/$domain"
        user_dir="$domain_dir/$localpart"

        home_dir="$user_dir/home"
        target_sieve="$home_dir/.dovecot.sieve"

        if [[ ! -d "$domain_dir" ]]; then
          mkdir -p "$domain_dir"
          chmod 700 "$domain_dir"
          chown "${VMAIL_UID}:${VMAIL_GID}" "$domain_dir"
          echo "Created domain dir: $domain_dir (700, owned by vmail)"
        fi

        if [[ ! -d "$user_dir" ]]; then
          mkdir -p "$user_dir"
          chmod 700 "$user_dir"
          chown "${VMAIL_UID}:${VMAIL_GID}" "$user_dir"
          echo "Created user dir: $user_dir (700, owned by vmail)"
        fi

        mkdir -p "$home_dir"
        chmod 700 "$home_dir"
        chown "${VMAIL_UID}:${VMAIL_GID}" "$home_dir" 2>/dev/null || true

        cp -f "$src_file" "$target_sieve"
        chmod 600 "$target_sieve"
        chown "${VMAIL_UID}:${VMAIL_GID}" "$target_sieve" 2>/dev/null || true

        if command -v sievec >/dev/null 2>&1; then
          su -s /bin/bash docker -c "sievec \"$target_sieve\"" >/dev/null 2>&1 || echo "sievec warning for $filename"
        fi
        
        chown "${VMAIL_UID}:${VMAIL_GID}" "${target_sieve}.svbin" 2>/dev/null || true
        chmod 644 "${target_sieve}.svbin" 2>/dev/null || true
        
        echo "Installed sieve script for $full_user → $target_sieve"
      done

      echo "Sieve auto-install complete."
      
      echo "Applying Postfix LMTP original-recipient fix..."

      postconf -e 'lmtp_destination_recipient_limit = 1'
      postconf -F 'lmtp/unix/command=lmtp flags=DO'

      echo "Postfix LMTP fix applied (X-Original-To will now be preserved)"

      echo "user-patches.sh completed."

      {{- if .Values.proxyProtocol.enabled }}
      # NOTE: Keep in sync with upstream advice:
      # https://github.com/docker-mailserver/docker-mailserver/blob/v15.0.0/docs/content/examples/tutorials/mailserver-behind-proxy.md?plain=1#L238-L268

      # Duplicate the config for the submission(s) service ports (587 / 465) with adjustments for the PROXY ports (10587 / 10465) and `syslog_name` setting:
      postconf -Mf submission/inet | sed -e s/^submission/10587/ -e 's/submission/submission-proxyprotocol/' >> /etc/postfix/master.cf
      postconf -Mf submissions/inet | sed -e s/^submissions/10465/ -e 's/submissions/submissions-proxyprotocol/' >> /etc/postfix/master.cf
      # Enable PROXY Protocol support for these new service variants:
      postconf -P 10587/inet/smtpd_upstream_proxy_protocol=haproxy
      postconf -P 10465/inet/smtpd_upstream_proxy_protocol=haproxy
      
      # Create a variant for port 25 too (NOTE: Port 10025 is already assigned in DMS to Amavis):
      postconf -Mf smtp/inet | sed -e s/^smtp/12525/ >> /etc/postfix/master.cf
      # Enable PROXY Protocol support:
      # - Uses a different setting as port 25 is handled via the postscreen service
      # - Optionally configure a `syslog_name` to distinguish in logs:
      postconf -P \
        12525/inet/postscreen_upstream_proxy_protocol=haproxy \
        12525/inet/syslog_name=postfix/smtpd-proxyprotocol

      # Add the `proxy:` prefix to share this cache between each running postscreen service via `proxymap`:
      postconf 'postscreen_cache_map = proxy:btree:$data_directory/postscreen_cache'
      {{- end }}
  sieve-hello:
    create: true
    path: hello@whezzel.com.dovecot.sieve
    data: |
      require ["fileinto", "mailbox", "variables", "regex"];
      if header :regex "X-Original-To" "^([^@]+)@whezzel\\.com$" {
          set "localpart" "${1}";
          set :lower "folder" "${localpart}";
          if string :is "${localpart}" "hello" {
              stop;
          }
          if string :contains "${localpart}" "dmarc" {
              set "folder" "DMARC";
          }
          set :upperfirst "folder" "${folder}";
          fileinto :create "INBOX.${folder}";
          stop;
      }
  sieve-zach:
    create: true
    path: zach@whezzel.com.dovecot.sieve
    data: |
      require ["fileinto", "mailbox", "variables", "regex"];
      
      if header :regex "X-Original-To" "^([^@+]+)(\\+([^@]+))?@whezzel\\.com$" {
          set "base" "${1}";
          set "tag" "${3}";
      
          if string :is "${tag}" "" {
              set :lower "folder" "${base}";
          } else {
              set :lower "base_l" "${base}";
              set :lower "tag_l" "${tag}";
      
              # Sanitize dots in tag (replace . with _)
              set "tag_clean" "${tag_l}";
              if string :matches "${tag_clean}" "*.*" {
                  if string :regex "${tag_clean}" "^([^.]*)\\.(.+)$" {
                      set "tag_clean" "${1}_${2}";
                  }
              }
              if string :matches "${tag_clean}" "*.*" {
                  if string :regex "${tag_clean}" "^([^.]*)\\.(.+)$" {
                      set "tag_clean" "${1}_${2}";
                  }
              }
              if string :matches "${tag_clean}" "*.*" {
                  if string :regex "${tag_clean}" "^([^.]*)\\.(.+)$" {
                      set "tag_clean" "${1}_${2}";
                  }
              }
      
              set "folder" "${base_l}.${tag_clean}";
          }
      
          set :upperfirst "folder" "${folder}";
          fileinto :create "INBOX.${folder}";
          stop;
      }
secrets:
  rspamd.dkim.rsa-2048-mail-whezzel.com.private.txt:
    name: rspamd.dkim.rsa-2048-mail-whezzel.com.private.txt
    create: false
    path: rspamd/dkim/rsa-2048-mail-whezzel.com.private.txt
  rspamd.dkim.rsa-2048-mail-whezzel.com.public.txt:
    name: rspamd.dkim.rsa-2048-mail-whezzel.com.public.txt
    create: false
    path: rspamd/dkim/rsa-2048-mail-whezzel.com.public.txt
extraDeploy: []
