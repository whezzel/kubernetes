global:
#  env:
#    - name: AUTHENTIK_POSTGRESQL__USER
#      valueFrom:
#        secretKeyRef:
#          name: authentik.authentik-postgres.credentials.postgresql.acid.zalan.do
#          key: username
#    - name: AUTHENTIK_POSTGRESQL__PASSWORD
#      valueFrom:
#        secretKeyRef:
#          name: authentik.authentik-postgres.credentials.postgresql.acid.zalan.do
#          key: password
  envFrom:
    - secretRef:
        name: authentik-secret
  volumeMounts:
    - name: authentik
      mountPath: "/data/user_settings.py"
      subPath: user_settings.py
  volumes:
    - name: authentik
      configMap:
        name: authentik

authentik:
  log_level: info
  error_reporting:
    enabled: false

server:
  pdb:
    labels:
      app: authentik-server
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values:
            - worker
        topologyKey: "kubernetes.io/hostname"
  ingress:
    enabled: true
    tls:
      - secretName: ""
    hosts:
      - authentik.whezzel.com

postgresql:
  enabled: false

redis:
  enabled: true

worker:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values:
            - server
        topologyKey: "kubernetes.io/hostname"
