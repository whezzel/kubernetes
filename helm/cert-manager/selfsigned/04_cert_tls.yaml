---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openldap-tls
  namespace: auth
spec:
  commonName: openldap.auth.svc
  dnsNames:
    - "openldap.auth.svc"
    - "openldap.auth.svc.cluster.local"
    - "openldap-headless.auth.svc.cluster.local"
    - "*.openldap-headless.auth.svc.cluster.local"
  secretName: openldap-tls
  issuerRef:
    name: selfsigned-ca
    kind: ClusterIssuer
    group: cert-manager.io
