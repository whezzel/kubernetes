image:
  repository: harbor.whezzel.com/proxy-quay.io/jetstack/cert-manager-controller
acmesolver:
  image:
    repository: harbor.whezzel.com/proxy-quay.io/jetstack/cert-manager-acmesolver
startupapicheck:
  image:
    repository: harbor.whezzel.com/proxy-quay.io/jetstack/cert-manager-startupapicheck
crds:
  enabled: true
dns01RecursiveNameservers: 8.8.8.8:53,1.1.1.1:53
dns01RecursiveNameserversOnly: true
replicaCount: 2
#prometheus:
#  enabled: true
#  servicemonitor:
#    enabled: true
resources:
  requests:
    memory: 64Mi
    cpu: 50m
webhook:
  image:
    repository: harbor.whezzel.com/proxy-quay.io/jetstack/cert-manager-webhook
  replicaCount: 2
  resources:
    requests:
      memory: 32Mi
      cpu: 50m
cainjector:
  image:
    repository: harbor.whezzel.com/proxy-quay.io/jetstack/cert-manager-cainjector
  replicaCount: 2
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
