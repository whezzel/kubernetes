---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: whezzel.com-tls
  namespace: cert-manager
spec:
  secretName: whezzel.com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: Issuer
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        key: pkcs12-pass
        name: cert-manager-secrets
  dnsNames:
  - whezzel.com
  - '*.whezzel.com'
