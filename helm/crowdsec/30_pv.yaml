---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: crowdsec-config
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: crowdsec-config
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: crowdsec
    name: crowdsec-config
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: crowdsec-data
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: crowdsec-data
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: crowdsec
    name: crowdsec-data
