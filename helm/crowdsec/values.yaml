---
container_runtime: containerd
image:
  repository: crowdsecurity/crowdsec
  pullPolicy: Always
  #tag: dev
  tag: latest
config:
  parsers:
    s00-raw: {}
    s01-parse:
      gotify-logs.yaml: |
        ---
        filter: evt.Parsed.program == "gotify"
        debug: false
        onsuccess: next_stage
        name: whezzel/gotify-logs
        description: parser for Gotify server
        pattern_syntax:
          OLD_TIMESTAMP: '^\[GIN\] %{YEAR:year}/%{MONTHDAY:month}/%{DAY2:day} - %{TIME:time}'
          NEW_TIMESTAMP: '^%{YEAR:year}-%{MONTHDAY:month}-%{DAY2:day}T%{TIME:time}%{ISO8601_TIMEZONE}'
          SEPERATOR: '%{SPACE}[|]%{SPACE}'
        nodes:
          - grok:
              pattern: '%{OLD_TIMESTAMP}%{SEPERATOR}%{NUMBER:http_status}%{SEPERATOR}%{DATA:request_time_tool}%{SEPERATOR}%{IP:source_ip}%{SEPERATOR}%{WORD:request_type}%{SPACE}\"\/%{WORD:endpoint}\"$'
              # example: [GIN] 2022/02/07 - 10:49:33 | 401 |     505.317µs |       156.146.39.213 | POST     "/client"
              apply_on: message
              statics:
                - meta: log_type
                  value: gotify_failed_auth
                - target: StrTime
                  expression: |-
                    evt.Parsed.year + "-" + evt.Parsed.month + "-" + evt.Parsed.day + "T" + evt.Parsed.time
          - grok:
              pattern: '%{NEW_TIMESTAMP}%{SEPERATOR}%{NUMBER:http_status}%{SEPERATOR}%{DATA:request_time_tool}%{SEPERATOR}%{IP:source_ip}%{SEPERATOR}%{WORD:request_type}%{SPACE}\"\/%{WORD:endpoint}\"$'
              # example: 2023-10-08T14:02:49-05:00 | 401 |    5.719155ms |  156.146.39.213 | POST     "/client"
              apply_on: message
              statics:
                - meta: log_type
                  value: gotify_failed_auth
                - target: StrTime
                  expression: |-
                    evt.Parsed.year + "-" + evt.Parsed.month + "-" + evt.Parsed.day + "T" + evt.Parsed.time
        statics:
          - meta: source_ip
            expression: evt.Parsed.source_ip
          - meta: http_status
            expression: evt.Parsed.http_status
      dovecot-logs.yaml: |
        ---
        onsuccess: next_stage
        debug: false
        filter: "evt.Parsed.program == 'dovecot'"
        name: whezzel/dovecot-logs
        description: "Parse dovecot logs"
        pattern_syntax:
          AUTH_FUNC: '[A-Za-z0-9_]+(\(\))?'
        nodes:
          - grok:
              pattern: "auth: %{DATA:auth_type}\\(%{DATA:dovecot_user},%{IP:dovecot_remote_ip},<%{DATA:auth_func}>\\):%{DATA:dovecot_login_message}$"
              apply_on: message
          - grok:
              pattern: "auth: %{DATA:auth_type}\\(%{DATA:dovecot_user},%{IP:dovecot_remote_ip}\\): (%{AUTH_FUNC:auth_func} failed: )?%{DATA:dovecot_login_message}$"
              apply_on: message
        statics:
            - meta: log_type
              value: dovecot_logs
            - meta: source_ip
              expression: "evt.Parsed.dovecot_remote_ip"
            - meta: dovecot_login_result
              expression: "any(['Authentication failure', 'Password mismatch', 'password mismatch', 'auth failed', 'unknown user'], {evt.Parsed.dovecot_login_message contains #}) ? 'auth_failed' : ''"
    s02-enrich: {}
  scenarios:
    gotify-bf.yaml: |
      ---
      type: leaky
      name: whezzel/gotify-bf
      description: "Detect bruteforce"
      filter: "evt.Meta.log_type  == 'gotify_failed_auth'"
      groupby: "evt.Meta.source_ip"
      capacity: 4
      leakspeed: "10s"
      blackhole: 1m
      labels:
        service: gotify
        behavior: "http:bruteforce"
        classification:
          - attack.T1110
        spoofable: 0
        confidence: 3
        label: "Gotify Bruteforce"
        remediation: true
  postoverflows:
    s00-enrich: {}
    s01-whitelist: {}
  simulation.yaml: 
  console.yaml: 
  capi_whitelists.yaml: 
  profiles.yaml: |
    ---
    name: default_ip_remediation
    filters:
     - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
     - type: ban
       duration: 24h
    duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 24)
    notifications:
     - http_gotify   # Set the required http parameters in /etc/crowdsec/notifications/http.yaml before enabling this.
    on_success: break
  config.yaml.local: |
    api:
      server:
        auto_registration:
          enabled: true
          token: "${REGISTRATION_TOKEN}"
          allowed_ranges:
            - "127.0.0.1/32"
            - "10.244.0.0/16"
            - "10.69.20.2/32"
            - "10.69.20.3/32"
        use_forwarded_for_headers: true
        online_client:
          credentials_path: "/etc/crowdsec/online_api_credentials.yaml"
        trusted_ips:
          - 127.0.0.1
          - ::1
          - 10.69.20.2
          - 10.69.20.3
    db_config:
      type:     postgresql
      user:     crowdsec
      password: "${DB_PASSWORD}"
      db_name:  crowdsec
      host:     crowdsec-postgres-rw.postgres
      port:     5432
      sslmode:  require
      flush:
        agents_autodelete:
          cert: 60m
          login_password: 60m
  notifications:
    http-gotify.yaml: |
      ---
      type: http          # Don't change
      name: http_gotify # Must match the registered plugin in the profile
      log_level: info
      format: |
        {{ range . -}}
        {{ $alert := . -}}
        {
          "extras": {
            "client::display": {
            "contentType": "text/markdown"
          }
        },
        "priority": 0,
        {{range .Decisions -}}
        "title": "Crowdsec",
        "message": "{{.Type }} {{ .Value }} for {{.Duration}}  \n{{.Scenario}}  \n[crowdsec cti](https://app.crowdsec.net/cti/{{.Value -}})  \n[shodan](https://shodan.io/host/{{.Value -}})"
        {{end -}}
        }
        {{ end -}}
      url: http://gotify.email.svc.cluster.local/message
      method: POST
      headers:
        X-Gotify-Key: AhvQ2l4Bwle8t99
        Content-Type: application/json
lapi:
  enabled: true
  replicas: 2
  env:
    - name: TZ
      value: America/Chicago
    - name: BOUNCER_KEY_opnsense01
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: BOUNCER_KEY_opnsense01
    - name: BOUNCER_KEY_opnsense02
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: BOUNCER_KEY_opnsense02
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: DB_PASSWORD
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
    ingressClassName: nginx
    host: crowdsec-api.whezzel.com
    tls:
      - {}
  extraVolumes:
    - name: crowdsec-capi-credentials
      secret:
        secretName: crowdsec-capi-credentials
  extraVolumeMounts:
    - name: crowdsec-capi-credentials
      mountPath: /etc/crowdsec/online_api_credentials.yaml
      readOnly: true
      subPath: online_api_credentials.yaml
  dashboard:
    enabled: false
    ingress:
      enabled: false
      ingressClassName: nginx
      host: crowdsec.whezzel.com
      tls:
        - {}
  persistentVolume:
    data:
      enabled: false
    config:
      enabled: false
      existingClaim: crowdsec-config
      size: 100Mi
#  metrics:
#    enabled: true
#    serviceMonitor:
#      enabled: true
  storeCAPICredentialsInSecret: false
agent:
  acquisition:
    - namespace: auth
      podName: authelia-*
      program: authelia
    - namespace: dns
      podName: bind-*
      program: bind
    - namespace: cloud
      podName: immich-*
      program: immich
    - namespace: email
      podName: gotify-*
      program: gotify
    - namespace: mediaserver
      podName: jellyfin-*
      program: jellyfin
    - namespace: nginx
      podName: nginx-ingress-nginx-controller-*
      program: nginx
    - namespace: passman
      podName: vaultwarden-*
      program: vaultwarden
    - namespace: logging
      podName: grafana-*
      program: grafana
    - namespace: homeassistant
      podName: homeassistant-*
      program: home-assistant
    - namespace: cloud
      podName: baikal-*
      program: baikal
    - namespace: email
      podName: docker-mailserver-*
      program: dovecot
    - namespace: email
      podName: docker-mailserver-*
      program: postfix/smtpd
    - namespace: email
      podName: docker-mailserver-*
      program: postfix/postscreen
  env:
    - name: TZ
      value: America/Chicago
    - name: COLLECTIONS
      value: LePresidente/authelia mstilkerich/bind9 crowdsecurity/nginx gauth-fr/immich LePresidente/jellyfin Dominic-Wagner/vaultwarden LePresidente/grafana crowdsecurity/home-assistant andreasbrett/baikal crowdsecurity/postfix crowdsecurity/dovecot
    - name: LEVEL_DEBUG
      value: "false"
    - name: LEVEL_TRACE
      value: "false"
