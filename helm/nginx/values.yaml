---
controller:
  image:
    registry: harbor.whezzel.com/proxy-registry.k8s.io
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - ingress-nginx
          - key: app.kubernetes.io/instance
            operator: In
            values:
            - nginx
          - key: app.kubernetes.io/component
            operator: In
            values:
            - controller
        topologyKey: kubernetes.io/hostname
  replicaCount: 5
  service:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: nginx.whezzel.com
    type: LoadBalancer
    externalTrafficPolicy: Local
    loadBalancerIP: 10.69.21.197
    ports:
      http: 80
      https: 443
  extraArgs:
    default-ssl-certificate: cert-manager/whezzel-com-tls
  config:
    compute-full-forwarded-for: true
    use-forwarded-headers: true
    #annotations-risk-level: Critical
    proxy-real-ip-cidr: 10.69.0.0/16,10.244.0.0/16
    enable-real-ip: "true"
    real-ip-header: X-Forwarded-For
    set-real-ip-from: 10.69.0.0/16,10.244.0.0/16
  ingressClassResource:
    default: true
  admissionWebhooks:
    patch:
      image:
        registry: harbor.whezzel.com/proxy-registry.k8s.io
