---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssh-config
  namespace: homeassistant
data:
  ssh_config: |
    Host github.com
      IdentityFile /config/.ssh/github_id_ed25519
      UserKnownHostsFile /config/.ssh/known_hosts
      AddressFamily inet
    Host github.com.
      IdentityFile /config/.ssh/github_id_ed25519
      UserKnownHostsFile /config/.ssh/known_hosts
      AddressFamily inet
