---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vscode-configmap
  namespace: homeassistant
data:
  ssh-config: |
    Host github.com
      HostName github.com
      User git
      IdentityFile /config/.ssh/vscode_id_ed25519
      UserKnownHostsFile /config/.ssh/known_hosts
  vscode-config: |
    {
    "workbench.colorTheme": "Default Dark+"
    }


