---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode
  namespace: homeassistant
  labels:
    app: vscode
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: vscode
  template:
    metadata:
      name: vscode
      labels:
        app: vscode
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - homeassistant
            topologyKey: kubernetes.io/hostname
      containers:
        - name: vscode
          image: lscr.io/linuxserver/code-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
              name: http
            - containerPort: 22
              name: ssh
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: GIT_SSH_COMMAND
              value: ssh -4
            - name: DEFAULT_WORKSPACE
              value: /mnt
          volumeMounts:
            - name: homeassistant
              mountPath: /mnt/homeassistant
            - name: ssh-config
              mountPath: /etc/ssh/ssh_config
              subPath: ssh_config
            - name: nas-esphome
              mountPath: /mnt/esphome
          resources:
            requests:
              memory: 300Mi
              cpu: 100m
      volumes:
        - name: homeassistant
          persistentVolumeClaim:
            claimName: homeassistant
        - name: ssh-config
          configMap:
            name: ssh-config
        - name: nas-esphome
          nfs:
            server: nas01.whezzel.com
            path: /esphome
