---
apiVersion: v1
kind: Service
metadata:
  name: vscode
  namespace: homeassistant
spec:
#  ipFamilyPolicy: PreferDualStack
  selector:
    app: vscode
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: ssh
