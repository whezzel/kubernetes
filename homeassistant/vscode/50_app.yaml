---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode
  namespace: homeassistant
  labels:
    app: vscode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vscode
  template:
    metadata:
      labels:
        app: vscode
    spec:
      containers:
        - name: vscode
          image: linuxserver/code-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
              name: webui
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "0"
            - name: "PGID"
              value: "0"
#            - name: "PROXY_DOMAIN"
#              value: "whezzel.com"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: vscode
              mountPath: /config
            - name: esphome
              mountPath: /mnt/esphome
            - name: ha-core
              mountPath: /mnt/ha-core
            - name: nodered
              mountPath: /mnt/nodered
            - name: vscode
              mountPath: /mnt/vscode
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: esphome
          persistentVolumeClaim:
            claimName: esphome
        - name: ha-core
          persistentVolumeClaim:
            claimName: ha-core
        - name: nodered
          persistentVolumeClaim:
            claimName: nodered
        - name: vscode
          persistentVolumeClaim:
            claimName: vscode