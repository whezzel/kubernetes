---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode
  namespace: homeassistant
  labels:
    app: vscode
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vscode
  template:
    metadata:
      labels:
        app: vscode
    spec:
      nodeSelector:
        capacity: high
      containers:
        - name: vscode
          image: linuxserver/code-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
              name: http
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "0"
            - name: "PGID"
              value: "0"
            - name: "GIT_SSH_COMMAND"
              value: "ssh -4"
            - name: "DEFAULT_WORKSPACE"
              value: "/mnt"
#            - name: "PROXY_DOMAIN"
#              value: "whezzel.com"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: vscode
              mountPath: /config
            - name: esphome
              mountPath: /mnt/esphome
            - name: ha-core
              mountPath: /mnt/ha-core
            - name: nodered
              mountPath: /mnt/nodered
            - name: vscode
              mountPath: /mnt/vscode
            - name: ssh-config-d
              mountPath: /etc/ssh/ssh_config.d
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: esphome
          persistentVolumeClaim:
            claimName: esphome
        - name: ha-core
          persistentVolumeClaim:
            claimName: ha-core
        - name: nodered
          persistentVolumeClaim:
            claimName: nodered
        - name: vscode
          persistentVolumeClaim:
            claimName: vscode
        - name: ssh-config-d
          secret:
            secretName: ssh-config-d
