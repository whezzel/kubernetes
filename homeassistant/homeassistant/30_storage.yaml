---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: homeassistant
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: homeassistant
    name: homeassistant
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  volumeName: homeassistant
  storageClassName: longhorn
