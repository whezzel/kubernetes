---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  selector:
    app: homeassistant
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: ha-http
---
apiVersion: v1
kind: Service
metadata:
  name: zwavejs
  namespace: homeassistant
spec:
  selector:
    app: homeassistant
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: zwavejs-http
    - protocol: TCP
      name: websocket
      port: 3000
      targetPort: websocket
---
apiVersion: v1
kind: Service
metadata:
  name: vscode
  namespace: homeassistant
spec:
  selector:
    app: homeassistant
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: vscode-http
