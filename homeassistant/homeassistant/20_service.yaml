---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  selector:
    app: homeassistant
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: ha-http
---
apiVersion: v1
kind: Service
metadata:
  name: vscode
  namespace: homeassistant
spec:
  selector:
    app: homeassistant
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: vscode-http
