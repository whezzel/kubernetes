---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
#  ipFamilyPolicy: PreferDualStack
  selector:
    app: homeassistant
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant-lb
  namespace: homeassistant
spec:
#  ipFamilyPolicy: PreferDualStack
  selector:
    app: homeassistant
  ports:
    - protocol: TCP
      port: 8123
      targetPort: http
  type: LoadBalancer
  sessionAffinity: ClientIP
