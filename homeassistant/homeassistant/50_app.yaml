---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app: homeassistant
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "0 9 * * *"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: default/macvlan-conf
      name: homeassistant
      labels:
        app: homeassistant
    spec:
      #nodeSelector:
      #  kubernetes.io/hostname: archserv01
      containers:
        - name: homeassistant
          image: homeassistant/home-assistant:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8123
              #hostPort: 8123
              name: http
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: homeassistant
              mountPath: /config
            - name: nas-media
              mountPath: /media
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: homeassistant
          persistentVolumeClaim:
            claimName: homeassistant
        - name: nas-media
          nfs:
            server: archserv02.whezzel.com
            path: /mnt/netstorage/media
