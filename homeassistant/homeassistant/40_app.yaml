---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app: homeassistant
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/macvlan-conf
      name: homeassistant
      labels:
        app: homeassistant
    spec:
      containers:
        - name: homeassistant
          image: harbor.whezzel.com/proxy-docker.io/homeassistant/home-assistant:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8123
              name: ha-http
          livenessProbe:
            httpGet:
              path: /
              port: ha-http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: ha-http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PYTHONPATH
              value: /config/deps
          volumeMounts:
            - name: homeassistant
              mountPath: /config
              subPath: homeassistant
          resources:
            requests:
              memory: 700Mi
              cpu: 500m
        - name: zwavejs
          securityContext:
            privileged: true
          image: harbor.whezzel.com/proxy-docker.io/zwavejs/zwave-js-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8091
              name: zwavejs-http
            - containerPort: 3000
              name: websocket
          livenessProbe:
            httpGet:
              path: /health
              port: zwavejs-http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: zwavejs-http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: TZ
              value: America/Chicago
          volumeMounts:
            - name: homeassistant
              mountPath: /usr/src/app/store
              subPath: zwavejs
          resources:
            requests:
              memory: 128Mi
              cpu: 150m
        - name: vscode
          image: harbor.whezzel.com/proxy-lscr.io/linuxserver/code-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
              name: vscode-http
            - containerPort: 22
              name: ssh
          livenessProbe:
            httpGet:
              path: /healthz
              port: vscode-http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: vscode-http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: GIT_SSH_COMMAND
              value: ssh -4
            - name: DEFAULT_WORKSPACE
              value: /mnt
          volumeMounts:
            - name: homeassistant
              mountPath: /mnt/homeassistant
            - name: ssh-config
              mountPath: /etc/ssh/ssh_config
              subPath: ssh-config
            - name: vscode-config
              mountPath: /config/data/User/settings.json
              subPath: vscode-config
            - name: ssh-key
              mountPath: /config/.ssh/vscode_id_ed25519
              subPath: ssh-key
          resources:
            requests:
              memory: 300Mi
              cpu: 100m
      volumes:
        - name: homeassistant
          persistentVolumeClaim:
            claimName: homeassistant
        - name: ssh-config
          configMap:
            name: vscode-configmap
        - name: vscode-config
          configMap:
            name: vscode-configmap
        - name: ssh-key
          secret:
            secretName: vscode-secrets
            defaultMode: 0600
