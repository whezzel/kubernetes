---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app: homeassistant
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/macvlan-conf
      name: homeassistant
      labels:
        app: homeassistant
    spec:
#      affinity:
#        podAffinity:
#          requiredDuringSchedulingIgnoredDuringExecution:
#          - labelSelector:
#              matchExpressions:
#              - key: app
#                operator: In
#                values:
#                - esphome
#            topologyKey: "kubernetes.io/hostname"
      containers:
        - name: homeassistant
          image: homeassistant/home-assistant:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8123
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
            - name: "PYTHONPATH"
              value: "/config/deps"
          volumeMounts:
            - name: homeassistant
              mountPath: /config
          #  - name: nas-media
          #    mountPath: /media
          resources:
            requests:
              memory: 700Mi
              cpu: 500m
      volumes:
        - name: homeassistant
          persistentVolumeClaim:
            claimName: homeassistant
      #  - name: nas-media
      #    nfs:
      #      server: nas.whezzel.com
      #      path: /mnt/netstorage/media
