---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-core
  namespace: homeassistant
  labels:
    app: ha-core
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ha-core
  template:
    metadata:
      name: ha-core
      labels:
        app: ha-core
    spec:
      nodeSelector:
        kubernetes.io/hostname: archserv01
      containers:
        - name: ha-core
          image: homeassistant/home-assistant:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8123
              name: http
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: ha-core
              mountPath: /config
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "2Gi"
              cpu: "2"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: ha-core
          persistentVolumeClaim:
            claimName: ha-core
