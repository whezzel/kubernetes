---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: esphome
  namespace: homeassistant
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: esphome
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: homeassistant
    name: esphome
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome
  namespace: homeassistant
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  volumeName: esphome
  storageClassName: longhorn
