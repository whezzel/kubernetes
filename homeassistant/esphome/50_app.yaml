---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  namespace: homeassistant
  labels:
    app: esphome
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esphome
  template:
    metadata:
      name: esphome
      labels:
        app: esphome
    spec:
      nodeSelector:
        kubernetes.io/hostname: archserv01
      containers:
        - name: esphome
          image: esphome/esphome:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6052
              name: http
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
            - name: "ESPHOME_DASHBOARD_USE_PING"
              value: "true"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: esphome
              mountPath: /config
          resources:
            requests:
              memory: "2Gi"
              cpu: "2"
            limits:
              memory: "4Gi"
              cpu: "4"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: esphome
          persistentVolumeClaim:
            claimName: esphome
