---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  namespace: homeassistant
  labels:
    app: esphome
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: esphome
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/macvlan-conf
      name: esphome
      labels:
        app: esphome
    spec:
      containers:
        - name: esphome
          image: ghcr.io/esphome/esphome:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6052
              name: http
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
            - name: "ESPHOME_DASHBOARD_USE_PING"
              value: "true"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: esphome
              mountPath: /config
          resources:
            requests:
              memory: "400Mi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "4"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: esphome
          persistentVolumeClaim:
            claimName: esphome
