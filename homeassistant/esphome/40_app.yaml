---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  namespace: homeassistant
  labels:
    app: esphome
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: esphome
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/macvlan-conf
      name: esphome
      labels:
        app: esphome
    spec:
      containers:
        - name: esphome
          image: ghcr.io/esphome/esphome:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6052
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: ESPHOME_DASHBOARD_USE_PING
              value: "false"
            - name: ESPHOME_BUILD_PATH
              value: /cache
          volumeMounts:
            - name: nas-esphome
              mountPath: /config
            - name: esphome-cache
              mountPath: /cache
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 4Gi
              cpu: 8000m
      volumes:
        - name: nas-esphome
          nfs:
            server: nas.whezzel.com
            path: /mnt/netstorage/backups/esphome
        - name: tmp-cache
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: esphome-cache
          persistentVolumeClaim:
            claimName: esphome-cache

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome-cache
  namespace: homeassistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-db
  resources:
    requests:
      storage: 12Gi
