---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  namespace: homeassistant
  labels:
    app: esphome
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: esphome
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/macvlan-conf
      name: esphome
      labels:
        app: esphome
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: esphome
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          image: ghcr.io/esphome/esphome:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6052
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: TZ
              value: America/Chicago
            - name: ESPHOME_BUILD_PATH
              value: /cache
            - name: PLATFORMIO_CORE_DIR
              value: /cache/.platformio
            - name: HOME
              value: /cache/home
          volumeMounts:
            - name: nas-esphome
              mountPath: /config
            - name: esphome-cache
              mountPath: /cache
          resources:
            limits:
              memory: 4Gi
              cpu: 8000m
      volumes:
        - name: nas-esphome
          nfs:
            server: nas01-20.whezzel.com
            path: /esphome
        - name: esphome-cache
          persistentVolumeClaim:
            claimName: esphome-cache
