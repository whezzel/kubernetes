---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodered
  namespace: homeassistant
  labels:
    app: nodered
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: nodered
  template:
    metadata:
      name: nodered
      labels:
        app: nodered
    spec:
      containers:
        - name: nodered
          image: nodered/node-red:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1880
              name: http
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
          volumeMounts:
            - name: nodered
              mountPath: /data
          resources:
            requests:
              memory: "350Mi"
              cpu: "100m"
      volumes:
        - name: nodered
          persistentVolumeClaim:
            claimName: nodered
