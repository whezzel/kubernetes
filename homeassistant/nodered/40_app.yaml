---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodered
  namespace: homeassistant
  labels:
    app: nodered
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: nodered
  template:
    metadata:
      name: nodered
      labels:
        app: nodered
    spec:
      containers:
        - name: nodered
          image: harbor.whezzel.com/proxy-docker.io/nodered/node-red:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 1880
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: nodered
              mountPath: /data
          resources:
            requests:
              memory: 256Mi
              cpu: 350m
      volumes:
        - name: nodered
          persistentVolumeClaim:
            claimName: nodered
