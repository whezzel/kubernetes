---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtlamr2mqtt
  namespace: homeassistant
  labels:
    app: rtlamr2mqtt
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: rtlamr2mqtt
  template:
    metadata:
      name: rtlamr2mqtt
      labels:
        app: rtlamr2mqtt
    spec:
      nodeSelector:
        rtlsdr-present: "true"
      containers:
        - name: rtlamr2mqtt
          securityContext:
            privileged: true
          image: allangood/rtlamr2mqtt:latest
          imagePullPolicy: Always
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
          #  - name: "LISTEN_ONLY"
          #    value: "yes"
          #  - name: "RTL_MSGTYPE"
          #    value: "all"
          volumeMounts:
            - name: usb
              mountPath: /dev/bus/usb
              readOnly: true
            - name: rtlamr2mqtt-yaml
              mountPath: "/etc/rtlamr2mqtt.yaml"
              readOnly: true
              subPath: rtlamr2mqtt.yaml
          resources:
            requests:
              memory: "128Mi"
              cpu: "800m"
      volumes:
        - name: usb
          hostPath:
            path: /dev/bus/usb
        - name: rtlamr2mqtt-yaml
          configMap:
            name: rtlamr2mqtt-yaml
