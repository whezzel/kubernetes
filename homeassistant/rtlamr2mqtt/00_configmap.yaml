---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rtlamr2mqtt-yaml
  namespace: homeassistant
data:
  rtlamr2mqtt.yaml: |
    ---
    general:
      sleep_for: 0
    #  verbosity: debug
      verbosity: info
      tickle_rtl_tcp: true
      device_id: '0bda:2838'

    mqtt:
      ha_autodiscovery: true
      ha_autodiscovery_topic: homeassistant
      base_topic: rtlamr
      host: mosquitto-tcp.homeassistant
      port: 1883
      tls_enabled: false
      tls_ca: "/etc/ssl/certs/ca-certificates.crt"
      tls_cert: "/etc/ssl/my_server_cert.crt"
      tls_insecure: true
      user: rtlamr2mqtt
      password: DZt*2K43q^KjAZ&9o8z*#gsLQ*3G&h8QW@R$9r#p^tonR9d2

    custom_parameters:
      rtltcp: "-s 2048000"
      rtlamr: "-unique=true -symbollength=32"

    meters:
      - id: 1546747850
        protocol: R900
        name: water_meter
        format: "#######.#"
        unit_of_measurement: "gal"
        icon: mdi:gauge
        device_class: water
