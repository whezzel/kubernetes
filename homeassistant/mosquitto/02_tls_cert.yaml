---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mosquitto-tls
  namespace: homeassistant
spec:
  commonName: mosquitto.homeassistant.svc.cluster.local
  dnsNames:
    - mosquitto-tcp.homeassistant.svc.cluster.local
    - mosquitto-tcp.homeassistant
    - mosquitto-tcp
    - mqtt.whezzel.com
  secretName: mosquitto-tls
  issuerRef:
    name: selfsigned-ca
    kind: ClusterIssuer
    group: cert-manager.io
