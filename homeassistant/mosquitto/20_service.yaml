---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-tcp
  namespace: homeassistant
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mqtt.whezzel.com
spec:
  selector:
    app: mosquitto
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  ports:
    - protocol: TCP
      name: mqtt
      port: 1883
      targetPort: mqtt
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
