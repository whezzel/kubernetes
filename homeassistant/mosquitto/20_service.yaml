---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-tcp
  namespace: homeassistant
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mqtt.whezzel.com
spec:
  selector:
    app: mosquitto
  ports:
    - protocol: TCP
      name: mqtt
      port: 1883
      targetPort: mqtt
    - protocol: TCP
      name: websocket
      port: 9001
      targetPort: websocket
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
