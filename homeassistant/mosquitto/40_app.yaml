---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: homeassistant
  labels:
    app: mosquitto
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      name: mosquitto
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: docker.io/eclipse-mosquitto:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 1883
              name: mqtt
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pidof mosquitto || exit 1'
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pidof mosquitto || exit 1'
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: TZ
              value: America/Chicago
          volumeMounts:
            - name: mosquitto
              mountPath: /mosquitto/config
              subPath: config
            - name: mosquitto
              mountPath: /mosquitto/data
              subPath: data
            - name: mosquitto
              mountPath: /mosquitto/log
              subPath: log
            - name: certs
              mountPath: /ssl
      volumes:
        - name: mosquitto
          persistentVolumeClaim:
            claimName: mosquitto
        - name: certs
          secret:
            secretName: mosquitto-tls
