---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mosquitto
  namespace: homeassistant
spec:
  capacity:
    storage: 128Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: mosquitto
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: homeassistant
    name: mosquitto
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto
  namespace: homeassistant
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 128Mi
  volumeName: mosquitto
  storageClassName: longhorn
