---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zwavejs2mqtt
  namespace: homeassistant
  labels:
    app: zwavejs2mqtt
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: zwavejs2mqtt
  template:
    metadata:
      name: zwavejs2mqtt
      labels:
        app: zwavejs2mqtt
    spec:
      nodeSelector:
        zwave-present: "true"
      containers:
        - name: zwavejs2mqtt
          securityContext:
            privileged: true
          image: zwavejs/zwavejs2mqtt:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8091
              name: http
            - containerPort: 3000
              name: websocket
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: TZ
              value: America/Chicago
          volumeMounts:
            - name: dev
              mountPath: /dev
              readOnly: true
            - name: zwavejs2mqtt
              mountPath: /usr/src/app/store
          resources:
            requests:
              memory: 128Mi
              cpu: 150m
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: zwavejs2mqtt
          persistentVolumeClaim:
            claimName: zwavejs2mqtt
