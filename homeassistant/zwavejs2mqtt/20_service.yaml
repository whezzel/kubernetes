---
apiVersion: v1
kind: Service
metadata:
  name: zwavejs2mqtt
  namespace: homeassistant
spec:
  selector:
    app: zwavejs2mqtt
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - protocol: TCP
      name: websocket
      port: 3000
      targetPort: websocket
