---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: homeassistant
  labels:
    app: zigbee2mqtt
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      name: zigbee2mqtt
      labels:
        app: zigbee2mqtt
    spec:
      nodeSelector:
        zigbee-present: "true"
      containers:
        - name: zigbee2mqtt
          securityContext:
            privileged: true
          #image: ghcr.io/koenkk/zigbee2mqtt:1.42.0
          image: ghcr.io/koenkk/zigbee2mqtt:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: TZ
              value: America/Chicago
          envFrom:
            - secretRef:
                name: zigbee2mqtt-secrets
          volumeMounts:
            - name: dev
              mountPath: /dev
              readOnly: true
            - name: zigbee2mqtt
              mountPath: /app/data
            - name: selfsigned-ca
              mountPath: /etc/ssl/certs/selfsigned-ca.crt
              readOnly: true
              subPath: tls.crt
          resources:
            requests:
              memory: 64Mi
              cpu: 150m
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: zigbee2mqtt
          persistentVolumeClaim:
            claimName: zigbee2mqtt
        - name: selfsigned-ca
          secret:
            secretName: selfsigned-ca
