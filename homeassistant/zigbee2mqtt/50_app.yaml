---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: homeassistant
  labels:
    app: zigbee2mqtt
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      name: zigbee2mqtt
      labels:
        app: zigbee2mqtt
    spec:
      nodeSelector:
        kubernetes.io/hostname: archpi01
      containers:
        - name: zigbee2mqtt
          securityContext:
            privileged: true
          image: koenkk/zigbee2mqtt:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: "TZ"
              value: "America/Chicago"
          envFrom:
            - secretRef:
                name: zigbee2mqtt-secrets
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: dev
              mountPath: /dev
              readOnly: true
            - name: zigbee2mqtt
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: dev
          hostPath:
            path: /dev
        - name: zigbee2mqtt
          persistentVolumeClaim:
            claimName: zigbee2mqtt
