---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zigbee2mqtt
  namespace: homeassistant
spec:
  capacity:
    storage: 128Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: zigbee2mqtt
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: homeassistant
    name: zigbee2mqtt
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt
  namespace: homeassistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
  volumeName: zigbee2mqtt
  storageClassName: longhorn
