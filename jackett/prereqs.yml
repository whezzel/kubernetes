---
apiVersion: v1
kind: Namespace
metadata:
  name: seedbox
---
apiVersion: v1
kind: Service
metadata:
  name: jackett-service
  namespace: seedbox
spec:
  selector:
    app: jackett
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9117
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jackett-ingress
  namespace: seedbox
spec:
  rules:
    - host: jackett-k3s.nomacsec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jackett-service
                port:
                  number: 80
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jackett-pv
spec:
  storageClassName: local
  capacity:
    storage: 50Mi
  accessModes:
    - ReadWriteOnce
  claimRef:
    name: jackett-pvc
    namespace: seedbox
  hostPath:
    path: /mnt/raid10/k3s-storage/jackett
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jackett-pvc
  namespace: seedbox
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local
  volumeName: jackett-pv
  resources:
    requests:
      storage: 50Mi