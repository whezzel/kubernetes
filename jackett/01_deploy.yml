apiVersion: apps/v1
kind: Deployment
metadata:
  name: jackett-deployment
  namespace: seedbox
  labels:
    app: jackett
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jackett
  template:
    metadata:
      labels:
        app: jackett
    spec:
      containers:
        - name: jackett
          image: linuxserver/jackett:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9117
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: jackett
              mountPath: /config
              subPath: config
            - name: nas-media
              mountPath: /downloads
      volumes:
        - name: nas-media
          nfs:
            server: nas01.whezzel.com
            path: /mnt/netstorage/media/downloads/.torrents
        - name: jackett
          persistentVolumeClaim:
            claimName: jackett-pvc