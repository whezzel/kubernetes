---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mariadb
  namespace: database
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: mariadb
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: database
    name: mariadb
