---
apiVersion: v1
kind: Service
metadata:
  name: pihole01-web
  namespace: dns
spec:
#  ipFamilyPolicy: PreferDualStack
  selector:
    app: pihole01
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pihole01-lb
  namespace: dns
spec:
  selector:
    app: pihole01
  ports:
    - protocol: TCP
      name: dns-tcp
      port: 53
      targetPort: dns-tcp
    - protocol: UDP
      name: dns-udp
      port: 53
      targetPort: dns-udp
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
  loadBalancerIP: 10.69.21.11
