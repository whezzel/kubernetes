---
apiVersion: v1
kind: Service
metadata:
  name: pihole01-web
  namespace: dns
spec:
  selector:
    app: pihole01
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pihole01-lb
  namespace: dns
  annotations:
    lbipam.cilium.io/ips: "10.69.21.198,fd69:0:0:21::198"
spec:
  selector:
    app: pihole01
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  ports:
    - protocol: TCP
      name: dns-tcp
      port: 53
      targetPort: dns-tcp
    - protocol: UDP
      name: dns-udp
      port: 53
      targetPort: dns-udp
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
