---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole01
  namespace: dns
spec:
  tls:
    - {}
  ingressClassName: nginx
  rules:
    - host: pihole01.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pihole01-web
                port:
                  name: http
