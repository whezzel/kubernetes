---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pihole01
  namespace: dns
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: pihole01
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: dns
    name: pihole01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole01
  namespace: dns
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
  volumeName: pihole01
