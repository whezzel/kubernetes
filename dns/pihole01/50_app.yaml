---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole01
  namespace: dns
  labels:
    app: pihole01
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole01
  template:
    metadata:
      name: pihole01
      labels:
        app: pihole01
    spec:
      nodeSelector:
        kubernetes.io/hostname: archserv04
      containers:
        - name: pihole01
          image: pihole/pihole:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
            - containerPort: 53
              hostPort: 53
              protocol: TCP
              name: dns-tcp
            - containerPort: 53
              hostPort: 53
              protocol: UDP
              name: dns-udp
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
            - name: "PIHOLE_DNS_"
              value: "10.69.20.11;10.69.20.12"
            - name: "DNS_FQDN_REQUIRED"
              value: "false"
            - name: "DNSSEC"
              value: "false"
            - name: "CUSTOM_CACHE_SIZE"
              value: "0"
            - name: "DNS_BOGUS_PRIV"
              value: "false"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: pihole01
              mountPath: /etc/pihole
              subPath: pihole
            - name: pihole01
              mountPath: /etc/dnsmasq.d
              subPath: dnsmasq
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: pihole01
          persistentVolumeClaim:
            claimName: pihole01
