---
apiVersion: v1
kind: Service
metadata:
  name: bind-lb
  namespace: dns
spec:
  selector:
    app: bind
  ports:
    - protocol: TCP
      name: dns-tcp
      port: 53
      targetPort: dns-tcp
    - protocol: UDP
      name: dns-udp
      port: 53
      targetPort: dns-udp
    - protocol: TCP
      name: dns-rndc
      port: 953
      targetPort: dns-rndc
    - protocol: TCP
      name: dns-stats
      port: 8053
      targetPort: dns-stats
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
  loadBalancerIP: 10.69.21.200
