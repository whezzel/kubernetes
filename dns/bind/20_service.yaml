---
apiVersion: v1
kind: Service
metadata:
  name: bind-lb
  namespace: dns
  annotations:
    lbipam.cilium.io/ips: "10.69.21.200,fd69:0:0:21::200"
    external-dns.kubernetes.io/hostname: bind.whezzel.com
spec:
  selector:
    app: bind
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  ports:
    - protocol: TCP
      name: dns-tcp
      port: 53
      targetPort: dns-tcp
    - protocol: UDP
      name: dns-udp
      port: 53
      targetPort: dns-udp
  type: LoadBalancer
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
