---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bind-dns-config
  namespace: dns
data:
  named.conf: |
    acl "internal" { localhost; 10.244.0.0/16; fd6a:0:244::/56; 10.69.0.0/16; fd69::/48; };
    acl "external" { 0.0.0.0/0; };
    acl "opnsense" { 10.69.20.2; 10.69.20.3; fd69:0:0:20::2; fd69:0:0:20::3; };
    acl "internal-keys" { key internal; key arch01-internal; key external-dns-internal; };
    acl "external-keys" { key external; };
    acl "opnsense-keys" { key opnsense; };

    options {
        directory "/var/lib/bind/working";
        dnssec-validation auto;
        hostname none;
        max-cache-size 1%;
        notify no;
        prefetch 0;
        querylog no;
        recursion no;
        version none;
        statistics-file "/var/lib/bind/stats/named.stats";
        listen-on { any; };
        listen-on-v6 { any; };
    };

    include "/etc/bind/rndc-keys.conf";

    controls { inet 0.0.0.0 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };
    statistics-channels { inet 0.0.0.0 port 8053; };

    view "internal" {
        match-clients { !external-keys; opnsense-keys; internal-keys; internal; };
        allow-recursion { internal-keys; internal; };
        allow-transfer { !external-keys; opnsense-keys; internal-keys; };
        allow-query { internal-keys; internal; };
        allow-update { !external-keys; opnsense-keys; internal-keys; };
        recursion yes;
        notify explicit;
        zone "localhost" { type primary; file "/var/lib/bind/localhost.db"; };
        zone "127.in-addr.arpa" { type primary; file "/var/lib/bind/127.in-addr.arpa.db"; };
        zone "whezzel.com" { type primary; file "/var/lib/bind/internal/whezzel.com.db"; also-notify { 10.69.20.2 key internal; 10.69.20.3 key internal; fd69:0:0:20::2 key internal; fd69:0:0:20::3 key internal; }; };
        zone "69.10.in-addr.arpa" { type primary; file "/var/lib/bind/internal/69.10.in-addr.arpa.db"; also-notify { 10.69.20.2 key internal; 10.69.20.3 key internal; fd69:0:0:20::2 key internal; fd69:0:0:20::3 key internal; }; };
        zone "0.0.0.0.0.0.0.0.9.6.d.f.ip6.arpa" { type primary; file "/var/lib/bind/internal/0.0.0.0.0.0.0.0.9.6.d.f.ip6.arpa.db"; also-notify { 10.69.20.2 key internal; 10.69.20.3 key internal; fd69:0:0:20::2 key internal; fd69:0:0:20::3 key internal; }; };
    };

    #view "external" {
    #    match-clients { !key internal; external; };
    #    allow-transfer { key rndc-key; key external; };
    #    allow-query { any; };
    #    allow-update { none; };
    #    recursion no;
    #    notify explicit;
    #    zone "whezzel.xyz" { type primary; file "/var/lib/bind/external/whezzel.xyz.db"; dnssec-policy default; inline-signing true; also-notify { 10.69.20.2 key external; 10.69.20.3 key external; fd69:0:0:20::2 key external; fd69:0:0:20::3 key external; }; allow-update { key rndc-key; key arch01_external; key Ggm0G6qvMys=; }; };
    #};

    logging {
        channel stdout { stderr; severity info; print-category no; print-severity no; print-time yes; };
        category security { stdout; };
        category dnssec { stdout; };
        category default { stdout; };
        category queries { stdout; };
    };
