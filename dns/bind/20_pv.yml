---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bind-pv
  namespace: dns
spec:
  capacity:
    storage: 500Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-sas
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: '1'
      staleReplicaTimeout: '2880'
    volumeHandle: bind
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: dns
    name: bind-pvc