---
apiVersion: v1
kind: Service
metadata:
  name: bind-udp
  namespace: dns
spec:
  selector:
    app: bind
  ports:
    - protocol: UDP
      name: dns-udp
      port: 53
      targetPort: dns-udp
  type: LoadBalancer
  sessionAffinity: ClientIP
---
apiVersion: v1
kind: Service
metadata:
  name: bind-tcp
  namespace: dns
spec:
  selector:
    app: bind
  ports:
    - protocol: TCP
      name: dns-tcp
      port: 53
      targetPort: dns-tcp
    - protocol: TCP
      name: dns-rndc
      port: 953
      targetPort: dns-rndc
  type: LoadBalancer
  sessionAffinity: ClientIP
