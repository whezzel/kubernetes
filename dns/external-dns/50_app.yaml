---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
  namespace: dns
rules:
- apiGroups:
  - ""
  resources:
  - services
  - endpoints
  - pods
  - nodes
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-viewer
  namespace: dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
- kind: ServiceAccount
  name: external-dns
  namespace: dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: dns
spec:
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.10.2
        args:
        - --registry=txt
        - --txt-prefix=external-dns-
        - --txt-owner-id=k3s
        - --provider=rfc2136
        - --rfc2136-host=$(RFC2136_HOST)
        - --rfc2136-port=53
        - --rfc2136-zone=$(RFC2136_ZONE)
        - --rfc2136-tsig-secret=$(RFC2136_TSIG_SECRET)
        - --rfc2136-tsig-secret-alg=hmac-sha512
        - --rfc2136-tsig-keyname=k3s-external-dns
        - --rfc2136-tsig-axfr
        - --source=ingress
        - --domain-filter=$(DOMAIN_FILTER)
        envFrom:
          - secretRef:
              name: external-dns-secrets
