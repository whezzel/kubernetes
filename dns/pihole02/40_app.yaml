---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole02
  namespace: dns
  labels:
    app: pihole02
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: pihole02
  template:
    metadata:
      name: pihole02
      labels:
        app: pihole02
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - pihole01
            topologyKey: kubernetes.io/hostname
      containers:
        - name: pihole02
          image: ghcr.io/pi-hole/pihole:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
            - containerPort: 53
              protocol: TCP
              name: dns-tcp
            - containerPort: 53
              protocol: UDP
              name: dns-udp
          env:
            - name: TZ
              value: America/Chicago
            - name: "PUID"
              value: "1000"
            - name: PGID
              value: "1000"
            - name: FTLCONF_DNS_UPSTREAMS
              value: 10.69.20.2;10.69.20.3;fd69:0:0:20::2;fd69:0:0:20::3
            - name: FTLCONF_DNS_DOMAINNEEDED
              value: "false"
            - name: FTLCONF_DNS_DNSSEC
              value: "false"
            - name: FTLCONF_DNS_CACHE_SIZE
              value: "0"
            - name: FTLCONF_DNS_BOGUSPRIV
              value: "false"
            - name: FTLCONF_WEBSERVER_API_APP_SUDO
              value: "true"
          volumeMounts:
            - name: pihole02
              mountPath: /etc/pihole
              subPath: pihole
            - name: pihole02
              mountPath: /etc/dnsmasq.d
              subPath: dnsmasq
      volumes:
        - name: pihole02
          persistentVolumeClaim:
            claimName: pihole02
