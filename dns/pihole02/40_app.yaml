---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole02
  namespace: dns
  labels:
    app: pihole02
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: pihole02
  template:
    metadata:
      name: pihole02
      labels:
        app: pihole02
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - pihole01
            topologyKey: "kubernetes.io/hostname"
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - bind
            topologyKey: "kubernetes.io/hostname"
      #nodeSelector:
      #  kubernetes.io/hostname: archserv05
      containers:
        - name: pihole02
          image: pihole/pihole:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
            - containerPort: 53
            #  hostPort: 53
              protocol: TCP
              name: dns-tcp
            - containerPort: 53
            #  hostPort: 53
              protocol: UDP
              name: dns-udp
          env:
            - name: "TZ"
              value: "America/Chicago"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
            - name: "PIHOLE_DNS_"
              value: "10.69.20.2;10.69.20.3"
            - name: "DNS_FQDN_REQUIRED"
              value: "false"
            - name: "DNSSEC"
              value: "false"
            - name: "CUSTOM_CACHE_SIZE"
              value: "0"
            - name: "DNS_BOGUS_PRIV"
              value: "false"
            - name: "IPv6"
              value: "false"
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: pihole02
              mountPath: /etc/pihole
              subPath: pihole
            - name: pihole02
              mountPath: /etc/dnsmasq.d
              subPath: dnsmasq
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/America/Chicago
        - name: pihole02
          persistentVolumeClaim:
            claimName: pihole02
