---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole02
  namespace: dns
  annotations:
spec:
  tls:
    - secretName: ""
  ingressClassName: "nginx"
  rules:
    - host: pihole02.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pihole02-web
                port:
                  name: http
