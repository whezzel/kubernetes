---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole02
  namespace: dns
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.69.0.0/16, fd69:0:0:2::/64, fd69:0:0:40::/64, fd69:0:0:100::/64"
spec:
  tls:
    - {}
  ingressClassName: nginx
  rules:
    - host: pihole02.whezzel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pihole02-web
                port:
                  name: http
