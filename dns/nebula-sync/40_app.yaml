---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-sync
  namespace: dns
  labels:
    app: nebula-sync
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 10m"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nebula-sync
  template:
    metadata:
      name: nebula-sync
      labels:
        app: nebula-sync
    spec:
      containers:
        - name: nebula-sync
          image: ghcr.io/lovelaze/nebula-sync:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: nebula-sync-secrets
          env:
            - name: TZ
              value: America/Chicago
            - name: FULL_SYNC
              value: "true"
            - name: RUN_GRAVITY
              value: "false"
            - name: CRON
              value: "*/10 * * * *"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
